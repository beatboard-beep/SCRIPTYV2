<!DOCTYPE html>

<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>ScriptY — Home</title>
<style>
:root{
    /* Physical page */
    --a4w-mm: 215.9;
    --a4h-mm: 279.4;

    /* Margins (page-edge based) */
    --m-top-mm: 25.4;   /* 2.55cm (measured) */
    --m-bot-mm: 25.4;   /* ~2.45cm (measured) */
    --m-right-mm: 25.4;   /* 2.5cm */
    --m-left-mm: 38.1;    /* 3.9cm */


    /* Title page margins (Final Draft style: centered on full page, not script text column) */
    --tp-left-mm: 25.4;   /* match right so title text is truly centered on page */
    --tp-right-mm: 25.4;

    /* Wrap calibration (mm): tweak to match Final Draft line breaks across browser fonts */
    --wrap-cal-mm: 0;  /* wrap calibration (mm): adjust only if needed */

    /* Header band reserved for page number (non-editable) */
    --header-band-mm: 12;

    /* Baseline step (physical units) */
    --baseline-mm: 4.233; /* ~12pt in mm (12pt = 4.233mm) */
    --baseline-cal: 1.000; /* hidden calibration knob */
    --baseline-step-mm: calc(var(--baseline-mm) * var(--baseline-cal));

    /* Font */
    --font-size-pt: 12;
    --font-stack: "Courier Final Draft","Courier Prime","Courier New",monospace;

    /* Geometry (mm) – filled by JS */
    --x-action-L-mm: 39;
    --x-action-R-mm: 25;
    --x-character-L-mm: 0;
    --x-character-R-mm: 25;
    --x-dialogue-L-mm: 0;
    --x-dialogue-R-mm: 0;
    --x-paren-L-mm: 0;
    --x-paren-R-mm: 0;
    --x-trans-R-mm: 25;

    /* UI */
    --ui-bg: #101114;
    --ui-panel: #171922;
    --ui-border: #2a2f3a;
    --ui-text: #e9ecf2;
    --ui-muted: #c5cad6;
    --ui-accent: #5b8cff;
  }

  

html, body {
  height: 100%;
}
body{
  margin:0;
  font-family: var(--font-stack, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
  background: radial-gradient(1400px 800px at 20% 10%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg, #0c0d10);
  color: var(--ui-text, #e7e9ef);
}

a{ color: inherit; }

.homeView{
    position: fixed;
    inset: 0;
    z-index: 9000;
    background: radial-gradient(1200px 700px at 20% 0%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg);
    color: var(--ui-text);
    display: none;
  }
  .homeView.show{ display:block; }
  .homeInner{
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }
  .homeTop{
    display:flex;
    align-items:center;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .homeBrand{
    display:flex; align-items:baseline; gap:10px;
  }
  .homeBrand .t1{ font-weight:700; letter-spacing:.3px; }
  .homeBrand .t2{ color: var(--ui-muted); font-size: 12px; }
  .homeActions{ display:flex; gap:10px; align-items:center; }
  .homeBtn{
    border: 1px solid var(--ui-border);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: var(--ui-text);
    padding: 10px 12px;
    border-radius: 12px;
    cursor:pointer;
    font-weight: 600;
transition: all 0.2s ease;
  }
  .homeBtn:hover {
  filter: brightness(1.10);
  transform: translateY(-1px);
}
  .homeBtn.primary {
  border-color: rgba(255,255,255,0.35);
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08));
}
  .homeSearchRow{
    display:flex;
    gap: 10px;
    align-items:center;
    margin: 14px 0 18px;
  }
  .homeSearch {
  flex: 1;
  border: 1px solid var(--ui-border);
  background: rgba(23,25,34,0.65);
  color: var(--ui-text);
  padding: 12px 16px;
  border-radius: 12px;
  outline: none;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px;
  transition: all 0.2s ease;
}
  .homeHint{ color: var(--ui-muted); font-size: 12px; }
  .homeSectionTitle{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 24px 2px 1px;
  }
  .homeSectionTitle b {
  font-size: 13px;
  letter-spacing: .25px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
  @media (max-width: 980px){ .homeGrid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 620px){ .homeGrid{ grid-template-columns: 1fr; } }

  .docCard{
    border: 1px solid var(--ui-border);
    background: rgba(23,25,34,0.70);
    border-radius: 16px;
    padding: 14px 14px 12px;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    transition: transform .10s ease, filter .10s ease;
  }
  .docCard:hover{ transform: translateY(-1px); filter: brightness(1.05); }
  .docName{ font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .docMeta{ display:flex; gap:10px; color: var(--ui-muted); font-size: 12px; }
  .docMeta .dot{ opacity:.6; }
  .docEmpty{
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(23,25,34,0.35);
    border-radius: 16px;
    padding: 18px;
    color: var(--ui-muted);
    font-size: 13px;
  }
  .homeFooter{
    margin-top: 16px;
    color: var(--ui-muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .homeFooter code{
    font-family: var(--font-stack);
    font-size: 12px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
  }


/* In index.html, Home is the whole page */
.homeView{ position: relative; inset: auto; display:block; }
.homeView.show{ display:block; }

/* Fix the broken card class mismatch by defining the actual classes used here */
.homeGrid{ 
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: start; 
}

/* Doc-card (Google Docs-ish) */
.homeCard{
  appearance:none;
  border: 1px solid var(--ui-border);
  background: rgba(23,25,34,0.70);
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 10px 24px rgba(0,0,0,0.22);
  transition: filter .10s ease, border-color .10s ease;
}

/* Hover lift is applied to an inner wrapper so the card's hover hitbox doesn't move (prevents jitter). */
.homeCardInner{
  display:block;
  width:100%;
  height:100%;
  transform: translateY(0);
  transition: transform .10s ease;
  will-change: transform;
}
.homeCard:hover .homeCardInner{ transform: translateY(-2px); }
.homeCard:hover{ filter: brightness(1.08); }
.homeCard:focus{ outline: none; border-color: rgba(255,255,255,0.28); box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.22); }

.homeThumb{
  /* Mini A4 page thumbnail (portrait) */
  height: auto;
  aspect-ratio: 210 / 297; /* A4 */
  background: rgba(0,0,0,0.18);
  border-bottom: 1px solid rgba(255,255,255,0.10);
  position: relative;
}

/* The "paper" inside the thumbnail */
.homeThumb .thumbPaper{
  position:absolute;
  inset: 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.98);
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 14px 34px rgba(0,0,0,0.35);
  overflow: hidden;
}

/* Title-page preview typography */
.homeThumb .tpTitle,
.homeThumb .tpBy,
.homeThumb .tpName{
  position:absolute;
  left: 10%;
  right: 10%;
  text-align: center;
  color: #111;
  font-family: var(--font-stack);
  letter-spacing: .25px;
}

.homeThumb .tpTitle{
  top: 34%;
  font-weight: 700;
  font-size: 10px;
  line-height: 1.12;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homeThumb .tpBy{
  top: 40%;
  font-size: 8px;
  opacity: .85;
}
.homeThumb .tpName{
  top: 46%;
  font-size: 9px;
  font-weight: 600;
  opacity: .95;
}

.homeThumb .tpContact{
  position:absolute;
  left: 8%;
  bottom: 8%;
  width: 56%;
  text-align: left;
  font-size: 6.7px;
  line-height: 1.15;
  color: rgba(0,0,0,0.75);
  white-space: pre-line;
  overflow: hidden;
  max-height: 32%;
}

/* If fields are empty, hide them cleanly */
.homeThumb .isEmpty{ display:none; }

.homeThumbLabel{ display:none; }

.homeCardBody {
  padding: 16px 18px 18px;
}
.homeCardTitle{
  color: #ffffff;
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homeCardMeta{
  margin-top: 8px;
  font-size: 12px;
  color: #ffffff;
  opacity: .72;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 12px;
}
.homeEmpty {
  grid-column: 1 / -1;
  padding: 32px 24px;
  border-radius: 16px;
  border: 1px dashed rgba(255,255,255,0.20);
  background: rgba(255,255,255,0.04);
  opacity: .90;
  text-align: center;
}
.homeFooter{
  margin-top: 18px;
  opacity: .65;
  padding: 0 6px;
}


/* --- Placeholder (skeleton) cards for layout preview --- */
.homeCard.isPlaceholder{
  cursor: default;
}
.homeCard.isPlaceholder:hover{
  transform: none;
  box-shadow: 0 10px 24px rgba(0,0,0,0.22);
  border-color: var(--ui-border);
  filter: brightness(1);  /* ADD THIS LINE */
}
.skel{
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
}
.skel::after {
  content: "";
  position: absolute;
  inset: -40% -60%;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.12) 45%,
    rgba(255,255,255,0.00) 70%);
  transform: rotate(12deg);
  animation: skelShimmer 1.35s ease-in-out infinite;
}
@keyframes skelShimmer{
  0%{ transform: translateX(-35%) rotate(12deg); }
  100%{ transform: translateX(35%) rotate(12deg); }
}
.homeThumb.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.homeDocIcon {
  width: 44px;
  height: 56px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06);
  position: relative;
  box-shadow: 0 10px 22px rgba(0,0,0,0.20);
}
.homeDocIcon:before{
  content:"";
  position:absolute;
  left:10px; right:10px; top:14px;
  height:3px;
  border-radius:3px;
  background: rgba(255,255,255,0.22);
  box-shadow:
    0 10px 0 rgba(255,255,255,0.16),
    0 20px 0 rgba(255,255,255,0.12),
    0 30px 0 rgba(255,255,255,0.10);
}
.homeTextLines{
  width: 62%;
  max-width: 220px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.homeLine{
  height: 12px;
  border-radius: 999px;
}
.homeLine.short{ width: 55%; }
.homeLine.long{ width: 92%; opacity: .95; }




/* --- Modal system (Cloud / Open) --- */
.modalShade{
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 26px 18px;
  background: rgba(0,0,0,0.62);
  z-index: 99999;
}
.modalShade.show{ display:flex; }
.modal{
  width: min(560px, 92vw);
  background: rgba(23,25,34,0.98);
  border: 1px solid var(--ui-border);
  border-radius: 16px;
  padding: 16px 16px 14px;
  box-shadow: 0 26px 70px rgba(0,0,0,0.55);
}
.modalTop{
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.modalTitle{ font-weight: 800; letter-spacing: .2px; }
.modalClose{
  border: 1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  padding: 8px 10px;
  border-radius: 12px;
  cursor:pointer;
  font-weight: 700;
}
.modalClose:hover{ filter: brightness(1.06); }
.modalLabel{
  font-size: 12px;
  color: var(--ui-muted);
  margin: 10px 2px 6px;
}
.modalInput{
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--ui-border);
  background: rgba(10,11,14,0.55);
  color: var(--ui-text);
  padding: 10px 12px;
  border-radius: 12px;
  outline: none;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.modalInput:focus {
  border-color: rgba(255,255,255,0.45);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.12);
}
.modalRow{
  display:flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 12px;
}
.modalBtn{
  border: 1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  padding: 9px 12px;
  border-radius: 12px;
  cursor:pointer;
  font-weight: 700;
}
.modalBtn:hover{ filter: brightness(1.06); }
.modalBtn.primary{
  border-color: rgba(90,130,255,0.55);
  background: linear-gradient(180deg, rgba(90,130,255,0.25), rgba(90,130,255,0.10));
}
/* --- UI CLEANUP PATCH (hide non-essential hints) --- */
.homeFooter{ display:none !important; }
/* Hide small status/count chips that clutter the corner */
.homeHint{ display:none !important; }
/* If any legacy debug blocks exist */
.debug, .dev, .devOnly, .debugOnly{ display:none !important; }


/* Home card text readability */
.homeCardTitle{color:#fff !important;}
.homeCardMeta{color:rgba(255,255,255,.72) !important;}

/* --- Recent strip --- */
.homeBrand .t1:empty, .homeBrand .t2:empty{ display:none; }
.recentRow{
  display:flex;
  gap: 16px;
  overflow-x: auto;
  padding: 2px 2px 10px;
  scroll-snap-type: x mandatory;
}
.recentRow::-webkit-scrollbar{ height: 10px; }
.recentRow::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 999px; }
.homeCard{ position: relative; }
.homeCard.mini{
  width: 190px;
  flex: 0 0 auto;
  scroll-snap-align: start;
}
.homeCard.mini .homeCardBody{ padding: 10px 12px 12px; }
.homeCard.mini .homeCardTitle{ font-size: 13px; }
.homeCard.mini .homeCardMeta{ font-size: 11px; }
.pinBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.24);
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.95);
  cursor: pointer;
  user-select: none;
transition: all 0.15s ease;
}
.pinBtn svg{ width: 16px; height: 16px; display:block; }
.pinBtn:hover{ background: rgba(255,255,255,0.14); }
.pinBtn.pinned {
  border-color: rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.16);
}
.pinBtn.pinned:hover{ background: rgba(90,130,255,0.26); }


.homeCard.mini .homeCardMeta{
  justify-content: flex-start;
}

/* Pinned (favourited) cards get a subtle accent so they read as special */
.homeCard.pinnedCard {
  border-color: rgba(255,255,255,0.35);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(23,25,34,0.70));
}
.homeCard.pinnedCard:hover{ filter: brightness(1.06); }

/* --- Card actions (rename / duplicate / delete) --- */
  .cardMenuBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(23,25,34,0.98);
  color: rgba(255,255,255,0.95);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
transition: all 0.15s ease;
}
  .homeCard:hover .cardMenuBtn{ opacity:1; transform: scale(1); }
  .cardMenuBtn:hover{ background: rgba(255,255,255,0.14); }

  .cardMenu {
  position: fixed;
  z-index: 9999;
  min-width: 180px;
  background: rgba(23,25,34,0.98);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.14);
  padding: 6px;
}
  .cardMenu button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  padding: 10px 10px;
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
color: rgba(255,255,255,0.95);
}
  .cardMenu button:hover {
  background: rgba(255,255,255,0.10);
}
  .cardMenu button.danger{ color:#ff6b6b; }
  .cardMenu .sep {
  height: 1px;
  margin: 6px 6px;
  background: rgba(255,255,255,0.10);
}

  .homeCardTitle.isEditing{
    padding: 0;
  }
  .titleEditInput{
    width:100%;
    font: inherit;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.18);
    outline: none;
    background:#fff;
  }
  .titleEditInput:focus{
    border-color: rgba(0,0,0,0.30);
  }



.cardActions{
  display:inline-flex;
  align-items:center;
  gap: 10px;
  opacity: .98;
}
.renameBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.24);
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.95);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  user-select:none;
transition: all 0.15s ease;
}
.homeCardTitle.isEditing{
  cursor:text;
}
.titleEditInput{
  width: 100%;
  font-size: 16px;
  font-weight: 650;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  border-radius: 10px;
  padding: 6px 8px;
  outline: none;
  transition: all 0.2s ease;
}
.titleEditInput:focus {
  border-color: rgba(255,255,255,0.40);
  background: rgba(0,0,0,0.35);
}

</style>

</div>

</div>

/* Safe localStorage wrapper */
const __LS = (()=>{ try{
  const ls = window.localStorage;
  const k = "__scripty_ls_test__";
  ls.setItem(k,"1"); ls.removeItem(k);
  return ls;
}catch(_e){ return null; }})();
const lsGetRaw = (key)=>{ try{ return __LS ? __LS.getItem(String(key)) : null; }catch(_e){ return null; } };
const lsSet    = (key, val)=>{ try{ __LS && __LS.setItem(String(key), String(val)); }catch(_e){} };

// Cloud endpoint storage
const CLOUD_ENDPOINT_KEY = "SCRIPTY_CLOUD_ENDPOINT_V1";
// Support legacy keys from older builds so users don't have to re-enter the URL.
const CLOUD_ENDPOINT_KEYS = [
  "SCRIPTY_CLOUD_ENDPOINT_V1",
  "SCRIPTY_CLOUD_ENDPOINT",
  "SCRIPTY_CLOUD_URL",
  "CLOUD_ENDPOINT",
  "SCRIPTY_GAS_ENDPOINT",
  "SCRIPTY_CLOUD_ENDPOINT_V0"
];


function showModal(shadeEl, show){
  if(!shadeEl) return;
  shadeEl.classList.toggle("show", !!show);
  shadeEl.setAttribute("aria-hidden", show ? "false" : "true");
}
function parseDriveFileId(input){
  const s = String(input||"").trim();
  if(!s) return "";
  // If it's already an ID (Drive ids are typically 25+ chars with - and _)
  if(/^[A-Za-z0-9_-]{20,}$/.test(s) && !s.includes("http")) return s;

  // Try to extract from known URL patterns
  try{
    const u = new URL(s);
    const path = u.pathname || "";
    const m1 = path.match(/\/d\/([A-Za-z0-9_-]{10,})/);
    if(m1) return m1[1];
    const m2 = path.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/);
    if(m2) return m2[1];
    const idParam = u.searchParams.get("id");
    if(idParam) return idParam;
    // Some share links embed the id at the end
    const m3 = path.match(/\/([A-Za-z0-9_-]{20,})$/);
    if(m3) return m3[1];
  }catch(_e){
    // Not a URL; continue
  }
  // If it's an editor link string, try pid/fileId query style without URL parsing
  const mPid = s.match(/[?&]pid=([A-Za-z0-9_-]{6,})/i);
  if(mPid) return { pid: mPid[1] };
  const mFile = s.match(/[?&](fileId|fileid)=([A-Za-z0-9_-]{10,})/i);
  if(mFile) return mFile[2];

  return "";
}


function normalizeEndpoint(url){
  let u = String(url||"").trim();
  if(!u) return "";
  u = u.replace(/\s+/g,"");
  // Allow pasting ?action=list etc — strip querystring
  try{
    const U = new URL(u);
    U.search = "";
    u = U.toString();
  }catch(_e){}
  return u;
}
function getCloudEndpoint(){
  try{
    for(const k of CLOUD_ENDPOINT_KEYS){
      const v = normalizeEndpoint(lsGetRaw(k));
      if(v) return v;
    }
  }catch(_e){}
  return "";
}
function setCloudEndpoint(url){
  const u = normalizeEndpoint(url);
  if(!u) return;
  try{
    // Write to V1 and legacy keys so editor builds can always find it.
    for(const k of CLOUD_ENDPOINT_KEYS){
      try{ lsSet(k, u); }catch(_e){}
    }
    try{ sessionStorage && sessionStorage.setItem("SCRIPTY_CLOUD_ENDPOINT_SESSION", u); }catch(_e){}
  }catch(_e){}
}

function updateCloudButton(){
  const btn = document.getElementById("homeCloudBtn");
  if(!btn) return;
  const ep = getCloudEndpoint();
  btn.textContent = ep ? "Cloud ✓" : "Cloud";
  btn.title = ep ? ("Cloud connected\n" + ep) : "Cloud settings";
}

function setHomeStatus(t){ const el=document.getElementById("homeStatus"); if(el) el.textContent = t; }
function setHomeCount(n){ const el=document.getElementById("homeCount"); if(el) el.textContent = String(n||0); }

async function fetchJsonWithTimeout(url, ms=15000){
  // Primary path: normal fetch (fastest when CORS allows it).
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, { method:"GET", cache:"no-store", signal: ctl.signal });
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(_e){
      // If we got HTML (often a CORS/permission redirect), fall back to JSONP.
      throw new Error("Non-JSON response");
    }
  }catch(err){
    // Firefox (and some privacy modes) often blocks cross-origin fetch to Apps Script.
    // If that happens, fall back to JSONP which works via <script> injection.
    try{
      return await jsonpGetWithTimeout_(url, ms);
    }catch(err2){
      // Preserve the original error message when possible.
      throw (err2 || err);
    }
  }finally{
    clearTimeout(t);
  }
}

function jsonpGetWithTimeout_(url, ms=15000){
  return new Promise((resolve, reject)=>{
    const cbName = "__scripty_jsonp_cb_" + Math.random().toString(36).slice(2);
    let done = false;
    let script = null;
    const cleanup = ()=>{
      if(done) return;
      done = true;
      try{ delete window[cbName]; }catch(_e){}
      try{ script && script.remove(); }catch(_e){}
      try{ clearTimeout(tmo); }catch(_e){}
    };

    window[cbName] = (data)=>{
      cleanup();
      resolve(data);
    };

    // Build URL with callback param (and keep existing query params).
    let finalUrl = String(url||"");
    try{
      const U = new URL(finalUrl, window.location.href);
      U.searchParams.set("callback", cbName);
      // Bust caches (Apps Script sometimes caches aggressively through intermediaries)
      U.searchParams.set("_", String(Date.now()));
      finalUrl = U.toString();
    }catch(_e){
      const join = finalUrl.includes("?") ? "&" : "?";
      finalUrl = finalUrl + join + "callback=" + encodeURIComponent(cbName) + "&_=" + Date.now();
    }

    script = document.createElement("script");
    script.async = true;
    script.src = finalUrl;

    script.onerror = ()=>{
      cleanup();
      reject(new Error("JSONP load error"));
    };

    const tmo = setTimeout(()=>{
      cleanup();
      reject(new Error("JSONP timed out"));
    }, ms);

    document.head.appendChild(script);
  });
}


async function postJsonWithTimeout(url, payload, timeoutMs=20000){
  // Use iframe form + postMessage to bypass CORS (GitHub Pages -> Apps Script)
  return await postViaIframe_(url, payload || {}, timeoutMs);
}

function postViaIframe_(url, payload, timeoutMs=20000){
  return new Promise((resolve, reject)=>{
    const endpoint = String(url||"");
    if(!endpoint) return reject(new Error("Cloud URL not set."));
    const iframeName = "scriptY_iframe_" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.position = "fixed";
    iframe.style.left = "-9999px";
    iframe.style.top = "-9999px";
    iframe.style.width = "1px";
    iframe.style.height = "1px";
    iframe.style.opacity = "0";
    iframe.setAttribute("aria-hidden","true");

    const form = document.createElement("form");
    form.method = "POST";
    form.action = endpoint;
    form.target = iframeName;
    form.enctype = "application/x-www-form-urlencoded";

    const inp = document.createElement("input");
    inp.type = "hidden";
    inp.name = "payload";
    inp.value = JSON.stringify(payload || {});
    form.appendChild(inp);

    let done = false;
    const cleanup = ()=>{
      if(done) return;
      done = true;
      window.removeEventListener("message", onMsg);
      clearTimeout(tmo);
      try{ form.remove(); }catch(_e){}
      try{ iframe.remove(); }catch(_e){}
    };

    const onMsg = (ev)=>{
      // Only accept objects
      if(!ev || typeof ev.data !== "object" || ev.data === null) return;
      // Apps Script webapp origin is typically script.google.com
      // but some deployments may postMessage from googleusercontent; accept both.
      const origin = String(ev.origin||"");
      if(origin && !(origin.includes("google.com") || origin.includes("googleusercontent.com"))) return;
      cleanup();
      resolve(ev.data);
    };

    const tmo = setTimeout(()=>{
      cleanup();
      reject(new Error("Request timed out"));
    }, timeoutMs);

    window.addEventListener("message", onMsg);

    document.body.appendChild(iframe);
    document.body.appendChild(form);
    try{ form.submit(); }catch(ex){
      cleanup();
      reject(ex);
    }
  });
}

// ---------- Card menu (Rename / Duplicate / Delete) ----------
let __cardMenuEl = null;
const __DUPLICATE_INFLIGHT = new Set();
function closeCardMenu_(){
  if(__cardMenuEl && __cardMenuEl.parentNode) __cardMenuEl.parentNode.removeChild(__cardMenuEl);
  __cardMenuEl = null;
}
document.addEventListener("click", (e)=>{
  if(!__cardMenuEl) return;
  if(__cardMenuEl.contains(e.target)) return;
  closeCardMenu_();
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape") closeCardMenu_();
});

function safeBaseName_(name){
  return String(name||"").replace(/\.json$/i,"").trim() || "Untitled";
}
function sanitizeName_(name){
  const base = String(name||"").trim().replace(/\.json$/i,"");
  const safe = base.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g," ").trim();
  return safe || "Untitled";
}
function makeCopyName_(base){
  const b = sanitizeName_(base);
  const stem = (b + " Copy").replace(/\s+/g," ").trim();

  // Ensure the visible title is unique against the current list,
  // so duplicates don’t “feel” confused even if Drive list lags.
  const existing = new Set((__HOME_FILES||[]).map(f => safeBaseName_(f && f.name ? f.name : "").toLowerCase()));
  if(!existing.has(stem.toLowerCase())) return stem;

  let n = 2;
  while(n < 200){
    const candidate = (stem + " " + n).trim();
    if(!existing.has(candidate.toLowerCase())) return candidate;
    n++;
  }
  return (stem + " " + Date.now()).trim();
}

function setCardTitleText_(titleEl, text){
  if(!titleEl) return;
  titleEl.classList.remove("isEditing");
  titleEl.textContent = text;
}

async function renameFile_(f, newTitle){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");
  const name = sanitizeName_(newTitle);

  const resp = await postJsonWithTimeout(endpoint, {
    action: "rename",
    fileId: String(f.id || ""),
    name: name
  }, 20000);

  if(!resp || resp.ok !== true) throw new Error(resp && (resp.error||resp.message) ? (resp.error||resp.message) : "Rename failed");
  return resp;
}

async function duplicateFile_(f, copyName){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");

  const cleanName = String(copyName || "").trim() || makeCopyName_(safeBaseName_(f && f.name ? f.name : ""));

  // Prefer a full content-copy (load -> save) so the duplicate opens with title-page details intact.
  try{
    const qs = (f && f.id)
      ? ("action=load&fileId=" + encodeURIComponent(String(f.id)))
      : ("action=load&name=" + encodeURIComponent(String(f && f.name ? f.name : "")));

    const loaded = await fetchJsonWithTimeout(endpoint + "?" + qs + "&_=" + Date.now(), 25000);
    let doc = loaded && loaded.doc != null ? loaded.doc : null;
    if(!doc) throw new Error("No doc returned.");

    // Apps Script may return doc as a JSON string
    let docObj = doc;
    if(typeof docObj === "string"){
      docObj = JSON.parse(docObj);
    }
    if(!docObj || typeof docObj !== "object") throw new Error("Bad doc payload.");

    // Ensure title page exists and set the copy title (so it opens correctly in-editor).
    docObj.title = docObj.title || {};
    docObj.title.title = cleanName || (docObj.title.title || "Untitled");

    const pid = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : ("p" + Date.now() + "_" + Math.random().toString(16).slice(2));

    const saved = await postJsonWithTimeout(endpoint, {
      action: "save",
      pid: pid,
      // No fileId -> create a new file
      name: cleanName,
      doc: docObj
    }, 30000);

    if(saved && saved.ok === true && saved.file && saved.file.id){
      const file = saved.file;
      if(!file.name) file.name = (cleanName || "Untitled") + ".json";
      if(!file.modified) file.modified = new Date().toISOString();
      return { ok:true, file:file, doc:docObj };
    }

    throw new Error(saved && (saved.error || saved.message) ? (saved.error || saved.message) : "Save copy failed");
  }catch(copyErr){
    console.warn("Content-copy duplicate failed; falling back to server duplicate.", copyErr);
  }

  // Fallback: server-side duplicate (older Code.gs versions)
  const resp = await postJsonWithTimeout(endpoint, {
    action: "duplicate",
    fileId: String(f && f.id ? f.id : ""),
    name: cleanName
  }, 25000);

  if(!resp || resp.ok !== true || !(resp.file && resp.file.id)){
    throw new Error(resp && (resp.error || resp.message) ? (resp.error || resp.message) : "Duplicate failed");
  }
  return resp;
}
async function deleteFile_(f){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");
  const resp = await postJsonWithTimeout(endpoint, { action:"delete", fileId: String(f.id||"") }, 20000);
  if(!resp || resp.ok !== true) throw new Error(resp && (resp.error||resp.message) ? (resp.error||resp.message) : "Delete failed");
  return resp;
}


function startInlineRename_(titleEl, f){
  if(!titleEl) return;
  closeCardMenu_();

  // Close any existing rename cleanly
  try{
    if(window.__SCRIPTY_ACTIVE_RENAME && window.__SCRIPTY_ACTIVE_RENAME.finish){
      window.__SCRIPTY_ACTIVE_RENAME.finish(true);
    }
  }catch(_e){}

  const current = (titleEl.textContent || "").trim() || safeBaseName_(f.name);

  titleEl.classList.add("isEditing");
  titleEl.textContent = "";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "titleEditInput";
  input.value = current;
  input.spellcheck = false;

  titleEl.appendChild(input);

  // Ensure focus happens after DOM insert in all browsers
  setTimeout(()=>{ try{ input.focus(); input.select(); }catch(_e){} }, 0);

  let done = false;

  const cleanup = (finalText)=>{
    titleEl.classList.remove("isEditing");
    titleEl.textContent = finalText;
  };

  const removeListeners = ()=>{
    try{ input.removeEventListener("keydown", onKey); }catch(_e){}
    try{ input.removeEventListener("blur", onBlur); }catch(_e){}
    try{ document.removeEventListener("pointerdown", onDocPointerDown, true); }catch(_e){}
  };

  const finish = async (commit)=>{
    if(done) return;
    done = true;

    removeListeners();
    try{ window.__SCRIPTY_ACTIVE_RENAME = null; }catch(_e){}

    const next = sanitizeName_(input.value);

    if(!commit){
      cleanup(current);
      return;
    }
    if(next === sanitizeName_(current)){
      cleanup(current);
      return;
    }

    // Close edit UI immediately (so click-off feels instant)
    cleanup(next);

    setHomeStatus("Renaming…");
    try{
      await renameFile_(f, next);

      // Update local model + thumb cache
      f.name = next + ".json";
      try{ setCachedThumbMeta(f, { title: next, writtenby:"", name:"", contact:"" }); }catch(_e){}

      setHomeStatus("Renamed");
      setTimeout(()=>setHomeStatus("Ready"), 900);
      setTimeout(()=>{ try{ refreshHomeList(); }catch(_e){} }, 200);
    }catch(err){
      console.warn(err);
      cleanup(current);
      setHomeStatus("Rename failed: " + (err && err.message ? err.message : "Unknown"));
    }
  };

  const onKey = (e)=>{
    try{ e.stopPropagation(); }catch(_e){}
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  };

  const onBlur = (e)=>{
    try{ e && e.stopPropagation && e.stopPropagation(); }catch(_e){}
    finish(true);
  };

  const onDocPointerDown = (ev)=>{
    if(done) return;
    if(titleEl.contains(ev.target)) return;
    // Prevent the "open script" click that happens after we commit
    try{ window.__SCRIPTY_SUPPRESS_OPEN_ONCE = true; }catch(_e){}
    finish(true);
  };

  input.addEventListener("pointerdown", (e)=>{ try{ e.stopPropagation(); }catch(_e){} });
  input.addEventListener("keydown", onKey);
  input.addEventListener("blur", onBlur);

  // Capture phase so it works even if something else stops bubbling
  document.addEventListener("pointerdown", onDocPointerDown, true);

  window.__SCRIPTY_ACTIVE_RENAME = { titleEl, input, finish };
}


function openCardMenu_(anchorEl, f, titleEl){
  closeCardMenu_();

  const menu = document.createElement("div");
  menu.className = "cardMenu";
  menu.innerHTML = "";
  const mk = (label, cls, fn)=>{
    const b = document.createElement("button");
    b.type="button";
    b.textContent = label;
    if(cls) b.className = cls;
    b.addEventListener("click", async (e)=>{
      e.preventDefault();
      e.stopPropagation();
      closeCardMenu_();
      await fn();
    });
    return b;
  };

  menu.appendChild(mk("Duplicate", "", async ()=>{
    const dupKey = (f && (String(f.id||"")||String(f.name||""))) ? ("dup:" + (String(f.id||"")||String(f.name||""))) : ("dup:" + Math.random().toString(36).slice(2));
    if(__DUPLICATE_INFLIGHT.has(dupKey)){
      setHomeStatus("Duplicate already running…");
      return;
    }
    __DUPLICATE_INFLIGHT.add(dupKey);
    const base = safeBaseName_(f && f.name ? f.name : "");
    const copyName = makeCopyName_(base);
    const tempId = "pending_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    
    // Get original metadata
    const originalMeta = getCachedThumbMeta(f) || getServerThumbMeta_(f) || { title: base };
    const duplicateMeta = {
      title: copyName,
      writtenby: originalMeta.writtenby || "",
      name: originalMeta.name || "",
      contact: originalMeta.contact || ""
    };
    
    const optimistic = {
      id: tempId,
      name: copyName + ".json",
      modified: new Date().toISOString(),
      __pending: true,
      __pendingSince: Date.now(),
      tp: duplicateMeta
    };

    // Show optimistic card
    __HOME_FILES = [optimistic].concat(__HOME_FILES || []);
    setCachedThumbMeta(optimistic, duplicateMeta);
    saveHomeCache_(__HOME_FILES);
    renderHome();

    setHomeStatus("Duplicating…");
    try{
      const resp = await duplicateFile_(f, copyName);

      const respFileId = (resp && (resp.fileId || resp.id || (resp.file && resp.file.id))) ? String(resp.fileId || resp.id || resp.file.id) : "";
      if(resp && resp.ok === true && respFileId){
        // Success - replace temp with real file
        const realFile = (resp.file && typeof resp.file === 'object') ? resp.file : { id: respFileId, name: (copyName + '.json'), modified: new Date().toISOString() };
        realFile.tp = duplicateMeta;
        
        __HOME_FILES = __HOME_FILES.map(x => 
          (String(x.id||"") === String(tempId)) ? realFile : x
        );
        
        setCachedThumbMeta(realFile, duplicateMeta);
        markLocalKeep_(realFile.id, 420000);
        saveHomeCache_(__HOME_FILES);
        
        // Migrate pin if needed
        const pins = loadPinsSet_();
        const nameKey = "name:" + optimistic.name.toLowerCase();
        const idKey = "id:" + realFile.id;
        if(pins.has(nameKey)){
          pins.delete(nameKey);
          pins.add(idKey);
          savePinsSet_(pins);
        }
        
// If duplicateFile_ used load+save, we already have the full doc here — apply instantly.
        try{
          if(resp && resp.doc){
            const meta = titleMetaFromDoc(resp.doc, copyName);
            setCachedThumbMeta(realFile, meta);
          }
        }catch(_e){}

        setHomeStatus("Duplicated");
        renderHome();
        try{ scheduleHydrateTitleThumbs([realFile], 80); }catch(_e){}
        // Drive list can lag; refresh later so the new file doesn't "disappear".
        setTimeout(()=>refreshHomeList(), 12000);
} else {
        // No file returned - keep optimistic card longer
        markLocalKeep_(tempId, 420000);
        setHomeStatus("Duplicated (refreshing…)");
        setTimeout(()=>refreshHomeList(), 3000);
      }
    }catch(err){
      console.warn(err);
      // Remove failed card
      __HOME_FILES = __HOME_FILES.filter(x => String(x.id||"") !== String(tempId));
      renderHome();
      setHomeStatus("Duplicate failed: " + (err.message || "Unknown"));
    }finally{
      try{ __DUPLICATE_INFLIGHT.delete(dupKey); }catch(_e){}
    }
  }));
  const sep = document.createElement("div"); sep.className="sep";
  menu.appendChild(sep);
  menu.appendChild(mk("Delete", "danger", async ()=>{
    const nm = (titleEl && titleEl.textContent) ? titleEl.textContent : safeBaseName_(f.name);
    const ok = confirm('Delete "' + nm + '"?\n\nThis moves the file to Trash in Google Drive.');
    if(!ok) return;

    try{ markDeleted_(String(f.id||""), 300000); }catch(_e){}

    const prevFiles = (__HOME_FILES || []).slice();
    let prevRec = null;
    try{ prevRec = loadRecents_(); }catch(_e){ prevRec = null; }

    try{
      __HOME_FILES = (__HOME_FILES || []).filter(x => String(x.id||"") !== String(f.id||""));
      try{ saveHomeCache_(__HOME_FILES); }catch(_e){}
      try{
        const fk = thumbKeyForFile(f);
        if(prevRec) saveRecents_(prevRec.filter(r => r.filekey !== fk));
      }catch(_e){}
      renderHome();
    }catch(_e){}

    setHomeStatus("Deleting…");
    try{
      await deleteFile_(f);
      setHomeStatus("Deleted");
      setTimeout(()=>{ try{ refreshHomeList(); }catch(_e){} }, 1200);
    }catch(err){
      console.warn(err);
      try{
        __HOME_FILES = prevFiles;
        if(prevRec) saveRecents_(prevRec);
        renderHome();
      }catch(_e){}
      setHomeStatus("Delete failed: " + (err && err.message ? err.message : "Unknown"));
    }
  }));

  document.body.appendChild(menu);
  __cardMenuEl = menu;

  const r = anchorEl.getBoundingClientRect();
  const margin = 8;
  let left = Math.min(window.innerWidth - menu.offsetWidth - margin, r.right - menu.offsetWidth);
  let top  = Math.min(window.innerHeight - menu.offsetHeight - margin, r.bottom + 6);
  if(left < margin) left = margin;
  if(top < margin) top = margin;
  menu.style.left = left + "px";
  menu.style.top  = top + "px";
}

function parseListPayload(payload){
  // Accept:
  // 1) ["A.json","B.json"]
  // 2) { ok:true, files:[{id,name,modified}...] }
  // 3) Drive API-ish: { files:[{id,name,modifiedTime}...] }
  // 4) Legacy: { items:[{fileId,title,modifiedTime}...] }
  if(Array.isArray(payload)){
    return payload.map(n => ({ name: String(n), id: "", modified: "" })).filter(x=>x.name);
  }
  if(payload && typeof payload === "object"){
    const files = payload.files || payload.items || payload.itemsList || payload;
    if(Array.isArray(files)){
      return files.map(f => {
        if(typeof f === "string") return { name: f, id: "", modified: "" };
        const name = String(f.name || f.title || f.filename || f.fileName || f.file_name || "");
        const id = String(f.id || f.fileId || f.file_id || (f.file && (f.file.id||f.file.fileId)) || "");
        const modified = String(f.modified || f.modifiedTime || f.modified_time || f.updated || f.updatedTime || f.lastModified || "");
        return { name, id, modified };
      }).filter(x => x.name);
    }
  }
  return [];
}

function assertListOk_(payload){
  // Reject common "looks like JSON" error payloads so we don't show false "Connected".
  if(Array.isArray(payload)) return;
  if(payload && typeof payload === "object"){
    if(payload.ok === false){
      const msg = payload.error || payload.message || payload.reason || "Endpoint returned ok:false";
      throw new Error(String(msg));
    }
    if(payload.error && payload.ok !== true){
      const e = payload.error;
      const msg = (typeof e === "string") ? e : (e.message || e.error || JSON.stringify(e));
      throw new Error(String(msg || "Endpoint returned error"));
    }
    const files = payload.files || payload.items || payload.itemsList;
    if(Array.isArray(files)) return;
    // If ok:true but no list structure, treat as invalid to avoid silent failures.
    if(payload.ok === true && !("files" in payload) && !("items" in payload) && !("itemsList" in payload)){
      throw new Error("Endpoint returned ok:true but no file list");
    }
  }
  throw new Error("Unexpected list response");
}


let __HOME_FILES = [];

// ---- Instant list cache (client-side) ----
const LAST_LIST_KEY = "SCRIPTY_LAST_LIST_V1";

function saveHomeCache_(files){
  try{
    const arr = Array.isArray(files) ? files : [];
    // Strip very transient fields to keep cache small
    const slim = arr.map(f=>{
      if(!f) return null;
      const o = Object.assign({}, f);
      delete o.__pending;
      delete o.__pendingSince;
      delete o.__openError;
      return o;
    }).filter(Boolean);
    lsSet(LAST_LIST_KEY, JSON.stringify(slim));
  }catch(_e){}
}

function loadHomeCache_(){
  try{
    const raw = lsGetRaw(LAST_LIST_KEY);
    if(!raw) return false;
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr) || !arr.length) return false;
    __HOME_FILES = arr;
    // Don’t override "Not connected" state; just render what we have.
    renderHome();
    return true;
  }catch(_e){ return false; }
}
const __LOCAL_KEEP = new Map();   // fileId -> keepUntil (ms)
const __DELETED_IDS = new Map();  // fileId -> deletedAt (ms)

function markLocalKeep_(fileId, ms=120000){
  const id = String(fileId||"").trim();
  if(!id) return;
  __LOCAL_KEEP.set(id, Date.now() + ms);
}
function markDeleted_(fileId, ms=300000){
  const id = String(fileId||"").trim();
  if(!id) return;
  __DELETED_IDS.set(id, Date.now() + ms);
}
function isDeletedLocally_(fileId){
  const id = String(fileId||"").trim();
  if(!id) return false;
  const until = __DELETED_IDS.get(id) || 0;
  if(until && until > Date.now()) return true;
  if(until) __DELETED_IDS.delete(id);
  return false;
}
function shouldKeepLocally_(fileId){
  const id = String(fileId||"").trim();
  if(!id) return false;
  const until = __LOCAL_KEEP.get(id) || 0;
  if(until && until > Date.now()) return true;
  if(until) __LOCAL_KEEP.delete(id);
  return false;
}

const RECENTS_KEY = "SCRIPTY_RECENTS_V1";
const PINS_KEY = "SCRIPTY_PINS_V1";
const __PIN_MIGRATE_PREFIX = "SCRIPTY_THUMB_META:";

function loadRecents_(){
  try{
    const raw = localStorage.getItem(RECENTS_KEY) || "[]";
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(_e){ return []; }
}
function saveRecents_(arr){
  try{ localStorage.setItem(RECENTS_KEY, JSON.stringify(Array.isArray(arr)?arr:[])); }catch(_e){}
}

function normalizePinEntry_(k){
  k = String(k||"").trim();
  if(!k) return "";
  // Migrate old pin keys that accidentally used thumb-cache keys.
  if(k.startsWith(__PIN_MIGRATE_PREFIX)){
    k = k.slice(__PIN_MIGRATE_PREFIX.length);
  }
  // If it's a raw Drive id, normalize to id:...
  if(/^[A-Za-z0-9_-]{10,}$/.test(k) && !k.startsWith("id:") && !k.startsWith("name:")){
    return "id:" + k;
  }
  if(k.startsWith("id:")){
    return "id:" + k.slice(3);
  }
  if(k.startsWith("name:")){
    return "name:" + k.slice(5).toLowerCase();
  }
  return k;
}

function pinKeyForFile_(f){
  if(!f) return "";
  const id = String(f.id||"").trim();
  const name = String(f.name||"").trim();
  // Pending placeholders must pin by name (id will change).
  if(f.__pending || id.startsWith("pending_") || id.startsWith("tmp_")){
    return "name:" + name.toLowerCase();
  }
  if(id) return "id:" + id;
  return "name:" + name.toLowerCase();
}

function loadPinsSet_(){
  try{
    const raw = localStorage.getItem(PINS_KEY) || "[]";
    const arr = JSON.parse(raw);
    const set = new Set();
    let changed = false;
    if(Array.isArray(arr)){
      for(const v of arr){
        const nk = normalizePinEntry_(v);
        if(nk){ set.add(nk); if(nk !== v) changed = true; }
      }
    }
    if(changed){
      try{ localStorage.setItem(PINS_KEY, JSON.stringify(Array.from(set))); }catch(_e){}
    }
    return set;
  }catch(_e){ return new Set(); }
}
function savePinsSet_(set){
  try{ localStorage.setItem(PINS_KEY, JSON.stringify(Array.from(set||[]))); }catch(_e){}
}
function isPinned_(f){
  const k = pinKeyForFile_(f);
  return !!k && loadPinsSet_().has(k);
}
function togglePin_(f){
  const k = pinKeyForFile_(f);
  if(!k) return;
  const set = loadPinsSet_();
  if(set.has(k)) set.delete(k);
  else set.add(k);
  savePinsSet_(set);
}

function touchRecent_(f){
  if(!f) return;
  const filekey = thumbKeyForFile(f);
  let rec = loadRecents_();
  rec = rec.filter(r => r && r.filekey !== filekey);
  rec.unshift({ filekey, id: String(f.id||""), name: String(f.name||""), ts: Date.now() });
  if(rec.length > 40) rec = rec.slice(0, 40);
  saveRecents_(rec);
}
function resolveFileByRecent_(r){
  if(!r) return null;
  // Prefer exact filekey match
  const byKey = __HOME_FILES.find(f => thumbKeyForFile(f) === r.filekey);
  if(byKey && !byKey.__pending) return byKey;
  // Fallback: match by id or name
  if(r.id){
    const byId = __HOME_FILES.find(f => String(f.id||"") === String(r.id));
    if(byId && !byId.__pending) return byId;
  }
  if(r.name){
    const byName = __HOME_FILES.find(f => String(f.name||"") === String(r.name));
    if(byName && !byName.__pending) return byName;
  }
  return null;
}

function resolveFileByPinKey_(k){

  if(k.startsWith("id:")){

    return __HOME_FILES.find(f => String(f.id||"") === id) || null;
  }
  if(k.startsWith("name:")){
    const nm = k.slice(5);
    return __HOME_FILES.find(f => String(f.name||"").toLowerCase() === nm) || null;
  }
  return null;
}

function renderFavouritesRow_(q){
  if(!favSectionEl || !favRowEl) return;
  if(q){
    favSectionEl.style.display = "none";
    return;
  }
  const pins = loadPinsSet_();
  const rec = loadRecents_();
  const tsByPin = new Map();
  for(const r of rec){
    const id = String(r && r.id ? r.id : "").trim();
    const name = String(r && r.name ? r.name : "").trim();
    const ts = Number(r && r.ts ? r.ts : 0) || 0;
    if(id) tsByPin.set("id:"+id, ts);
    if(name) tsByPin.set("name:"+name.toLowerCase(), ts);
  }

  const pinnedKeys = Array.from(pins);
  pinnedKeys.sort((a,b)=> (tsByPin.get(b)||0) - (tsByPin.get(a)||0));

  favRowEl.innerHTML = "";
  const files = [];
  const used = new Set();
  for(const pk of pinnedKeys){
    const f = resolveFileByPinKey_(pk);
    if(!f) continue;
    const uid = String(f.id||"") || String(f.name||"");
    if(used.has(uid)) continue;
    files.push(f);
    used.add(uid);
  }

  const top = files.slice(0, 6);
  if(!top.length){
    favSectionEl.style.display = "none";
    return;
  }
  favSectionEl.style.display = "block";
  for(const f of top){
    favRowEl.appendChild(buildCard_(f, {mini:true}));
  }
}

function renderRecentRow_(q){
  if(!recentSectionEl || !recentRowEl) return;
  if(q){
    recentSectionEl.style.display = "none";
    return;
  }
  const rec = loadRecents_();
  const files = [];
  const used = new Set();

  for(const r of rec){
    const f = resolveFileByRecent_(r);
    if(!f) continue;
    // keep pinned items in Recents as well
    // (Recents is independent from Favourites)
    // if(isPinned_(f)) continue; // pinned items can appear in both sections
    const uid = String(f.id||"") || String(f.name||"");
    if(used.has(uid)) continue;
    files.push(f);
    used.add(uid);
  }

  const top = files.slice(0, 6);
  recentRowEl.innerHTML = "";

  if(!top.length){
    recentSectionEl.style.display = "none";
    return;
  }
  recentSectionEl.style.display = "block";

  for(const f of top){
    recentRowEl.appendChild(buildCard_(f, {mini:true}));
  }
}

// --- Title-page thumbnail helpers ---
const THUMB_META_PREFIX = "SCRIPTY_THUMB_META:";
const THUMB_FETCH_LIMIT = 60;      // hydrate the first N visible cards (favourites/recents + top grid)
const THUMB_CONCURRENCY = 6;

function getServerThumbMeta_(f){
  try{
    const tp = f && (f.tp || f.titlePage || f.titleMeta || f.thumbMeta);
    if(!tp || typeof tp !== "object") return null;
    const clean = (v)=> (v==null ? "" : String(v)).replace(/\s+/g," ").trim();
    const fallbackTitle = f && f.name ? String(f.name).replace(/\.json$/i,"") : "Untitled";
    const title = clean(tp.title || tp.scriptTitle || tp.name) || fallbackTitle;
    const writtenby = clean(tp.writtenby || tp.writtenBy || tp.byline || "");
    const name = clean(tp.name || tp.author || tp.writer || "");
    const contact = clean(tp.contact || tp.email || tp.phone || "");
    // Only treat as real meta if any non-title field exists, or if tp explicitly provides title.
    if(!writtenby && !name && !contact && !(tp.title || tp.scriptTitle)) return null;
    return { title, writtenby, name, contact };
  }catch(_e){ return null; }
}

function thumbKeyForFile(f){
  const id = (f && f.id) ? ("id:" + String(f.id)) : "";
  const name = (f && f.name) ? ("name:" + String(f.name)) : "name:unknown";
  return THUMB_META_PREFIX + (id || name);
}
function getCachedThumbMeta(f){
  try{
    const raw = localStorage.getItem(thumbKeyForFile(f));
    if(!raw) return null;
    const obj = JSON.parse(raw);
    // If we have a modified stamp, only use cache when it matches.
    const m = String(f.modified || "");
    if(m && obj && String(obj.modified||"") !== m) return null;
    return obj && obj.meta ? obj.meta : null;
  }catch(_e){ return null; }
}
function setCachedThumbMeta(f, meta){
  try{
    const obj = { modified: String(f.modified||""), meta: meta || {} };
    localStorage.setItem(thumbKeyForFile(f), JSON.stringify(obj));
  }catch(_e){}
}
function cleanText(s){
  return String(s||"").replace(/\r/g,"").replace(/\u00A0/g," ").replace(/[\u200B\u200C\u200D\uFEFF]/g,"").trim();
}

function cssAttrEscape(s){
  // Escapes for use inside a quoted attribute selector: [data-x="..."]
  return String(s||"").replace(/\\/g,"\\\\").replace(/"/g,'\\"');
}
function titleMetaFromDoc(doc, fallbackName){
  const t = (doc && doc.title) ? doc.title : {};
  return {
    title: cleanText(t.title) || cleanText(fallbackName || "Untitled"),
    writtenby: cleanText(t.writtenby) || "",
    name: cleanText(t.name) || "",
    contact: cleanText(t.contact) || ""
  };
}
function ensureThumbStructure(thumbEl){
  if(!thumbEl) return null;
  if(thumbEl.querySelector(".thumbPaper")) return thumbEl;
  const paper = document.createElement("div");
  paper.className = "thumbPaper";

  const a = document.createElement("div"); a.className = "tpTitle"; a.dataset.k="title";
  const b = document.createElement("div"); b.className = "tpBy"; b.dataset.k="writtenby";
  const c = document.createElement("div"); c.className = "tpName"; c.dataset.k="name";
  const d = document.createElement("div"); d.className = "tpContact"; d.dataset.k="contact";

  paper.appendChild(a); paper.appendChild(b); paper.appendChild(c); paper.appendChild(d);
  thumbEl.appendChild(paper);
  return thumbEl;
}
function applyTitleThumb(thumbEl, meta){
  ensureThumbStructure(thumbEl);
  const setField = (sel, val)=>{
    const el = thumbEl.querySelector(sel);
    if(!el) return;
    const v = cleanText(val);
    el.textContent = v;
    if(!v) el.classList.add("isEmpty"); else el.classList.remove("isEmpty");
  };
  setField(".tpTitle", meta && meta.title);
  setField(".tpBy", meta && meta.writtenby);
  setField(".tpName", meta && meta.name);
  setField(".tpContact", meta && meta.contact);
}

async function fetchTitleMetaForFile(f, endpoint){
  const ep = normalizeEndpoint(endpoint || getCloudEndpoint());
  if(!ep) throw new Error("Cloud URL not set.");
  const qs = f.id
    ? ("action=load&fileId=" + encodeURIComponent(f.id))
    : ("action=load&name=" + encodeURIComponent(f.name));
  const payload = await fetchJsonWithTimeout(ep + "?" + qs + "&_=" + Date.now(), 20000);
    if(__seq !== __HOME_REFRESH_SEQ) return; // stale response
  const doc = payload && payload.doc ? payload.doc : null;
  if(!doc) throw new Error("No doc returned (action=load missing).");
  return titleMetaFromDoc(doc, (payload && payload.name) ? payload.name.replace(/\.json$/i,"") : f.name.replace(/\.json$/i,""));
}

async function hydrateTitleThumbs(files){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) return;

  const list = (files || []).slice(0, THUMB_FETCH_LIMIT);

  // Simple concurrency pool
  let i = 0;
  const workers = new Array(THUMB_CONCURRENCY).fill(0).map(async ()=>{
    while(i < list.length){
      const f = list[i++];
      const card = document.querySelector(`[data-filekey="${cssAttrEscape(thumbKeyForFile(f))}"]`);
      const thumb = card ? card.querySelector(".homeThumb") : null;
      if(!thumb) continue;

      // Server-provided meta (from list) wins immediately
      const serverMeta = getServerThumbMeta_(f);
      if(serverMeta){
        setCachedThumbMeta(f, serverMeta);
        applyTitleThumb(thumb, serverMeta);
        continue;
      }

      // Cached?
      const cached = getCachedThumbMeta(f);
      if(cached){
        applyTitleThumb(thumb, cached);
        continue;
      }

      try{
        const meta = await fetchTitleMetaForFile(f, endpoint);
        setCachedThumbMeta(f, meta);
        applyTitleThumb(thumb, meta);
      }catch(err){
        // Silent fail: keep placeholder look
        console.warn("Thumb hydrate failed for", f && f.name, err);
      }
    }
  });

  await Promise.all(workers);
}

// Debounced + retrying hydrator so title-page fields populate without needing a refresh.
let __thumbHydrateTimer = null;
let __thumbHydrateRetryTimer = null;
function countMissingThumbMeta_(files){
  try{
    const list = (files || []).slice(0, THUMB_FETCH_LIMIT);
    let miss = 0;
    for(const f of list){
      if(!getCachedThumbMeta(f)) miss++;
    }
    return miss;
  }catch(_e){ return 0; }
}
function scheduleHydrateTitleThumbs(files, delayMs=60){
  try{ clearTimeout(__thumbHydrateTimer); }catch(_e){}
  __thumbHydrateTimer = setTimeout(async ()=>{
    try{
      await hydrateTitleThumbs(files);

      // Re-render so cached title-page fields (Written by / Name / Contact) appear without a refresh.
      try{
        if(typeof renderHome === "function"){
          requestAnimationFrame(()=>{ try{ renderHome(); }catch(_e){} });
        }
      }catch(_e){}

      const miss = countMissingThumbMeta_(files);
      // Apps Script can be slow on cold start; retry once shortly after if anything is still missing.
      if(miss > 0){
        try{ clearTimeout(__thumbHydrateRetryTimer); }catch(_e){}
        __thumbHydrateRetryTimer = setTimeout(async ()=>{
          try{
            await hydrateTitleThumbs(files);
            try{
              if(typeof renderHome === "function"){
                requestAnimationFrame(()=>{ try{ renderHome(); }catch(_e){} });
              }
            }catch(_e){}
          }catch(_e){}
        }, 1400);
      }
    }catch(_e){}
  }, delayMs);
}

function renderHome(){
  const q = String(searchEl?.value || "").trim().toLowerCase();
  const list = __HOME_FILES.filter(f => !q || f.name.toLowerCase().includes(q));
  setHomeCount(list.length);
  hideSkeletonLoaders();  // <-- THIS LINE MUST BE HERE
  gridEl.innerHTML = "";

  renderFavouritesRow_(q);
  renderRecentRow_(q);

  if(!list.length){
    const empty = document.createElement("div");
    empty.className = "homeEmpty";
    empty.style.gridColumn = "1 / -1";
    empty.innerHTML = getCloudEndpoint()
      ? "No scripts found yet — save once from the editor to create your first file."
      : "Cloud not connected — click <b>Cloud</b> to paste your Apps Script URL.";
    gridEl.appendChild(empty);
    return;
}

  for(const f of list){
    gridEl.appendChild(buildCard_(f, {mini:false}));
  }

  // Hydrate title-page fields for the currently visible cards (async)
  scheduleHydrateTitleThumbs(list, 120);
}

let __HOME_REFRESH_SEQ = 0;
async function refreshHomeList(){
  const __seq = ++__HOME_REFRESH_SEQ;
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint){
    setHomeStatus("Not connected");
    __HOME_FILES = [];
    renderHome();
    return;
  }
  setHomeStatus("Loading…");
  showSkeletonLoaders();  // ADD THIS LINE
  try{
    const payload = await fetchJsonWithTimeout(endpoint + "?action=list&_=" + Date.now(), 15000);
    assertListOk_(payload);
    const incoming = parseListPayload(payload);

    // Filter out anything we recently deleted locally (Drive list can lag).
    let merged = (incoming || []).filter(f => !isDeletedLocally_(String(f.id||"")));

    // Merge in locally-kept files (created/duplicated moments ago) if they haven't appeared yet.
    try{
      const byId = new Map(merged.filter(f => f && f.id).map(f => [String(f.id), f]));
      const old = (__HOME_FILES || []);
      const now = Date.now();

      for(const f of old){
        if(!f) continue;
        const id = String(f.id||"").trim();

        // Keep pending placeholders for a short window
        if(f.__pending){
          const since = Number(f.__pendingSince||0) || now;
          if(now - since < 90000){ // 90 seconds
            merged.unshift(f);
          }
          continue;
        }

        if(!id) continue;
        if(byId.has(id)) continue;
        if(isDeletedLocally_(id)) continue;

        if(shouldKeepLocally_(id)){
          merged.unshift(f);
        }
      }
    }catch(_e){}

    // Sort newest first if modified is present
    if(merged.some(f => f && f.modified)){
      merged.sort((a,b)=> String(b.modified||"").localeCompare(String(a.modified||"")));
    }

    __HOME_FILES = merged;
    try{ saveHomeCache_(__HOME_FILES); }catch(_e){}

    setHomeStatus("Connected");
    renderHome();
    // Hydrate the first set of thumbnails with real title-page data (async)
    scheduleHydrateTitleThumbs(__HOME_FILES, 80);
   }catch(err){
    if(__seq !== __HOME_REFRESH_SEQ) return; // stale failure
    console.error(err);
    if(Array.isArray(__HOME_FILES) && __HOME_FILES.length){
    setHomeStatus("Connection failed (showing cached)");
    renderHome();
  }else{
    setHomeStatus("Connection failed");
    __HOME_FILES = [];
    renderHome();
  }
}
}

function nextUntitledNameFromHome_(filesOverride){
  const __list = Array.isArray(filesOverride) ? filesOverride : (__HOME_FILES||[]);
  // Find the smallest available "Untitled Script N" based on the current list.
  const used = new Set();
  let hasPlainUntitled = false;

  const take = (nm)=>{
    const s = String(nm||"").replace(/\.json$/i,"").trim();
    if(!s) return;
    if(/^untitled$/i.test(s)){ hasPlainUntitled = true; return; }
    const m = s.match(/^untitled\s*script\s*(\d+)\s*$/i);
    if(m){
      const n = parseInt(m[1], 10);
      if(Number.isFinite(n) && n > 0) used.add(n);
      return;
    }
    const m2 = s.match(/^untitled\s*(\d+)\s*$/i);
    if(m2){
      const n = parseInt(m2[1], 10);
      if(Number.isFinite(n) && n > 0) used.add(n);
      return;
    }
  };

  try{ (__list||[]).forEach(f => take(f && (f.name || f.title))); }catch(_e){}
  if(hasPlainUntitled) used.add(1);

  let n = 1;
  while(used.has(n) && n < 10000) n++;
  return "Untitled Script " + n;
}

bind_("homeNewBtn","click", ()=>{

      // Prefer a fresh list before generating an Untitled name (prevents numbering drift).
      let untitledName = "";

        const payload = await fetchJsonWithTimeout(ep + "?action=list&_=" + Date.now(), 8000);
        const files = parseListPayload(payload);
        untitledName = nextUntitledNameFromHome_(files);

      }

      const p = new URLSearchParams();
      const pid = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ("p" + Date.now() + "_" + Math.random().toString(16).slice(2));

      p.set("pid", pid);
      p.set("name", untitledName || "Untitled Script 1");

      if(ep) p.set("cloud", ep);
      window.location.href = "editor.html?" + p.toString();
    })();
  });
});

function showSkeletonLoaders(){
  // Don't hide sections - show skeletons IN them instead
  const cachedCount = (__HOME_FILES && __HOME_FILES.length) ? __HOME_FILES.length : 3;
  const count = Math.min(cachedCount, 12);
  
// Show in Recent section if we have cached data
  if(recentSectionEl && recentRowEl && cachedCount > 0){
    recentSectionEl.style.display = "block";
    recentRowEl.innerHTML = "";
    // Check actual recent items count
    const recents = loadRecents_();
    const actualRecentCount = recents ? Math.min(recents.length, 6) : Math.min(3, cachedCount);
    for(let i = 0; i < actualRecentCount; i++){
      const skel = createSkeletonCard();
      skel.classList.add("mini");
      recentRowEl.appendChild(skel);
    }
  } else if(recentSectionEl){
    recentSectionEl.style.display = "none";
  }
  
  // Hide favourites during load (or add skeletons here too if you want)
  if(favSectionEl) favSectionEl.style.display = "none";
  
  // Show in main grid
  gridEl.innerHTML = "";
  for(let i = 0; i < count; i++){
    gridEl.appendChild(createSkeletonCard());
  }
}

function hideSkeletonLoaders(){
  // Remove from main grid
  const skeletons = gridEl.querySelectorAll(".homeCard.isPlaceholder");
  skeletons.forEach(s => s.remove());
  
  // Remove from recent row
  if(recentRowEl){
    const recentSkels = recentRowEl.querySelectorAll(".homeCard.isPlaceholder");
    recentSkels.forEach(s => s.remove());
  }
  
  // Remove from favourites row
  if(favRowEl){
    const favSkels = favRowEl.querySelectorAll(".homeCard.isPlaceholder");
    favSkels.forEach(s => s.remove());
  }
}

window.addEventListener("load", ()=>{
  try{ updateCloudButton(); }catch(_e){}
  try{ loadHomeCache_(); }catch(_e){}  // Load cache FIRST
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(endpoint){
    showSkeletonLoaders();  // Then show skeletons (now knows count)
  }
  refreshHomeList();

  // If the editor redirected here because Cloud wasn't set, we may have a pending file to open.
  try{
    const params = new URLSearchParams(window.location.search || "");
    const pendingFileId = (params.get("pendingFileId")||"").trim();
    const pendingName   = (params.get("pendingName")||"").trim();
    const pendingPid    = (params.get("pendingPid")||"").trim();
    const token = pendingFileId || pendingPid || pendingName;

    if(token){
      const onceKey = "SCRIPTY_PENDING_OPEN_ONCE:" + token;
      let already = false;
      try{ already = (typeof sessionStorage!=="undefined") && !!sessionStorage.getItem(onceKey); }catch(_e){}

      if(!already){
        const doOpen = (ep)=>{
          // Mark once + clear pending params so refresh won't re-trigger.
          try{ if(typeof sessionStorage!=="undefined") sessionStorage.setItem(onceKey, "1"); }catch(_e){}
          try{
            const clean = new URL(window.location.href);
            clean.searchParams.delete("pendingFileId");
            clean.searchParams.delete("pendingName");
            clean.searchParams.delete("pendingPid");
            history.replaceState(null, "", clean.toString());
          }catch(_e){}

          const qs = new URLSearchParams();
          if(pendingFileId) qs.set("fileId", pendingFileId);
          if(pendingName) qs.set("name", pendingName);
          if(pendingPid) qs.set("pid", pendingPid);
          if(ep) qs.set("cloud", ep);
          window.location.href = "editor.html?" + qs.toString();
        };

        const epNow = normalizeEndpoint(getCloudEndpoint());
        if(epNow){
          doOpen(epNow);
        }else{
          __AFTER_CLOUD = (ep)=>doOpen(ep);
          openCloudModal();
          try{ cloudModalStatus && (cloudModalStatus.textContent = "Paste your Apps Script URL, then Save."); }catch(_e){}
        }
      }
    }
  }catch(_e){}

  const h = String(window.location.hash||"").toLowerCase();
  if(h==="#open") openOpenModal();
  if(h==="#cloud") openCloudModal();
});

function setOpenStatus(msg){ if(openStatus) openStatus.textContent = msg || "—"; }

function openOpenModal(){
  setOpenStatus("Paste a Drive link / file ID / editor link.");
  if(openInput) openInput.value = "";
  showModal(openModalShade, true);
  setTimeout(()=>{ try{ openInput && openInput.focus(); }catch(_e){} }, 0);
}
function closeOpenModal(){ showModal(openModalShade, false); }

openBtn && openBtn.addEventListener("click", openOpenModal);
openCloseBtn && openCloseBtn.addEventListener("click", closeOpenModal);
openModalShade && openModalShade.addEventListener("click", (e)=>{ if(e.target===openModalShade) closeOpenModal(); });
openClearBtn && openClearBtn.addEventListener("click", ()=>{ if(openInput) openInput.value=""; setOpenStatus("—"); openInput && openInput.focus(); });

function goOpen(){
  const val = openInput ? openInput.value : "";
  const parsed = parseDriveFileId(val);
  if(!parsed){
    setOpenStatus("Couldn't recognize a file ID in that link.");
    return;
  }
  ensureCloudThen((ep)=>{
    // If parsed returns an object with pid, route by pid
    if(typeof parsed === "object" && parsed.pid){
      const p = new URLSearchParams();
      p.set("pid", parsed.pid);
      if(ep) p.set("cloud", ep);
      window.location.href = "editor.html?" + p.toString();
      return;
    }
    // Otherwise treat as Drive fileId
    const p = new URLSearchParams();
    p.set("fileId", parsed);
    if(ep) p.set("cloud", ep);
    window.location.href = "editor.html?" + p.toString();
  });
}

openGoBtn && openGoBtn.addEventListener("click", goOpen);
openInput && openInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); goOpen(); } });

if(String(location.hash||"").toLowerCase()==="#open"){ openOpenModal(); }
