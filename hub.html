<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e1e4e8; --ink:#1f2328; --mute:#656d76; --accent:#1a73e8; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:grid; grid-template-columns:220px 1fr; height:100%; }
  #sidebar { background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
  #sidebar h2 { margin:0; padding:14px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); }
  .project { display:block; width:100%; text-align:left; padding:10px 16px; border:0; background:none; cursor:pointer; font:inherit; color:inherit; }
  .project:hover { background:var(--bg); }
  .project.active { background:#e8f0fe; color:var(--accent); font-weight:600; }
  #main { display:flex; flex-direction:column; min-width:0; }
  #banner { display:flex; gap:12px; align-items:center; padding:8px 16px; background:#fff8e1; border-bottom:1px solid #f0e0a0; font-size:13px; }
  #banner button { margin-left:auto; border:0; background:none; cursor:pointer; font-size:16px; color:var(--mute); }
  #bar { display:flex; align-items:center; gap:4px; padding:8px 12px 0; background:var(--panel); border-bottom:1px solid var(--line); }
  .tab { padding:8px 14px; border:1px solid transparent; border-bottom:0; border-radius:6px 6px 0 0; background:none; cursor:pointer; font:inherit; color:var(--mute); }
  .tab.active { background:var(--bg); border-color:var(--line); color:var(--ink); font-weight:600; position:relative; top:1px; }
  #open { margin-left:auto; margin-bottom:6px; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--accent); text-decoration:none; font-size:13px; }
  #frames { position:relative; flex:1; }
  #frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #empty { padding:40px; color:var(--mute); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"><h2>Projects</h2><div id="projects"></div></nav>
  <main id="main">
    <div id="banner">
      <span>Be signed into the same Google account in this browser that has access to the Sheets, or the tabs will show a login wall.</span>
      <button id="dismiss" aria-label="Dismiss">&times;</button>
    </div>
    <div id="bar">
      <div id="tabs"></div>
      <a id="open" class="hidden" target="_blank" rel="noopener">Open in Google Sheets</a>
    </div>
    <div id="frames"><div id="empty">Select a project.</div></div>
  </main>
</div>

<script>
// Sample data for Batch A. Replace the second sheet ID with a real one.
const PROJECTS = [
  { id:"p1", name:"Sample Project A", sheets:[
    { key:"budget",   title:"Budget",   id:"1KVAmnCwEllrdzVeZohZe_YpExf_NPf9E7pbzgHRQQ_M" },
    { key:"schedule", title:"Schedule", id:"1KVAmnCwEllrdzVeZohZe_YpExf_NPf9E7pbzgHRQQ_M" }
  ]},
  { id:"p2", name:"Sample Project B", sheets:[
    { key:"cast", title:"Cast", id:"1KVAmnCwEllrdzVeZohZe_YpExf_NPf9E7pbzgHRQQ_M" }
  ]}
];

const $ = id => document.getElementById(id);
const sheetUrl = (id, minimal) => `https://docs.google.com/spreadsheets/d/${id}/edit` + (minimal ? "?rm=minimal" : "");
const frames = {}; // "pid:key" -> iframe, created on first click and kept hidden afterwards
let current = { pid:null, key:null };

function renderProjects() {
  $("projects").innerHTML = "";
  PROJECTS.forEach(p => {
    const b = document.createElement("button");
    b.className = "project" + (p.id === current.pid ? " active" : "");
    b.textContent = p.name;
    b.onclick = () => selectProject(p.id);
    $("projects").appendChild(b);
  });
}

function renderTabs() {
  const p = PROJECTS.find(x => x.id === current.pid);
  $("tabs").innerHTML = "";
  p.sheets.forEach(s => {
    const b = document.createElement("button");
    b.className = "tab" + (s.key === current.key ? " active" : "");
    b.textContent = s.title;
    b.onclick = () => selectSheet(p.id, s.key);
    $("tabs").appendChild(b);
  });
}

function selectProject(pid) {
  const p = PROJECTS.find(x => x.id === pid);
  if (!p || !p.sheets.length) return;
  // Return to the last-viewed tab of this project if there was one.
  const last = p.lastKey && p.sheets.some(s => s.key === p.lastKey) ? p.lastKey : p.sheets[0].key;
  selectSheet(pid, last);
}

function selectSheet(pid, key) {
  const p = PROJECTS.find(x => x.id === pid);
  const s = p.sheets.find(x => x.key === key);
  p.lastKey = key;
  current = { pid, key };
  $("empty").classList.add("hidden");

  // Hide every frame, then show (or lazily create) the selected one.
  Object.values(frames).forEach(f => f.classList.add("hidden"));
  const fk = pid + ":" + key;
  if (!frames[fk]) {
    const f = document.createElement("iframe");
    f.src = sheetUrl(s.id, true);
    f.title = p.name + " - " + s.title;
    $("frames").appendChild(f);
    frames[fk] = f;
  }
  frames[fk].classList.remove("hidden");

  const a = $("open");
  a.href = sheetUrl(s.id, false);
  a.classList.remove("hidden");
  renderProjects();
  renderTabs();
}

$("dismiss").onclick = () => $("banner").classList.add("hidden");
renderProjects();
</script>
</body>
</html>
