<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScriptY — Home</title>
<style>
:root{
    /* Physical page */
    --a4w-mm: 215.9;
    --a4h-mm: 279.4;

    /* Margins (page-edge based) */
    --m-top-mm: 25.4;   /* 2.55cm (measured) */
    --m-bot-mm: 25.4;   /* ~2.45cm (measured) */
    --m-right-mm: 25.4;   /* 2.5cm */
    --m-left-mm: 38.1;    /* 3.9cm */


    /* Title page margins (Final Draft style: centered on full page, not script text column) */
    --tp-left-mm: 25.4;   /* match right so title text is truly centered on page */
    --tp-right-mm: 25.4;

    /* Wrap calibration (mm): tweak to match Final Draft line breaks across browser fonts */
    --wrap-cal-mm: 0;  /* wrap calibration (mm): adjust only if needed */

    /* Header band reserved for page number (non-editable) */
    --header-band-mm: 12;

    /* Baseline step (physical units) */
    --baseline-mm: 4.233; /* ~12pt in mm (12pt = 4.233mm) */
    --baseline-cal: 1.000; /* hidden calibration knob */
    --baseline-step-mm: calc(var(--baseline-mm) * var(--baseline-cal));

    /* Font */
    --font-size-pt: 12;
    --font-stack: "Courier Final Draft","Courier Prime","Courier New",monospace;

    /* Geometry (mm) – filled by JS */
    --x-action-L-mm: 39;
    --x-action-R-mm: 25;
    --x-character-L-mm: 0;
    --x-character-R-mm: 25;
    --x-dialogue-L-mm: 0;
    --x-dialogue-R-mm: 0;
    --x-paren-L-mm: 0;
    --x-paren-R-mm: 0;
    --x-trans-R-mm: 25;

    /* UI */
    --ui-bg: #101114;
    --ui-panel: #171922;
    --ui-border: #2a2f3a;
    --ui-text: #e9ecf2;
    --ui-muted: #aeb6c6;
    --ui-accent: #5b8cff;
  }

  

html, body {
  height: 100%;
}
body{
  margin:0;
  font-family: var(--font-stack, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
  background: radial-gradient(1400px 800px at 20% 10%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg, #0c0d10);
  color: var(--ui-text, #e7e9ef);
}

a{ color: inherit; }

.homeView{
    position: fixed;
    inset: 0;
    z-index: 9000;
    background: radial-gradient(1200px 700px at 20% 0%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg);
    color: var(--ui-text);
    display: none;
  }
  .homeView.show{ display:block; }
  .homeInner{
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }
  .homeTop{
    display:flex;
    align-items:center;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .homeBrand{
    display:flex; align-items:baseline; gap:10px;
  }
  .homeBrand .t1{ font-weight:700; letter-spacing:.3px; }
  .homeBrand .t2{ color: var(--ui-muted); font-size: 12px; }
  .homeActions{ display:flex; gap:10px; align-items:center; }
  .homeBtn{
    border: 1px solid var(--ui-border);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: var(--ui-text);
    padding: 10px 12px;
    border-radius: 12px;
    cursor:pointer;
    font-weight: 600;
  }
  .homeBtn:hover{ filter: brightness(1.05); }
  .homeBtn.primary{
    border-color: rgba(90,130,255,0.55);
    background: linear-gradient(180deg, rgba(90,130,255,0.25), rgba(90,130,255,0.10));
  }
  .homeSearchRow{
    display:flex;
    gap: 10px;
    align-items:center;
    margin: 14px 0 18px;
  }
  .homeSearch{
    flex:1;
    border: 1px solid var(--ui-border);
    background: rgba(23,25,34,0.65);
    color: var(--ui-text);
    padding: 10px 12px;
    border-radius: 12px;
    outline: none;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .homeHint{ color: var(--ui-muted); font-size: 12px; }
  .homeSectionTitle{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 14px 2px 10px;
  }
  .homeSectionTitle b{ font-size: 13px; letter-spacing:.25px; }
  .homeGrid{
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 980px){ .homeGrid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 620px){ .homeGrid{ grid-template-columns: 1fr; } }

  .docCard{
    border: 1px solid var(--ui-border);
    background: rgba(23,25,34,0.70);
    border-radius: 16px;
    padding: 14px 14px 12px;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    transition: transform .10s ease, filter .10s ease;
  }
  .docCard:hover{ transform: translateY(-1px); filter: brightness(1.05); }
  .docName{ font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .docMeta{ display:flex; gap:10px; color: var(--ui-muted); font-size: 12px; }
  .docMeta .dot{ opacity:.6; }
  .docEmpty{
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(23,25,34,0.35);
    border-radius: 16px;
    padding: 18px;
    color: var(--ui-muted);
    font-size: 13px;
  }
  .homeFooter{
    margin-top: 16px;
    color: var(--ui-muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .homeFooter code{
    font-family: var(--font-stack);
    font-size: 12px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
  }


/* In index.html, Home is the whole page */
.homeView{ position: relative; inset: auto; display:block; }
.homeView.show{ display:block; }

/* Fix the broken card class mismatch by defining the actual classes used here */
.homeGrid{ align-items: start; }

/* Doc-card (Google Docs-ish) */
.homeCard{
  appearance:none;
  border: 1px solid var(--ui-border);
  background: rgba(23,25,34,0.70);
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 10px 24px rgba(0,0,0,0.22);
  transition: transform .10s ease, filter .10s ease, border-color .10s ease;
}
.homeCard:hover{ transform: translateY(-1px); filter: brightness(1.05); }
.homeCard:focus{ outline: none; border-color: rgba(255,255,255,0.28); box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.22); }

.homeThumb{
  height: 110px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.00)),
    rgba(12,13,16,0.55);
  border-bottom: 1px solid rgba(255,255,255,0.10);
  position: relative;
}
.homeThumb::after{
  content:"";
  position:absolute;
  inset: 10px 12px 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.12);
}
.homeThumbLabel{
  position:absolute;
  left: 22px;
  top: 20px;
  font-size: 12px;
  letter-spacing: .8px;
  opacity: .75;
}

.homeCardBody{
  padding: 12px 14px 12px;
}
.homeCardTitle{
  font-weight: 700;
  margin: 0 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homeCardMeta{
  color: var(--ui-muted);
  font-size: 12px;
  display:flex;
  gap:10px;
  align-items: center;
}
.homeCardMeta .dot{ opacity: .6; }

.homeEmpty{
  border: 1px dashed rgba(255,255,255,0.18);
  background: rgba(23,25,34,0.35);
  border-radius: 16px;
  padding: 18px;
  color: var(--ui-muted);
  font-size: 13px;
}

/* Simple modal */
.modalShade{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display:none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modalShade.show{ display:flex; }
.modal{
  width: min(560px, calc(100vw - 24px));
  border: 1px solid var(--ui-border);
  background: rgba(23,25,34,0.92);
  border-radius: 18px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.55);
  padding: 16px;
}
.modalTop{ display:flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.modalTitle{ font-weight: 800; letter-spacing: .2px; }
.modalClose{
  border:1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  border-radius: 12px;
  padding: 8px 10px;
  cursor:pointer;
}
.modalLabel{ font-size: 12px; color: var(--ui-muted); margin: 10px 0 6px; }
.modalInput{
  width: 100%;
  box-sizing: border-box;
  border:1px solid rgba(255,255,255,0.14);
  background: rgba(0,0,0,0.25);
  color: var(--ui-text);
  border-radius: 12px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 13px;
}
.modalRow{ display:flex; gap:10px; margin-top: 12px; }
.modalBtn{
  border:1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  border-radius: 12px;
  padding: 10px 12px;
  cursor:pointer;
  font-family: inherit;
  font-weight: 700;
}
.modalBtn.primary{
  background: rgba(255,208,91,0.12);
  border-color: rgba(255,208,91,0.35);
}
</style>
</head>
<body>

<section class="homeView show" id="homeView" aria-label="Home">
  <div class="homeInner">
    <div class="homeTop">
      <div class="homeBrand">
        <div class="t1">SCRIPTY</div>
        <div class="t2">Recent scripts</div>
      </div>
      <div class="homeActions">
        <button class="homeBtn" type="button" id="homeCloudBtn" title="Cloud settings">Cloud</button>
        <button class="homeBtn primary" type="button" id="homeNewBtn" title="New script">New</button>
      </div>
    </div>

    <div class="homeSearchRow">
      <input class="homeSearch" id="homeSearch" type="text" placeholder="Search scripts…" autocomplete="off" spellcheck="false">
      <div class="homeHint" id="homeStatus">Not connected</div>
    </div>

    <div class="homeSectionTitle">
      <b>Drive Recents</b>
      <div class="homeHint"><span id="homeCount">0</span></div>
    </div>

    <div class="homeGrid" id="homeGrid"></div>

    <div class="homeFooter">
      Tip: Cloud URL only needs to be set once. Click a card to open it in the editor.
    </div>
  </div>
</section>

<div class="modalShade" id="cloudModalShade" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cloudModalTitle">
    <div class="modalTop">
      <div class="modalTitle" id="cloudModalTitle">Cloud settings</div>
      <button class="modalClose" type="button" id="cloudCloseBtn">Close</button>
    </div>

    <div class="modalLabel">Apps Script Web App URL</div>
    <input class="modalInput" id="cloudUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec" />

    <div class="modalRow">
      <button class="modalBtn" type="button" id="cloudTestBtn">Test</button>
      <button class="modalBtn primary" type="button" id="cloudSaveBtn">Save</button>
    </div>

    <div class="modalLabel" style="margin-top:12px;">Status</div>
    <div style="font-size:13px; color: var(--ui-muted);" id="cloudModalStatus">—</div>
  </div>
</div>

<script>
/* Safe localStorage wrapper */
const __LS = (()=>{ try{
  const ls = window.localStorage;
  const k = "__scripty_ls_test__";
  ls.setItem(k,"1"); ls.removeItem(k);
  return ls;
}catch(_e){ return null; }})();
const lsGetRaw = (key)=>{ try{ return __LS ? __LS.getItem(String(key)) : null; }catch(_e){ return null; } };
const lsSet    = (key, val)=>{ try{ __LS && __LS.setItem(String(key), String(val)); }catch(_e){} };

const CLOUD_ENDPOINT_KEY = "SCRIPTY_CLOUD_ENDPOINT_V1";

function normalizeEndpoint(url){
  let u = String(url||"").trim();
  if(!u) return "";
  u = u.replace(/\s+/g,"");
  // Allow pasting ?action=list etc — strip querystring
  try{
    const U = new URL(u);
    U.search = "";
    u = U.toString();
  }catch(_e){}
  return u;
}
function getCloudEndpoint(){ try{ return String(lsGetRaw(CLOUD_ENDPOINT_KEY) || "").trim(); }catch(_e){ return ""; } }
function setCloudEndpoint(url){ try{ lsSet(CLOUD_ENDPOINT_KEY, String(url||"").trim()); }catch(_e){} }

function setHomeStatus(t){ const el=document.getElementById("homeStatus"); if(el) el.textContent = t; }
function setHomeCount(n){ const el=document.getElementById("homeCount"); if(el) el.textContent = String(n||0); }

async function fetchJsonWithTimeout(url, ms=15000){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, { method:"GET", cache:"no-store", signal: ctl.signal });
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(_e){ throw new Error("Non-JSON response"); }
  }finally{ clearTimeout(t); }
}

function parseListPayload(payload){
  // Accept: ["A.json","B.json"] OR {ok:true,files:[{id,name,modified},...]}
  if(Array.isArray(payload)){
    return payload.map(n => ({ name: String(n), id: "", modified: "" }));
  }
  if(payload && typeof payload === "object"){
    const files = payload.files || payload.items || payload;
    if(Array.isArray(files)){
      return files.map(f => ({
        name: String(f.name || f),
        id: f.id ? String(f.id) : "",
        modified: f.modified ? String(f.modified) : ""
      })).filter(x => x.name);
    }
  }
  return [];
}

let __HOME_FILES = [];
const gridEl = document.getElementById("homeGrid");
const searchEl = document.getElementById("homeSearch");

function renderHome(){
  const q = String(searchEl?.value || "").trim().toLowerCase();
  const list = __HOME_FILES.filter(f => !q || f.name.toLowerCase().includes(q));
  setHomeCount(list.length);
  gridEl.innerHTML = "";

  if(!list.length){
    const empty = document.createElement("div");
    empty.className = "homeEmpty";
    empty.textContent = getCloudEndpoint()
      ? "No scripts found in Drive folder. Save at least once from the editor to create a file."
      : "Cloud not connected. Click Cloud to paste your Apps Script URL.";
    gridEl.appendChild(empty);
    return;
  }

  for(const f of list){
    const card = document.createElement("button");
    card.type = "button";
    card.className = "homeCard";

    const thumb = document.createElement("div");
    thumb.className = "homeThumb";
    const lab = document.createElement("div");
    lab.className = "homeThumbLabel";
    lab.textContent = "SCRIPT";
    thumb.appendChild(lab);

    const body = document.createElement("div");
    body.className = "homeCardBody";

    const title = document.createElement("div");
    title.className = "homeCardTitle";
    title.textContent = f.name.replace(/\.json$/i,"");

    const meta = document.createElement("div");
    meta.className = "homeCardMeta";

    const m1 = document.createElement("span");
    m1.textContent = f.modified ? ("Modified " + String(f.modified).replace("T"," ").replace("Z","")) : "Drive file";
    meta.appendChild(m1);

    body.appendChild(title);
    body.appendChild(meta);

    card.appendChild(thumb);
    card.appendChild(body);

    card.addEventListener("click", ()=>{
      const base = "editor.html";
      if(f.id) window.location.href = base + "?fileId=" + encodeURIComponent(f.id);
      else window.location.href = base + "?name=" + encodeURIComponent(f.name);
    });

    gridEl.appendChild(card);
  }
}

async function refreshHomeList(){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint){
    setHomeStatus("Not connected");
    __HOME_FILES = [];
    renderHome();
    return;
  }
  setHomeStatus("Loading…");
  try{
    const payload = await fetchJsonWithTimeout(endpoint + "?action=list&_=" + Date.now(), 15000);
    __HOME_FILES = parseListPayload(payload);
    // Sort newest first if modified is present
    if(__HOME_FILES.some(f => f.modified)){
      __HOME_FILES.sort((a,b)=> String(b.modified||"").localeCompare(String(a.modified||"")));
    }
    setHomeStatus("Connected");
    renderHome();
  }catch(err){
    console.error(err);
    setHomeStatus("Connection failed");
    __HOME_FILES = [];
    renderHome();
  }
}

// Modal controls
const shade = document.getElementById("cloudModalShade");
const cloudInput = document.getElementById("cloudUrlInput");
const cloudModalStatus = document.getElementById("cloudModalStatus");

function openCloudModal(){
  shade.classList.add("show");
  shade.setAttribute("aria-hidden","false");
  cloudInput.value = getCloudEndpoint();
  cloudInput.focus();
  cloudModalStatus.textContent = "—";
}
function closeCloudModal(){
  shade.classList.remove("show");
  shade.setAttribute("aria-hidden","true");
}

document.getElementById("homeCloudBtn").addEventListener("click", openCloudModal);
document.getElementById("cloudCloseBtn").addEventListener("click", closeCloudModal);
shade.addEventListener("click", (e)=>{ if(e.target===shade) closeCloudModal(); });

document.getElementById("cloudSaveBtn").addEventListener("click", async ()=>{
  const u = normalizeEndpoint(cloudInput.value);
  if(!u){ cloudModalStatus.textContent = "Please paste a URL."; return; }
  setCloudEndpoint(u);
  cloudModalStatus.textContent = "Saved.";
  closeCloudModal();
  await refreshHomeList();
});

document.getElementById("cloudTestBtn").addEventListener("click", async ()=>{
  const u = normalizeEndpoint(cloudInput.value);
  if(!u){ cloudModalStatus.textContent = "Please paste a URL."; return; }
  cloudModalStatus.textContent = "Testing…";
  try{
    const payload = await fetchJsonWithTimeout(u + "?action=list&_=" + Date.now(), 12000);
    const files = parseListPayload(payload);
    cloudModalStatus.textContent = "OK — found " + files.length + " file(s).";
  }catch(err){
    console.error(err);
    cloudModalStatus.textContent = "Failed — check URL / deployment permissions.";
  }
});

// New script
document.getElementById("homeNewBtn").addEventListener("click", ()=>{
  window.location.href = "editor.html?new=1";
});

searchEl.addEventListener("input", renderHome);

window.addEventListener("load", ()=>{
  refreshHomeList();
  if(window.location.hash==="#open") openCloudModal();
});
</script>

</body>
</html>
