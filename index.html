<!DOCTYPE html>

<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>ScriptY — Home</title>
<style>
:root{
    /* Physical page */
    --a4w-mm: 215.9;
    --a4h-mm: 279.4;

    /* Margins (page-edge based) */
    --m-top-mm: 25.4;   /* 2.55cm (measured) */
    --m-bot-mm: 25.4;   /* ~2.45cm (measured) */
    --m-right-mm: 25.4;   /* 2.5cm */
    --m-left-mm: 38.1;    /* 3.9cm */


    /* Title page margins (Final Draft style: centered on full page, not script text column) */
    --tp-left-mm: 25.4;   /* match right so title text is truly centered on page */
    --tp-right-mm: 25.4;

    /* Wrap calibration (mm): tweak to match Final Draft line breaks across browser fonts */
    --wrap-cal-mm: 0;  /* wrap calibration (mm): adjust only if needed */

    /* Header band reserved for page number (non-editable) */
    --header-band-mm: 12;

    /* Baseline step (physical units) */
    --baseline-mm: 4.233; /* ~12pt in mm (12pt = 4.233mm) */
    --baseline-cal: 1.000; /* hidden calibration knob */
    --baseline-step-mm: calc(var(--baseline-mm) * var(--baseline-cal));

    /* Font */
    --font-size-pt: 12;
    --font-stack: "Courier Final Draft","Courier Prime","Courier New",monospace;

    /* Geometry (mm) – filled by JS */
    --x-action-L-mm: 39;
    --x-action-R-mm: 25;
    --x-character-L-mm: 0;
    --x-character-R-mm: 25;
    --x-dialogue-L-mm: 0;
    --x-dialogue-R-mm: 0;
    --x-paren-L-mm: 0;
    --x-paren-R-mm: 0;
    --x-trans-R-mm: 25;

    /* UI */
    --ui-bg: #101114;
    --ui-panel: #171922;
    --ui-border: #2a2f3a;
    --ui-text: #e9ecf2;
    --ui-muted: #aeb6c6;
    --ui-accent: #5b8cff;
  }

  

html, body {
  height: 100%;
}
body{
  margin:0;
  font-family: var(--font-stack, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
  background: radial-gradient(1400px 800px at 20% 10%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg, #0c0d10);
  color: var(--ui-text, #e7e9ef);
}

a{ color: inherit; }

.homeView{
    position: fixed;
    inset: 0;
    z-index: 9000;
    background: radial-gradient(1200px 700px at 20% 0%, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 60%), var(--ui-bg);
    color: var(--ui-text);
    display: none;
  }
  .homeView.show{ display:block; }
  .homeInner{
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }
  .homeTop{
    display:flex;
    align-items:center;
    gap: 12px;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .homeBrand{
    display:flex; align-items:baseline; gap:10px;
  }
  .homeBrand .t1{ font-weight:700; letter-spacing:.3px; }
  .homeBrand .t2{ color: var(--ui-muted); font-size: 12px; }
  .homeActions{ display:flex; gap:10px; align-items:center; }
  .homeBtn{
    border: 1px solid var(--ui-border);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: var(--ui-text);
    padding: 10px 12px;
    border-radius: 12px;
    cursor:pointer;
    font-weight: 600;
  }
  .homeBtn:hover{ filter: brightness(1.05); }
  .homeBtn.primary{
    border-color: rgba(90,130,255,0.55);
    background: linear-gradient(180deg, rgba(90,130,255,0.25), rgba(90,130,255,0.10));
  }
  .homeSearchRow{
    display:flex;
    gap: 10px;
    align-items:center;
    margin: 14px 0 18px;
  }
  .homeSearch{
    flex:1;
    border: 1px solid var(--ui-border);
    background: rgba(23,25,34,0.65);
    color: var(--ui-text);
    padding: 10px 12px;
    border-radius: 12px;
    outline: none;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .homeHint{ color: var(--ui-muted); font-size: 12px; }
  .homeSectionTitle{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin: 14px 2px 10px;
  }
  .homeSectionTitle b{ font-size: 13px; letter-spacing:.25px; }
  .homeGrid{
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 980px){ .homeGrid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 620px){ .homeGrid{ grid-template-columns: 1fr; } }

  .docCard{
    border: 1px solid var(--ui-border);
    background: rgba(23,25,34,0.70);
    border-radius: 16px;
    padding: 14px 14px 12px;
    cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    transition: transform .10s ease, filter .10s ease;
  }
  .docCard:hover{ transform: translateY(-1px); filter: brightness(1.05); }
  .docName{ font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .docMeta{ display:flex; gap:10px; color: var(--ui-muted); font-size: 12px; }
  .docMeta .dot{ opacity:.6; }
  .docEmpty{
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(23,25,34,0.35);
    border-radius: 16px;
    padding: 18px;
    color: var(--ui-muted);
    font-size: 13px;
  }
  .homeFooter{
    margin-top: 16px;
    color: var(--ui-muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .homeFooter code{
    font-family: var(--font-stack);
    font-size: 12px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.10);
  }


/* In index.html, Home is the whole page */
.homeView{ position: relative; inset: auto; display:block; }
.homeView.show{ display:block; }

/* Fix the broken card class mismatch by defining the actual classes used here */
.homeGrid{ align-items: start; }

/* Doc-card (Google Docs-ish) */
.homeCard{
  appearance:none;
  border: 1px solid var(--ui-border);
  background: rgba(23,25,34,0.70);
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 10px 24px rgba(0,0,0,0.22);
  transition: transform .10s ease, filter .10s ease, border-color .10s ease;
}
.homeCard:hover{ transform: translateY(-1px); filter: brightness(1.05); }
.homeCard:focus{ outline: none; border-color: rgba(255,255,255,0.28); box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.22); }

.homeThumb{
  /* Mini A4 page thumbnail (portrait) */
  height: auto;
  aspect-ratio: 210 / 297; /* A4 */
  background: rgba(0,0,0,0.18);
  border-bottom: 1px solid rgba(255,255,255,0.10);
  position: relative;
}

/* The "paper" inside the thumbnail */
.homeThumb .thumbPaper{
  position:absolute;
  inset: 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.98);
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 14px 34px rgba(0,0,0,0.35);
  overflow: hidden;
}

/* Title-page preview typography */
.homeThumb .tpTitle,
.homeThumb .tpBy,
.homeThumb .tpName{
  position:absolute;
  left: 10%;
  right: 10%;
  text-align: center;
  color: #111;
  font-family: var(--font-stack);
  letter-spacing: .25px;
}

.homeThumb .tpTitle{
  top: 34%;
  font-weight: 700;
  font-size: 10px;
  line-height: 1.12;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homeThumb .tpBy{
  top: 45%;
  font-size: 8px;
  opacity: .85;
}
.homeThumb .tpName{
  top: 52%;
  font-size: 9px;
  font-weight: 600;
  opacity: .95;
}

.homeThumb .tpContact{
  position:absolute;
  right: 8%;
  bottom: 8%;
  width: 56%;
  text-align: left;
  font-size: 6.7px;
  line-height: 1.15;
  color: rgba(0,0,0,0.75);
  white-space: pre-line;
  overflow: hidden;
  max-height: 32%;
}

/* If fields are empty, hide them cleanly */
.homeThumb .isEmpty{ display:none; }

.homeThumbLabel{ display:none; }

.homeCardBody{ padding: 12px 14px 14px; }
.homeCardTitle{
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.homeCardMeta{
  margin-top: 6px;
  font-size: 12px;
  color: #ffffff;
  opacity: .72;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
}
.homeEmpty{
  grid-column: 1 / -1;
  padding: 22px 16px;
  border-radius: 16px;
  border: 1px dashed rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.03);
  opacity: .85;
}
.homeFooter{
  margin-top: 18px;
  opacity: .65;
  padding: 0 6px;
}


/* --- Placeholder (skeleton) cards for layout preview --- */
.homeCard.isPlaceholder{
  cursor: default;
}
.homeCard.isPlaceholder:hover{
  transform: none;
  box-shadow: var(--shadow);
  border-color: var(--border);
}
.skel{
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
}
.skel::after{
  content:"";
  position:absolute;
  inset:-40% -60%;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.00) 0%,
    rgba(255,255,255,0.08) 45%,
    rgba(255,255,255,0.00) 70%);
  transform: rotate(12deg);
  animation: skelShimmer 1.35s ease-in-out infinite;
}
@keyframes skelShimmer{
  0%{ transform: translateX(-35%) rotate(12deg); }
  100%{ transform: translateX(35%) rotate(12deg); }
}
.homeThumb.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.homeDocIcon{
  width:44px; height:56px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  position: relative;
  box-shadow: 0 10px 22px rgba(0,0,0,0.20);
}
.homeDocIcon:before{
  content:"";
  position:absolute;
  left:10px; right:10px; top:14px;
  height:3px;
  border-radius:3px;
  background: rgba(255,255,255,0.22);
  box-shadow:
    0 10px 0 rgba(255,255,255,0.16),
    0 20px 0 rgba(255,255,255,0.12),
    0 30px 0 rgba(255,255,255,0.10);
}
.homeTextLines{
  width: 62%;
  max-width: 220px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.homeLine{
  height: 12px;
  border-radius: 999px;
}
.homeLine.short{ width: 55%; }
.homeLine.long{ width: 92%; opacity: .95; }




/* --- Modal system (Cloud / Open) --- */
.modalShade{
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 26px 18px;
  background: rgba(0,0,0,0.62);
  z-index: 99999;
}
.modalShade.show{ display:flex; }
.modal{
  width: min(560px, 92vw);
  background: rgba(23,25,34,0.98);
  border: 1px solid var(--ui-border);
  border-radius: 16px;
  padding: 16px 16px 14px;
  box-shadow: 0 26px 70px rgba(0,0,0,0.55);
}
.modalTop{
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.modalTitle{ font-weight: 800; letter-spacing: .2px; }
.modalClose{
  border: 1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  padding: 8px 10px;
  border-radius: 12px;
  cursor:pointer;
  font-weight: 700;
}
.modalClose:hover{ filter: brightness(1.06); }
.modalLabel{
  font-size: 12px;
  color: var(--ui-muted);
  margin: 10px 2px 6px;
}
.modalInput{
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--ui-border);
  background: rgba(10,11,14,0.55);
  color: var(--ui-text);
  padding: 10px 12px;
  border-radius: 12px;
  outline: none;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.modalInput:focus{ border-color: rgba(90,130,255,0.65); box-shadow: 0 0 0 3px rgba(90,130,255,0.18); }
.modalRow{
  display:flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 12px;
}
.modalBtn{
  border: 1px solid var(--ui-border);
  background: rgba(255,255,255,0.06);
  color: var(--ui-text);
  padding: 9px 12px;
  border-radius: 12px;
  cursor:pointer;
  font-weight: 700;
}
.modalBtn:hover{ filter: brightness(1.06); }
.modalBtn.primary{
  border-color: rgba(90,130,255,0.55);
  background: linear-gradient(180deg, rgba(90,130,255,0.25), rgba(90,130,255,0.10));
}
/* --- UI CLEANUP PATCH (hide non-essential hints) --- */
.homeFooter{ display:none !important; }
/* Hide small status/count chips that clutter the corner */
.homeHint{ display:none !important; }
/* If any legacy debug blocks exist */
.debug, .dev, .devOnly, .debugOnly{ display:none !important; }


/* Home card text readability */
.homeCardTitle{color:#fff !important;}
.homeCardMeta{color:rgba(255,255,255,.72) !important;}

/* --- Recent strip --- */
.homeBrand .t1:empty, .homeBrand .t2:empty{ display:none; }
.recentRow{
  display:flex;
  gap: 12px;
  overflow-x: auto;
  padding: 2px 2px 10px;
  scroll-snap-type: x mandatory;
}
.recentRow::-webkit-scrollbar{ height: 10px; }
.recentRow::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 999px; }
.homeCard{ position: relative; }
.homeCard.mini{
  width: 190px;
  flex: 0 0 auto;
  scroll-snap-align: start;
}
.homeCard.mini .homeCardBody{ padding: 10px 12px 12px; }
.homeCard.mini .homeCardTitle{ font-size: 13px; }
.homeCard.mini .homeCardMeta{ font-size: 11px; }
.pinBtn{
  position: absolute;
  top: 10px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.18);
  background: rgba(255,255,255,0.88);
  color: rgba(0,0,0,0.78);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 10px 22px rgba(0,0,0,0.20);
}
.pinBtn:hover{ background: rgba(255,255,255,0.98); }
.pinBtn.pinned{
  background: rgba(12,12,12,0.82);
  border-color: rgba(255,255,255,0.30);
  color: #ffd24d;
}
.pinBtn.pinned:hover{ background: rgba(12,12,12,0.90); }

.homeCard.mini .homeCardMeta{
  justify-content: flex-start;
}

/* --- Card actions (rename / duplicate / delete) --- */
  .cardMenuBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.95);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
}
  .homeCard:hover .cardMenuBtn{ opacity:1; transform: scale(1); }
  .cardMenuBtn:hover{ background: rgba(255,255,255,0.14); }

  .cardMenu{
    position:fixed;
    z-index:9999;
    min-width: 180px;
    background:#fff;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    padding: 6px;
  }
  .cardMenu button{
    width:100%;
    text-align:left;
    background:transparent;
    border:0;
    padding:10px 10px;
    border-radius:10px;
    cursor:pointer;
    font: inherit;
  }
  .cardMenu button:hover{ background: rgba(0,0,0,0.06); }
  .cardMenu button.danger{ color:#b00020; }
  .cardMenu .sep{
    height:1px;
    margin:6px 6px;
    background: rgba(0,0,0,0.08);
  }

  .homeCardTitle.isEditing{
    padding: 0;
  }
  .titleEditInput{
    width:100%;
    font: inherit;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.18);
    outline: none;
    background:#fff;
  }
  .titleEditInput:focus{
    border-color: rgba(0,0,0,0.30);
  }



.cardActions{
  display:inline-flex;
  align-items:center;
  gap: 10px;
  opacity: .98;
}
.renameBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.95);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  user-select:none;
}
.homeCardTitle.isEditing{
  cursor:text;
}
.titleEditInput{
  width: 100%;
  font-size: 16px;
  font-weight: 650;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  border-radius: 10px;
  padding: 6px 8px;
  outline: none;
}

</style>
</meta></head>
<body>
<section aria-label="Home" class="homeView show" id="homeView">
<div class="homeInner">
<div class="homeTop">
<div class="homeBrand">
<div class="t1"></div>
<div class="t2"></div>
</div>
<div class="homeActions">
<button class="homeBtn" id="homeCloudBtn" title="Cloud settings" type="button">Cloud</button>
<button class="homeBtn" id="homeOpenBtn" title="Open from link or ID" type="button">Open</button>
<button class="homeBtn primary" id="homeNewBtn" title="New script" type="button">New</button>
</div>
</div>
<div class="homeSearchRow">
<input autocomplete="off" class="homeSearch" id="homeSearch" placeholder="Search scripts…" spellcheck="false" type="text"/>
<div class="homeHint" id="homeStatus">Not connected</div>
</div>
<div id="homeRecentSection">
<div class="homeSectionTitle">
<b>Recent</b>
<div class="homeHint"></div>
</div>
<div aria-label="Recent scripts" class="recentRow" id="homeRecentRow"></div>
</div>
<div class="homeSectionTitle" id="homeAllSectionTitle">
<b>All scripts</b>
<div class="homeHint"><span id="homeCount">0</span></div>
</div>
<div class="homeGrid" id="homeGrid"></div>
</div>
</section>
<div aria-hidden="true" class="modalShade" id="cloudModalShade">
<div aria-labelledby="cloudModalTitle" aria-modal="true" class="modal" role="dialog">
<div class="modalTop">
<div class="modalTitle" id="cloudModalTitle">Cloud settings</div>
<button class="modalClose" id="cloudCloseBtn" type="button">Close</button>
</div>
<div class="modalLabel">Apps Script Web App URL</div>
<input class="modalInput" id="cloudUrlInput" placeholder="https://script.google.com/macros/s/.../exec" type="text">
<div class="modalRow">
<button class="modalBtn" id="cloudTestBtn" type="button">Test</button>
<button class="modalBtn primary" id="cloudSaveBtn" type="button">Save</button>
</div>
<div class="modalLabel" style="margin-top:12px;">Status</div>
<div id="cloudModalStatus" style="font-size:13px; color: var(--ui-muted);">—</div>
</input></div>
</div>
<div aria-hidden="true" class="modalShade" id="openModalShade">
<div aria-labelledby="openModalTitle" aria-modal="true" class="modal" role="dialog">
<div class="modalTop">
<div class="modalTitle" id="openModalTitle">Open from link</div>
<button class="modalClose" id="openCloseBtn" type="button">Close</button>
</div>
<div class="modalLabel">Paste a Google Drive file link, file ID, or an editor link</div>
<input class="modalInput" id="openInput" placeholder="Drive link (…/d/FILEID/…) or FILEID or editor.html?pid=…" type="text"/>
<div class="modalRow">
<button class="modalBtn" id="openClearBtn" type="button">Clear</button>
<button class="modalBtn primary" id="openGoBtn" type="button">Open</button>
</div>
<div class="modalLabel" style="margin-top:12px;">Status</div>
<div id="openModalStatus" style="font-size:13px; color: var(--ui-muted);">—</div>
</div>
</div>
<script>

/* Safe localStorage wrapper */
const __LS = (()=>{ try{
  const ls = window.localStorage;
  const k = "__scripty_ls_test__";
  ls.setItem(k,"1"); ls.removeItem(k);
  return ls;
}catch(_e){ return null; }})();
const lsGetRaw = (key)=>{ try{ return __LS ? __LS.getItem(String(key)) : null; }catch(_e){ return null; } };
const lsSet    = (key, val)=>{ try{ __LS && __LS.setItem(String(key), String(val)); }catch(_e){} };

// Cloud endpoint storage
const CLOUD_ENDPOINT_KEY = "SCRIPTY_CLOUD_ENDPOINT_V1";
// Support legacy keys from older builds so users don't have to re-enter the URL.
const CLOUD_ENDPOINT_KEYS = [
  "SCRIPTY_CLOUD_ENDPOINT_V1",
  "SCRIPTY_CLOUD_ENDPOINT",
  "SCRIPTY_CLOUD_URL",
  "CLOUD_ENDPOINT",
  "SCRIPTY_GAS_ENDPOINT",
  "SCRIPTY_CLOUD_ENDPOINT_V0"
];


function showModal(shadeEl, show){
  if(!shadeEl) return;
  shadeEl.classList.toggle("show", !!show);
  shadeEl.setAttribute("aria-hidden", show ? "false" : "true");
}
function parseDriveFileId(input){
  const s = String(input||"").trim();
  if(!s) return "";
  // If it's already an ID (Drive ids are typically 25+ chars with - and _)
  if(/^[A-Za-z0-9_-]{20,}$/.test(s) && !s.includes("http")) return s;

  // Try to extract from known URL patterns
  try{
    const u = new URL(s);
    const path = u.pathname || "";
    const m1 = path.match(/\/d\/([A-Za-z0-9_-]{10,})/);
    if(m1) return m1[1];
    const m2 = path.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/);
    if(m2) return m2[1];
    const idParam = u.searchParams.get("id");
    if(idParam) return idParam;
    // Some share links embed the id at the end
    const m3 = path.match(/\/([A-Za-z0-9_-]{20,})$/);
    if(m3) return m3[1];
  }catch(_e){
    // Not a URL; continue
  }
  // If it's an editor link string, try pid/fileId query style without URL parsing
  const mPid = s.match(/[?&]pid=([A-Za-z0-9_-]{6,})/i);
  if(mPid) return { pid: mPid[1] };
  const mFile = s.match(/[?&](fileId|fileid)=([A-Za-z0-9_-]{10,})/i);
  if(mFile) return mFile[2];

  return "";
}


function normalizeEndpoint(url){
  let u = String(url||"").trim();
  if(!u) return "";
  u = u.replace(/\s+/g,"");
  // Allow pasting ?action=list etc — strip querystring
  try{
    const U = new URL(u);
    U.search = "";
    u = U.toString();
  }catch(_e){}
  return u;
}
function getCloudEndpoint(){
  try{
    for(const k of CLOUD_ENDPOINT_KEYS){
      const v = normalizeEndpoint(lsGetRaw(k));
      if(v) return v;
    }
  }catch(_e){}
  return "";
}
function setCloudEndpoint(url){
  const u = normalizeEndpoint(url);
  if(!u) return;
  try{
    // Write to V1 and legacy keys so editor builds can always find it.
    for(const k of CLOUD_ENDPOINT_KEYS){
      try{ lsSet(k, u); }catch(_e){}
    }
    try{ sessionStorage && sessionStorage.setItem("SCRIPTY_CLOUD_ENDPOINT_SESSION", u); }catch(_e){}
  }catch(_e){}
}

async function fetchJsonWithTimeout(url, ms=15000){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, { method:"GET", cache:"no-store", signal: ctl.signal });
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(_e){ throw new Error("Non-JSON response"); }
  }finally{ clearTimeout(t); }
}


async function postJsonWithTimeout(url, payload, timeoutMs=20000){
  // Use iframe form + postMessage to bypass CORS (GitHub Pages -> Apps Script)
  return await postViaIframe_(url, payload || {}, timeoutMs);
}

function postViaIframe_(url, payload, timeoutMs=20000){
  return new Promise((resolve, reject)=>{
    const endpoint = String(url||"");
    if(!endpoint) return reject(new Error("Cloud URL not set."));
    const iframeName = "scriptY_iframe_" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.position = "fixed";
    iframe.style.left = "-9999px";
    iframe.style.top = "-9999px";
    iframe.style.width = "1px";
    iframe.style.height = "1px";
    iframe.style.opacity = "0";
    iframe.setAttribute("aria-hidden","true");

    const form = document.createElement("form");
    form.method = "POST";
    form.action = endpoint;
    form.target = iframeName;
    form.enctype = "application/x-www-form-urlencoded";

    const inp = document.createElement("input");
    inp.type = "hidden";
    inp.name = "payload";
    inp.value = JSON.stringify(payload || {});
    form.appendChild(inp);

    let done = false;
    const cleanup = ()=>{
      if(done) return;
      done = true;
      window.removeEventListener("message", onMsg);
      clearTimeout(tmo);
      try{ form.remove(); }catch(_e){}
      try{ iframe.remove(); }catch(_e){}
    };

    const onMsg = (ev)=>{
      // Only accept objects
      if(!ev || typeof ev.data !== "object" || ev.data === null) return;
      // Apps Script webapp origin is typically script.google.com
      // but some deployments may postMessage from googleusercontent; accept both.
      const origin = String(ev.origin||"");
      if(origin && !(origin.includes("google.com") || origin.includes("googleusercontent.com"))) return;
      cleanup();
      resolve(ev.data);
    };

    const tmo = setTimeout(()=>{
      cleanup();
      reject(new Error("Request timed out"));
    }, timeoutMs);

    window.addEventListener("message", onMsg);

    document.body.appendChild(iframe);
    document.body.appendChild(form);
    try{ form.submit(); }catch(ex){
      cleanup();
      reject(ex);
    }
  });
}

let __cardMenuEl = null;

  if(__cardMenuEl && __cardMenuEl.parentNode) __cardMenuEl.parentNode.removeChild(__cardMenuEl);
  __cardMenuEl = null;
}

function safeBaseName_(name){
  return String(name||"").replace(/\.json$/i,"").trim() || "Untitled";
}
function sanitizeName_(name){
  const base = String(name||"").trim().replace(/\.json$/i,"");
  const safe = base.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g," ").trim();
  return safe || "Untitled";
}
function makeCopyName_(base){
  const b = sanitizeName_(base);
  return (b + " Copy").replace(/\s+/g," ").trim();
}

function setCardTitleText_(titleEl, text){
  if(!titleEl) return;
  titleEl.classList.remove("isEditing");
  titleEl.textContent = text;
}

async function renameFile_(f, newTitle){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");
  const name = sanitizeName_(newTitle);

  const resp = await postJsonWithTimeout(endpoint, {
    action: "rename",
    fileId: String(f.id || ""),
    name: name
  }, 20000);

  if(!resp || resp.ok !== true) throw new Error(resp && (resp.error||resp.message) ? (resp.error||resp.message) : "Rename failed");
  return resp;
}

async function duplicateFile_(f){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");

  const base = safeBaseName_(f && f.name ? f.name : "");
  const copyName = makeCopyName_(base);

  const resp = await postJsonWithTimeout(endpoint, {
    action: "duplicate",
    fileId: String(f.id || ""),
    name: copyName
  }, 20000);

  if(!resp || resp.ok !== true) throw new Error(resp && (resp.error||resp.message) ? (resp.error||resp.message) : "Duplicate failed");
  return resp;
}

async function deleteFile_(f){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) throw new Error("Cloud URL not set.");
  const resp = await postJsonWithTimeout(endpoint, { action:"delete", fileId: String(f.id||"") }, 20000);
  if(!resp || resp.ok !== true) throw new Error(resp && (resp.error||resp.message) ? (resp.error||resp.message) : "Delete failed");
  return resp;
}

function startInlineRename_(titleEl, f){
  if(!titleEl) return;
  closeCardMenu_();

  const current = (titleEl.textContent || "").trim() || safeBaseName_(f.name);
  titleEl.classList.add("isEditing");
  titleEl.textContent = "";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "titleEditInput";
  input.value = current;
  input.spellcheck = false;
  titleEl.appendChild(input);
  input.focus();
  input.select();

  // Commit rename if the user clicks anywhere outside the title (even if focus doesn't change)
  window.__SCRIPTY_ACTIVE_RENAME = { titleEl, input, finish:null };
  if(!window.__SCRIPTY_RENAME_OUTSIDE_INSTALLED){
    window.__SCRIPTY_RENAME_OUTSIDE_INSTALLED = true;
    document.addEventListener("pointerdown", (ev)=>{
      const ar = window.__SCRIPTY_ACTIVE_RENAME;
      if(!ar || !ar.titleEl || !ar.finish) return;
      if(ar.titleEl.contains(ev.target)) return;
      // Clicking off anywhere commits.
      ar.finish(true);
    }, true);
  }

  const finish = async (commit)=>{
    // prevent double-commit
    if(finish.__done) return; finish.__done = true;
    try{ if(window.__SCRIPTY_ACTIVE_RENAME) window.__SCRIPTY_ACTIVE_RENAME.finish = null; }catch(_e){}
    try{ if(window.__SCRIPTY_ACTIVE_RENAME) window.__SCRIPTY_ACTIVE_RENAME.finish = null; }catch(_e){}
    input.removeEventListener("keydown", onKey);
    input.removeEventListener("blur", onBlur);

    const next = sanitizeName_(input.value);
    try{ window.__SCRIPTY_ACTIVE_RENAME = null; }catch(_e){}
    try{ window.__SCRIPTY_ACTIVE_RENAME = null; }catch(_e){}
    if(!commit){
      setCardTitleText_(titleEl, current);
      return;
    }
    if(next === sanitizeName_(current)){
      setCardTitleText_(titleEl, current);
      return;
    }

    setHomeStatus("Renaming…");
    try{
      await renameFile_(f, next);
      // Update local record
      f.name = next + ".json";
      setCardTitleText_(titleEl, next);

      // Keep thumb cache aligned
      try{
        const filekey = thumbKeyForFile(f);
        setCachedThumbMeta(f, { title: next, writtenby:"", name:"", contact:"" });
        // Update pin label
        // (pins are keyed by id where possible, so usually unchanged)
      }catch(_e){}

      setHomeStatus("Renamed");
      setTimeout(()=>setHomeStatus("Ready"), 1000);
      // Refresh list to update modified times (non-blocking)
      setTimeout(()=>{ try{ refreshHomeList(); }catch(_e){} }, 200);
    }catch(err){
      console.warn(err);
      setCardTitleText_(titleEl, current);
      setHomeStatus("Rename failed: " + (err && err.message ? err.message : "Unknown"));
    }
  };

  try{ if(window.__SCRIPTY_ACTIVE_RENAME) window.__SCRIPTY_ACTIVE_RENAME.finish = finish; }catch(_e){}

  function onKey(e){
    try{ e.stopPropagation(); }catch(_e){}
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  }
  function onBlur(e){ try{ e && e.stopPropagation && e.stopPropagation(); }catch(_e){} finish(true); }

  input.addEventListener("pointerdown", (e)=>{ try{ e.stopPropagation(); }catch(_e){} });
  input.addEventListener("keydown", onKey);
  input.addEventListener("blur", onBlur);
}

function openCardMenu_(anchorEl, f, titleEl){
  closeCardMenu_();

  const menu = document.createElement("div");
  menu.className = "cardMenu";
  menu.innerHTML = "";
  const mk = (label, cls, fn)=>{
    const b = document.createElement("button");
    b.type="button";
    b.textContent = label;
    if(cls) b.className = cls;
    b.addEventListener("click", async (e)=>{
      e.preventDefault();
      e.stopPropagation();
      closeCardMenu_();
      await fn();
    });
    return b;
  };

  menu.appendChild(mk("Duplicate", "", async ()=>{
    setHomeStatus("Duplicating…");
    try{
      const resp = await duplicateFile_(f);
      // Add immediately if we have metadata
      try{
        if(resp && resp.file && resp.file.id){
          __HOME_FILES = [resp.file].concat(__HOME_FILES || []);
          touchRecent_(resp.file);
        }
      }catch(_e){}
      setHomeStatus("Duplicated");
      renderHome();
      setTimeout(()=>{ try{ refreshHomeList(); }catch(_e){} }, 200);
    }catch(err){
      console.warn(err);
      setHomeStatus("Duplicate failed: " + (err && err.message ? err.message : "Unknown"));
    }
  }));
  const sep = document.createElement("div"); sep.className="sep";
  menu.appendChild(sep);
  menu.appendChild(mk("Delete", "danger", async ()=>{
    const nm = (titleEl && titleEl.textContent) ? titleEl.textContent : safeBaseName_(f.name);
    const ok = confirm('Delete "' + nm + '"?\n\nThis moves the file to Trash in Google Drive.');
    if(!ok) return;
    setHomeStatus("Deleting…");
    try{
      await deleteFile_(f);
      setHomeStatus("Deleted");
      // Remove locally immediately
      __HOME_FILES = __HOME_FILES.filter(x => String(x.id||"") !== String(f.id||""));
      // Remove from recents list
      try{
        const fk = thumbKeyForFile(f);
        saveRecents_(loadRecents_().filter(r => r.filekey !== fk));
      }catch(_e){}
      renderHome();
      setTimeout(()=>{ try{ refreshHomeList(); }catch(_e){} }, 200);
    }catch(err){
      console.warn(err);
      setHomeStatus("Delete failed: " + (err && err.message ? err.message : "Unknown"));
    }
  }));

  document.body.appendChild(menu);
  __cardMenuEl = menu;

  const r = anchorEl.getBoundingClientRect();
  const margin = 8;
  let left = Math.min(window.innerWidth - menu.offsetWidth - margin, r.right - menu.offsetWidth);
  let top  = Math.min(window.innerHeight - menu.offsetHeight - margin, r.bottom + 6);
  if(left < margin) left = margin;
  if(top < margin) top = margin;
  menu.style.left = left + "px";
  menu.style.top  = top + "px";
}


function parseListPayload(payload){
  // Accept:
  // 1) ["A.json","B.json"]
  // 2) { ok:true, files:[{id,name,modified}...] }
  // 3) Drive API-ish: { files:[{id,name,modifiedTime}...] }
  // 4) Legacy: { items:[{fileId,title,modifiedTime}...] }
  if(Array.isArray(payload)){
    return payload.map(n => ({ name: String(n), id: "", modified: "" })).filter(x=>x.name);
  }
  if(payload && typeof payload === "object"){
    const files = payload.files || payload.items || payload.itemsList || payload;
    if(Array.isArray(files)){
      return files.map(f => {
        if(typeof f === "string") return { name: f, id: "", modified: "" };
        const name = String(f.name || f.title || f.filename || f.fileName || f.file_name || "");
        const id = String(f.id || f.fileId || f.file_id || (f.file && (f.file.id||f.file.fileId)) || "");
        const modified = String(f.modified || f.modifiedTime || f.modified_time || f.updated || f.updatedTime || f.lastModified || "");
        return { name, id, modified };
      }).filter(x => x.name);
    }
  }
  return [];
}

let __HOME_FILES = [];
const gridEl = document.getElementById("homeGrid");
const searchEl = document.getElementById("homeSearch");

const recentRowEl = document.getElementById("homeRecentRow");
const recentSectionEl = document.getElementById("homeRecentSection");

const RECENTS_KEY = "SCRIPTY_RECENTS_V1";
const PINS_KEY = "SCRIPTY_PINS_V1";

function loadRecents_(){
  try{
    const raw = localStorage.getItem(RECENTS_KEY) || "[]";
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(_e){ return []; }
}
function saveRecents_(arr){
  try{ localStorage.setItem(RECENTS_KEY, JSON.stringify(Array.isArray(arr)?arr:[])); }catch(_e){}
}
function loadPinsSet_(){
  try{
    const raw = localStorage.getItem(PINS_KEY) || "[]";
    const arr = JSON.parse(raw);
    return new Set(Array.isArray(arr) ? arr : []);
  }catch(_e){ return new Set(); }
}
function savePinsSet_(set){
  try{ localStorage.setItem(PINS_KEY, JSON.stringify(Array.from(set||[]))); }catch(_e){}
}
function isPinnedKey_(filekey){
  return loadPinsSet_().has(filekey);
}
function togglePinKey_(filekey){
  const set = loadPinsSet_();
  if(set.has(filekey)) set.delete(filekey);
  else set.add(filekey);
  savePinsSet_(set);
}
function touchRecent_(f){
  if(!f) return;
  const filekey = thumbKeyForFile(f);
  let rec = loadRecents_();
  rec = rec.filter(r => r && r.filekey !== filekey);
  rec.unshift({ filekey, id: String(f.id||""), name: String(f.name||""), ts: Date.now() });
  if(rec.length > 40) rec = rec.slice(0, 40);
  saveRecents_(rec);
}
function resolveFileByRecent_(r){
  if(!r) return null;
  // Prefer exact filekey match
  const byKey = __HOME_FILES.find(f => thumbKeyForFile(f) === r.filekey);
  if(byKey) return byKey;
  // Fallback: match by id or name
  if(r.id){
    const byId = __HOME_FILES.find(f => String(f.id||"") === String(r.id));
    if(byId) return byId;
  }
  if(r.name){
    const byName = __HOME_FILES.find(f => String(f.name||"") === String(r.name));
    if(byName) return byName;
  }
  return null;
}


const __FMT_AU_DATE = new Intl.DateTimeFormat("en-AU", {
  timeZone: "Australia/Melbourne",
  day: "2-digit",
  month: "2-digit",
  year: "2-digit"
});
const __FMT_AU_TIME = new Intl.DateTimeFormat("en-AU", {
  timeZone: "Australia/Melbourne",
  hour: "2-digit",
  minute: "2-digit",
  hour12: false
});
function fmtModifiedAU_(iso){
  try{
    if(!iso) return "";
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return __FMT_AU_DATE.format(d) + "  " + __FMT_AU_TIME.format(d);
  }catch(_e){ return ""; }
}

function renderRecentRow_(q){
  if(!recentSectionEl || !recentRowEl) return;
  if(q){
    recentSectionEl.style.display = "none";
    return;
  }
  const rec = loadRecents_();
  const pins = loadPinsSet_();

  // Rank pinned by last-open timestamp if we have it
  const tsByKey = new Map(rec.map(r => [r.filekey, Number(r.ts||0)]));
  const pinnedKeys = Array.from(pins);
  pinnedKeys.sort((a,b)=> (tsByKey.get(b)||0) - (tsByKey.get(a)||0));

  const used = new Set();
  const files = [];

  for(const k of pinnedKeys){
    const f = __HOME_FILES.find(x => thumbKeyForFile(x) === k);
    if(f && !used.has(k)){
      files.push(f);
      used.add(k);
    }
  }
  for(const r of rec){
    const f = resolveFileByRecent_(r);
    if(!f) continue;
    const k = thumbKeyForFile(f);
    if(used.has(k)) continue;
    files.push(f);
    used.add(k);
  }

  const top = files.slice(0, 6);
  recentRowEl.innerHTML = "";

  if(!top.length){
    recentSectionEl.style.display = "none";
    return;
  }
  recentSectionEl.style.display = "block";

  for(const f of top){
    recentRowEl.appendChild(buildCard_(f, {mini:true}));
  }
}

let __AFTER_CLOUD = null;
function ensureCloudThen(fn){
  const ep = normalizeEndpoint(getCloudEndpoint());
  if(ep){
    try{ fn(ep); }catch(_e){}
    return true;
  }
  __AFTER_CLOUD = fn;
  try{ openCloudModal(); }catch(_e){}
  try{ cloudModalStatus && (cloudModalStatus.textContent = "Paste your Apps Script URL, then Save."); }catch(_e){}
  return false;
}



// --- Title-page thumbnail helpers ---
const THUMB_META_PREFIX = "SCRIPTY_THUMB_META:";
const THUMB_FETCH_LIMIT = 18;      // only hydrate the first N cards (recents)
const THUMB_CONCURRENCY = 3;

function thumbKeyForFile(f){
  const id = (f && f.id) ? ("id:" + String(f.id)) : "";
  const name = (f && f.name) ? ("name:" + String(f.name)) : "name:unknown";
  return THUMB_META_PREFIX + (id || name);
}
function getCachedThumbMeta(f){
  try{
    const raw = localStorage.getItem(thumbKeyForFile(f));
    if(!raw) return null;
    const obj = JSON.parse(raw);
    // If we have a modified stamp, only use cache when it matches.
    const m = String(f.modified || "");
    if(m && obj && String(obj.modified||"") !== m) return null;
    return obj && obj.meta ? obj.meta : null;
  }catch(_e){ return null; }
}
function setCachedThumbMeta(f, meta){
  try{
    const obj = { modified: String(f.modified||""), meta: meta || {} };
    localStorage.setItem(thumbKeyForFile(f), JSON.stringify(obj));
  }catch(_e){}
}
function cleanText(s){
  return String(s||"").replace(/\r/g,"").replace(/\u00A0/g," ").replace(/[\u200B\u200C\u200D\uFEFF]/g,"").trim();
}

function cssAttrEscape(s){
  // Escapes for use inside a quoted attribute selector: [data-x="..."]
  return String(s||"").replace(/\\/g,"\\\\").replace(/"/g,'\\"');
}
function titleMetaFromDoc(doc, fallbackName){
  const t = (doc && doc.title) ? doc.title : {};
  return {
    title: cleanText(t.title) || cleanText(fallbackName || "Untitled"),
    writtenby: cleanText(t.writtenby) || "",
    name: cleanText(t.name) || "",
    contact: cleanText(t.contact) || ""
  };
}
function ensureThumbStructure(thumbEl){
  if(!thumbEl) return null;
  if(thumbEl.querySelector(".thumbPaper")) return thumbEl;
  const paper = document.createElement("div");
  paper.className = "thumbPaper";

  const a = document.createElement("div"); a.className = "tpTitle"; a.dataset.k="title";
  const b = document.createElement("div"); b.className = "tpBy"; b.dataset.k="writtenby";
  const c = document.createElement("div"); c.className = "tpName"; c.dataset.k="name";
  const d = document.createElement("div"); d.className = "tpContact"; d.dataset.k="contact";

  paper.appendChild(a); paper.appendChild(b); paper.appendChild(c); paper.appendChild(d);
  thumbEl.appendChild(paper);
  return thumbEl;
}
function applyTitleThumb(thumbEl, meta){
  ensureThumbStructure(thumbEl);
  const setField = (sel, val)=>{
    const el = thumbEl.querySelector(sel);
    if(!el) return;
    const v = cleanText(val);
    el.textContent = v;
    if(!v) el.classList.add("isEmpty"); else el.classList.remove("isEmpty");
  };
  setField(".tpTitle", meta && meta.title);
  setField(".tpBy", meta && meta.writtenby);
  setField(".tpName", meta && meta.name);
  setField(".tpContact", meta && meta.contact);
}

async function fetchTitleMetaForFile(f, endpoint){
  const ep = normalizeEndpoint(endpoint || getCloudEndpoint());
  if(!ep) throw new Error("Cloud URL not set.");
  const qs = f.id
    ? ("action=load&fileId=" + encodeURIComponent(f.id))
    : ("action=load&name=" + encodeURIComponent(f.name));
  const payload = await fetchJsonWithTimeout(ep + "?" + qs + "&_=" + Date.now(), 20000);
  const doc = payload && payload.doc ? payload.doc : null;
  if(!doc) throw new Error("No doc returned (action=load missing).");
  return titleMetaFromDoc(doc, (payload && payload.name) ? payload.name.replace(/\.json$/i,"") : f.name.replace(/\.json$/i,""));
}

async function hydrateTitleThumbs(files){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint) return;

  const list = (files || []).slice(0, THUMB_FETCH_LIMIT);

  // Simple concurrency pool
  let i = 0;
  const workers = new Array(THUMB_CONCURRENCY).fill(0).map(async ()=>{
    while(i < list.length){
      const f = list[i++];
      const card = document.querySelector(`[data-filekey="${cssAttrEscape(thumbKeyForFile(f))}"]`);
      const thumb = card ? card.querySelector(".homeThumb") : null;
      if(!thumb) continue;

      // Cached?
      const cached = getCachedThumbMeta(f);
      if(cached){
        applyTitleThumb(thumb, cached);
        continue;
      }

      try{
        const meta = await fetchTitleMetaForFile(f, endpoint);
        setCachedThumbMeta(f, meta);
        applyTitleThumb(thumb, meta);
      }catch(err){
        // Silent fail: keep placeholder look
        console.warn("Thumb hydrate failed for", f && f.name, err);
      }
    }
  });

  await Promise.all(workers);
}

function renderHome(){
  const q = String(searchEl?.value || "").trim().toLowerCase();
  const list = __HOME_FILES.filter(f => !q || f.name.toLowerCase().includes(q));
  setHomeCount(list.length);
  gridEl.innerHTML = "";

  renderRecentRow_(q);

  if(!list.length){
    const empty = document.createElement("div");
    empty.className = "homeEmpty";
    empty.style.gridColumn = "1 / -1";
    empty.innerHTML = getCloudEndpoint()
      ? "No scripts found yet — save once from the editor to create your first file."
      : "Cloud not connected — click <b>Cloud</b> to paste your Apps Script URL.";
    gridEl.appendChild(empty);
    return;
}

  for(const f of list){
    gridEl.appendChild(buildCard_(f, {mini:false}));
  }
}

async function refreshHomeList(){
  const endpoint = normalizeEndpoint(getCloudEndpoint());
  if(!endpoint){
    setHomeStatus("Not connected");
    __HOME_FILES = [];
    renderHome();
    return;
  }
  setHomeStatus("Loading…");
  try{
    const payload = await fetchJsonWithTimeout(endpoint + "?action=list&_=" + Date.now(), 15000);
    __HOME_FILES = parseListPayload(payload);
    // Sort newest first if modified is present
    if(__HOME_FILES.some(f => f.modified)){
      __HOME_FILES.sort((a,b)=> String(b.modified||"").localeCompare(String(a.modified||"")));
    }
    setHomeStatus("Connected");
    renderHome();
    // Hydrate the first set of thumbnails with real title-page data (async)
    hydrateTitleThumbs(__HOME_FILES);
  }catch(err){
    console.error(err);
    setHomeStatus("Connection failed");
    __HOME_FILES = [];
    renderHome();
  }
}

// Modal controls
const shade = document.getElementById("cloudModalShade");
const cloudInput = document.getElementById("cloudUrlInput");
const cloudModalStatus = document.getElementById("cloudModalStatus");

function openCloudModal(){
  shade.classList.add("show");
  shade.setAttribute("aria-hidden","false");
  cloudInput.value = getCloudEndpoint();
  cloudInput.focus();
  cloudModalStatus.textContent = "—";
}
function closeCloudModal(){
  shade.classList.remove("show");
  shade.setAttribute("aria-hidden","true");
}

document.getElementById("homeCloudBtn").addEventListener("click", openCloudModal);
document.getElementById("cloudCloseBtn").addEventListener("click", closeCloudModal);
shade.addEventListener("click", (e)=>{ if(e.target===shade) closeCloudModal(); });

document.getElementById("cloudSaveBtn").addEventListener("click", async ()=>{
  const u = normalizeEndpoint(cloudInput.value);
  if(!u){ cloudModalStatus.textContent = "Please paste a URL."; return; }
  setCloudEndpoint(u);
  cloudModalStatus.textContent = "Saved.";
  try{ updateCloudButton(); }catch(_e){}

  // If the user clicked something that required Cloud, complete that action now.
  const queued = __AFTER_CLOUD;
  __AFTER_CLOUD = null;
  closeCloudModal();
  if(typeof queued === "function"){
    try{ queued(u); }catch(_e){}
    return;
  }
  await refreshHomeList();
});

document.getElementById("cloudTestBtn").addEventListener("click", async ()=>{
  const u = normalizeEndpoint(cloudInput.value);
  if(!u){ cloudModalStatus.textContent = "Please paste a URL."; return; }
  cloudModalStatus.textContent = "Testing…";
  try{
    const payload = await fetchJsonWithTimeout(u + "?action=list&_=" + Date.now(), 12000);
    const files = parseListPayload(payload);
    cloudModalStatus.textContent = "OK — found " + files.length + " file(s).";
  }catch(err){
    console.error(err);
    cloudModalStatus.textContent = "Failed — check URL / deployment permissions.";
  }
});

// New script
document.getElementById("homeNewBtn").addEventListener("click", ()=>{
  ensureCloudThen((ep)=>{
    const p = new URLSearchParams();
    const pid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("p" + Date.now() + "_" + Math.random().toString(16).slice(2));
    p.set("pid", pid);
    if(ep) p.set("cloud", ep);
    window.location.href = "editor.html?" + p.toString();
  });
});

searchEl.addEventListener("input", renderHome);

window.addEventListener("load", ()=>{
  try{ updateCloudButton(); }catch(_e){}
  refreshHomeList();

  // If the editor redirected here because Cloud wasn't set, we may have a pending file to open.
  try{
    const params = new URLSearchParams(window.location.search || "");
    const pendingFileId = (params.get("pendingFileId")||"").trim();
    const pendingName   = (params.get("pendingName")||"").trim();
    const pendingPid    = (params.get("pendingPid")||"").trim();
    const token = pendingFileId || pendingPid || pendingName;

    if(token){
      const onceKey = "SCRIPTY_PENDING_OPEN_ONCE:" + token;
      let already = false;
      try{ already = (typeof sessionStorage!=="undefined") && !!sessionStorage.getItem(onceKey); }catch(_e){}

      if(!already){
        const doOpen = (ep)=>{
          // Mark once + clear pending params so refresh won't re-trigger.
          try{ if(typeof sessionStorage!=="undefined") sessionStorage.setItem(onceKey, "1"); }catch(_e){}
          try{
            const clean = new URL(window.location.href);
            clean.searchParams.delete("pendingFileId");
            clean.searchParams.delete("pendingName");
            clean.searchParams.delete("pendingPid");
            history.replaceState(null, "", clean.toString());
          }catch(_e){}

          const qs = new URLSearchParams();
          if(pendingFileId) qs.set("fileId", pendingFileId);
          if(pendingName) qs.set("name", pendingName);
          if(pendingPid) qs.set("pid", pendingPid);
          if(ep) qs.set("cloud", ep);
          window.location.href = "editor.html?" + qs.toString();
        };

        const epNow = normalizeEndpoint(getCloudEndpoint());
        if(epNow){
          doOpen(epNow);
        }else{
          __AFTER_CLOUD = (ep)=>doOpen(ep);
          openCloudModal();
          try{ cloudModalStatus && (cloudModalStatus.textContent = "Paste your Apps Script URL, then Save."); }catch(_e){}
        }
      }
    }
  }catch(_e){}

  const h = String(window.location.hash||"").toLowerCase();
  if(h==="#open") openOpenModal();
  if(h==="#cloud") openCloudModal();
});

// --- Open-from-link modal wiring ---
const openModalShade = document.getElementById("openModalShade");
const openBtn = document.getElementById("homeOpenBtn");
const openCloseBtn = document.getElementById("openCloseBtn");
const openClearBtn = document.getElementById("openClearBtn");
const openGoBtn = document.getElementById("openGoBtn");
const openInput = document.getElementById("openInput");
const openStatus = document.getElementById("openModalStatus");

function setOpenStatus(msg){ if(openStatus) openStatus.textContent = msg || "—"; }

function openOpenModal(){
  setOpenStatus("Paste a Drive link / file ID / editor link.");
  if(openInput) openInput.value = "";
  showModal(openModalShade, true);
  setTimeout(()=>{ try{ openInput && openInput.focus(); }catch(_e){} }, 0);
}
function closeOpenModal(){ showModal(openModalShade, false); }

openBtn && openBtn.addEventListener("click", openOpenModal);
openCloseBtn && openCloseBtn.addEventListener("click", closeOpenModal);
openModalShade && openModalShade.addEventListener("click", (e)=>{ if(e.target===openModalShade) closeOpenModal(); });
openClearBtn && openClearBtn.addEventListener("click", ()=>{ if(openInput) openInput.value=""; setOpenStatus("—"); openInput && openInput.focus(); });

function goOpen(){
  const val = openInput ? openInput.value : "";
  const parsed = parseDriveFileId(val);
  if(!parsed){
    setOpenStatus("Couldn't recognize a file ID in that link.");
    return;
  }
  ensureCloudThen((ep)=>{
    // If parsed returns an object with pid, route by pid
    if(typeof parsed === "object" && parsed.pid){
      const p = new URLSearchParams();
      p.set("pid", parsed.pid);
      if(ep) p.set("cloud", ep);
      window.location.href = "editor.html?" + p.toString();
      return;
    }
    // Otherwise treat as Drive fileId
    const p = new URLSearchParams();
    p.set("fileId", parsed);
    if(ep) p.set("cloud", ep);
    window.location.href = "editor.html?" + p.toString();
  });
}

openGoBtn && openGoBtn.addEventListener("click", goOpen);
openInput && openInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); goOpen(); } });

// Allow deep-link: index.html#open opens the modal
if(String(location.hash||"").toLowerCase()==="#open"){ openOpenModal(); }
