<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Script Cloud Editor</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#0b0b0f;color:#eaeaf2}
  header{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #232336;background:#0f0f16;position:sticky;top:0;z-index:5}
  header .brand{font-weight:700;letter-spacing:.4px}
  header button{background:#1a1a28;border:1px solid #2a2a3f;color:#eaeaf2;padding:8px 10px;border-radius:10px;cursor:pointer}
  header button:hover{border-color:#3a3a5a}
  header .spacer{flex:1}
  header .status{font-size:12px;opacity:.85}
  .wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 54px)}
  aside{border-right:1px solid #232336;background:#0e0e14;padding:12px;overflow:auto}
  .panelTitle{font-size:12px;opacity:.8;margin:6px 0 10px}
  .item{padding:10px;border:1px solid #232336;border-radius:12px;margin-bottom:10px;background:#11111a;cursor:pointer}
  .item:hover{border-color:#3a3a5a}
  .item .name{font-weight:650}
  .item .meta{font-size:12px;opacity:.7;margin-top:4px}
  main{padding:12px;overflow:auto}
  .titleRow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  input[type="text"]{width:100%;max-width:520px;background:#0f0f16;border:1px solid #2a2a3f;color:#eaeaf2;padding:10px 12px;border-radius:12px;font-size:14px}
  .editor{width:100%;min-height:calc(100vh - 150px);background:#0f0f16;border:1px solid #2a2a3f;border-radius:16px;padding:14px;line-height:1.55;font-size:14px;white-space:pre-wrap;outline:none}
  .hint{font-size:12px;opacity:.75;margin-top:8px}
  .danger{color:#ffb4b4}
  .muted{opacity:.75}
</style>
</head>
<body>
<header>
  <div class="brand">SCRIPT CLOUD</div>
  <button id="btnNew">New</button>
  <button id="btnSave">Save</button>
  <button id="btnRefresh">Refresh list</button>
  <div class="spacer"></div>
  <div class="status" id="status">Not connected</div>
</header>

<div class="wrap">
  <aside>
    <div class="panelTitle">Library (Google Drive)</div>
    <div id="list"></div>
    <div class="hint muted">If you changed your Web App URL, click <b>Reset Cloud URL</b>.</div>
    <button style="margin-top:10px;width:100%" id="btnReset">Reset Cloud URL</button>
  </aside>

  <main>
    <div class="titleRow">
      <input id="projectName" type="text" placeholder="Project name" />
    </div>
    <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>
    <div class="hint">
      Autosave: <span id="autosaveState">off</span> · Current file: <span id="currentId" class="muted">none</span>
    </div>
  </main>
</div>

<!-- Hidden iframe + form to talk to Apps Script without CORS issues -->
<iframe name="gas_iframe" id="gas_iframe" style="display:none"></iframe>
<form id="gas_form" target="gas_iframe" method="POST" style="display:none">
  <input type="hidden" name="payload" id="gas_payload" value="" />
</form>

<script>
(() => {
  const LS_ENDPOINT = "SCRIPT_CLOUD_ENDPOINT_v3";
  const LS_CURRENT  = "SCRIPT_CLOUD_CURRENT_v3";

  const elStatus = document.getElementById("status");
  const elList = document.getElementById("list");
  const elName = document.getElementById("projectName");
  const elEditor = document.getElementById("editor");
  const elAutosave = document.getElementById("autosaveState");
  const elCurrentId = document.getElementById("currentId");

  const btnNew = document.getElementById("btnNew");
  const btnSave = document.getElementById("btnSave");
  const btnRefresh = document.getElementById("btnRefresh");
  const btnReset = document.getElementById("btnReset");

  const form = document.getElementById("gas_form");
  const payloadField = document.getElementById("gas_payload");

  let endpoint = localStorage.getItem(LS_ENDPOINT) || "";
  let current = (() => {
    try { return JSON.parse(localStorage.getItem(LS_CURRENT) || "null"); } catch(e){ return null; }
  })();
  let autosaveTimer = null;
  let dirty = false;

  function setStatus(msg, isError=false){
    elStatus.textContent = msg;
    elStatus.className = "status" + (isError ? " danger" : "");
  }

  function ensureEndpoint(){
    if (endpoint) return true;
    const u = prompt("Paste your Google Web App URL (ends with /exec):");
    if (!u) return false;
    endpoint = u.trim().replace(/\?+$/,"");
    localStorage.setItem(LS_ENDPOINT, endpoint);
    return true;
  }

  function nowFmt(ts){
    try {
      const d = new Date(ts);
      return d.toLocaleString();
    } catch(e){ return ""; }
  }

  function setCurrent(obj){
    current = obj;
    localStorage.setItem(LS_CURRENT, JSON.stringify(current || null));
    elCurrentId.textContent = current && current.id ? current.id : "none";
  }

  function collectDoc(){
    return {
      name: (elName.value || "Untitled").trim() || "Untitled",
      content: elEditor.innerText
    };
  }

  // ---- Apps Script bridge (no fetch, no CORS) ----
  function gasGet(action, params={}){
    if (!ensureEndpoint()) return;
    const q = new URLSearchParams({ action, ...params, _t: Date.now().toString() }).toString();
    document.getElementById("gas_iframe").src = endpoint + "?" + q;
  }

  function gasPost(obj){
    if (!ensureEndpoint()) return;
    form.action = endpoint;
    payloadField.value = JSON.stringify(obj);
    form.submit();
  }

  // Receive messages from Apps Script HtmlOutput
  window.addEventListener("message", (ev) => {
    const data = ev.data;
    if (!data || typeof data !== "object") return;

    if (data.type === "ping") {
      setStatus("Connected");
      return;
    }

    if (data.type === "list") {
      renderList(data.items || []);
      setStatus("Library updated");
      return;
    }

    if (data.type === "load") {
      if (data.error) { setStatus(data.error, true); return; }
      const doc = data.doc || {};
      elName.value = doc.name || "";
      elEditor.innerText = doc.content || "";
      setCurrent({ id: data.id, name: doc.name || "Untitled" });
      dirty = false;
      setStatus("Loaded");
      return;
    }

    if (data.type === "save") {
      if (data.error) { setStatus(data.error, true); return; }
      setCurrent({ id: data.id, name: data.name || (elName.value || "Untitled") });
      dirty = false;
      setStatus("Saved to Google Drive");
      // refresh list after save
      gasGet("list");
      return;
    }
  });

  function renderList(items){
    elList.innerHTML = "";
    if (!items.length){
      elList.innerHTML = '<div class="hint muted">No files yet. Click <b>New</b>, type, then <b>Save</b>.</div>';
      return;
    }
    for (const it of items){
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = '<div class="name"></div><div class="meta"></div>';
      div.querySelector(".name").textContent = it.name || "Untitled";
      div.querySelector(".meta").textContent = it.updated ? ("Updated: " + nowFmt(it.updated)) : "";
      div.addEventListener("click", () => gasGet("load", { id: it.id }));
      elList.appendChild(div);
    }
  }

  function doNew(){
    elName.value = "Untitled";
    elEditor.innerText = "";
    setCurrent(null);
    dirty = false;
    setStatus("New project");
  }

  function doSave(){
    if (!ensureEndpoint()) return;
    const doc = collectDoc();
    const payload = {
      action: "save",
      id: current && current.id ? current.id : "",
      name: doc.name,
      doc
    };
    gasPost(payload);
    setStatus("Saving...");
  }

  function setupAutosave(){
    clearInterval(autosaveTimer);
    autosaveTimer = setInterval(() => {
      if (!endpoint) return;
      if (!dirty) return;
      doSave();
    }, 15000);
    elAutosave.textContent = "on (15s)";
  }

  btnNew.addEventListener("click", doNew);
  btnSave.addEventListener("click", doSave);
  btnRefresh.addEventListener("click", () => gasGet("list"));
  btnReset.addEventListener("click", () => {
    localStorage.removeItem(LS_ENDPOINT);
    endpoint = "";
    setStatus("Cloud URL reset");
    // next save/list will ask again
  });

  elEditor.addEventListener("input", () => { dirty = true; });
  elName.addEventListener("input", () => { dirty = true; });

  // boot
  setupAutosave();
  if (endpoint){
    setStatus("Connecting...");
    gasGet("ping");
    gasGet("list");
  } else {
    setStatus("Not connected");
  }

  // restore last open if possible (optional)
  if (current && current.id){
    elCurrentId.textContent = current.id;
  }
})();
</script>
</body>
</html>
