<html lang="en-AU">
<head>
<meta charset="utf-8" />

<title>AU Screenplay Editor (Final Draft‑style)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Web fonts (kept minimal + writer-friendly). If a font fails to load, system fallbacks apply. -->
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>

#bootLoader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,15,15,0.55);z-index:999999;}
#bootLoader[data-on="1"]{display:flex;}
#bootLoader .bootBox{min-width:220px;max-width:360px;padding:18px 20px;border-radius:14px;background:rgba(25,25,25,0.92);box-shadow:0 10px 40px rgba(0,0,0,0.45);color:#fff;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;letter-spacing:0.2px;}
#bootLoader .bootRow{display:flex;gap:12px;align-items:center;}
#bootLoader .bootSpinner{width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,0.25);border-top-color:rgba(255,255,255,0.95);animation:bootSpin 0.9s linear infinite;flex:0 0 auto;}
#bootLoader .bootText{opacity:0.95;}
@keyframes bootSpin{to{transform:rotate(360deg);}}

  :root{
    /* Physical page */
    --a4w-mm: 215.9;
    --a4h-mm: 279.4;

/* Loading fade-in */
.wrap { 
  opacity: 0; 
  visibility: hidden;
  transition: opacity 0.2s, visibility 0s 0.2s; 
}
.wrap.ready { 
  opacity: 1; 
  visibility: visible;
  transition: opacity 0.2s, visibility 0s 0s;
}

    /* Margins (page-edge based) */
    --m-top-mm: 25.4;   /* 2.55cm (measured) */
    --m-bot-mm: 25.4;   /* ~2.45cm (measured) */
    --m-right-mm: 25.4;   /* 2.5cm */
    --m-left-mm: 38.1;    /* 3.9cm */

    /* Title page margins (Final Draft style: centered on full page, not script text column) */
    --tp-left-mm: 25.4;   /* match right so title text is truly centered on page */
    --tp-right-mm: 25.4;

    /* Wrap calibration (mm): tweak to match Final Draft line breaks across browser fonts */
    --wrap-cal-mm: 0;  /* wrap calibration (mm): adjust only if needed */

    /* Header band reserved for page number (non-editable) */
    --header-band-mm: 12;

    /* Baseline step (physical units) */
    --baseline-mm: 4.233; /* ~12pt in mm (12pt = 4.233mm) */
    --baseline-cal: 1.000; /* hidden calibration knob */
    --baseline-step-mm: calc(var(--baseline-mm) * var(--baseline-cal));

    /* Font */
    --font-size-pt: 12;
    --font-stack: "Courier Final Draft","Courier Prime","Courier New",monospace;

    /* Geometry (mm) – filled by JS */
    --x-action-L-mm: 39;
    --x-action-R-mm: 25;
    --x-character-L-mm: 0;
    --x-character-R-mm: 25;
    --x-dialogue-L-mm: 0;
    --x-dialogue-R-mm: 0;
    --x-paren-L-mm: 0;
    --x-paren-R-mm: 0;
    --x-trans-R-mm: 25;

    /* UI */
    --ui-bg: #101114;
    --ui-panel: #171922;
    --ui-border: #2a2f3a;
    --ui-text: #e9ecf2;
    --ui-muted: #aeb6c6;
    --ui-accent: #5b8cff;
  }

  /* Native browser spell/grammar underlines (where supported) */
  ::spelling-error{
    text-decoration: underline wavy rgba(255,77,77,0.75);
    text-decoration-skip-ink: none;
    text-decoration-thickness: 1.2px;
    text-underline-offset: 0.22em;
  }
  ::grammar-error{
    text-decoration: underline wavy rgba(77,125,255,0.75);
    text-decoration-skip-ink: none;
    text-decoration-thickness: 1.2px;
    text-underline-offset: 0.22em;
  }


  
  /* Prevent distracting spell/grammar underline flicker while you type:
     Keep native spellcheck ON, but hide its underlines ONLY on the active line. */
  #scriptEditor.spell-suppress-all::spelling-error,
  #scriptEditor.spell-suppress-all::grammar-error,
  #scriptEditor.spell-suppress-all::-moz-spelling-error,
  #scriptEditor.spell-suppress-all::-moz-grammar-error,
  #scriptEditor.spell-suppress-all::-webkit-spelling-error,
  #scriptEditor.spell-suppress-all::-webkit-grammar-error,
  #scriptEditor.spell-suppress-all .line::spelling-error,
  #scriptEditor.spell-suppress-all .line::grammar-error,
  #scriptEditor.spell-suppress-all .line::-moz-spelling-error,
  #scriptEditor.spell-suppress-all .line::-moz-grammar-error,
  #scriptEditor.spell-suppress-all .line::-webkit-spelling-error,
  #scriptEditor.spell-suppress-all .line::-webkit-grammar-error,
  .spell-suppress::spelling-error,
  .spell-suppress::grammar-error,
  .spell-suppress::-moz-spelling-error,
  .spell-suppress::-moz-grammar-error,
  .spell-suppress::-webkit-spelling-error,
  .spell-suppress::-webkit-grammar-error{
    text-decoration: none !important;
  }
@page { size: Letter; margin: 0; }
  @media print{
    body{ background:#fff; }
    .topbar, .status {
  display: none !important; display:none !important; }
    .workspace{ padding:0 !important; }
    .paperArea{ gap:0 !important; }
    .titlePaper{ box-shadow:none !important; border:none !important; margin:0 !important; }
    .scriptStack{ box-shadow:none !important; border:none !important; margin:0 !important; background:transparent !important; }
    .pageBg{ box-shadow:none !important; border:none !important; }

    /* Force paper to print white even if Dark Mode is enabled */
    .pageBg, .titlePaper{ background:#fff !important; color:#111 !important; }
    .scriptEditor{ color:#111 !important; }
    .pageNumber{ color:#111 !important; }
  }

  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
  }

  .topbar{
    position: sticky; top:0; z-index: 50;
    background: linear-gradient(180deg, rgba(20,22,30,0.98), rgba(16,17,20,0.92));
    border-bottom: 1px solid var(--ui-border);
    backdrop-filter: blur(10px);
    padding: 10px 12px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }

  .group{ display:flex; gap:8px; align-items:center; padding:6px; border:1px solid var(--ui-border); border-radius:12px; background: rgba(255,255,255,0.03); }
  .btn{
    appearance:none; border:1px solid var(--ui-border);
    background: rgba(255,255,255,0.04);
    color: var(--ui-text);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
    cursor:pointer;
    user-select:none;
  }

  .btn:focus-visible, .menuBtn:focus-visible, .item:focus-visible, .tool:focus-visible{
    outline: 2px solid var(--ui-accent);
    outline-offset: 2px;
  }
  .btn:hover{ border-color: rgba(91,140,255,0.55); }
  .btn:active{ transform: translateY(0.5px); }
  .btn.tog.on{ background: rgba(91,140,255,0.18); border-color: rgba(91,140,255,0.7); }

  select{
    background: rgba(255,255,255,0.04);
    color: var(--ui-text);
    border:1px solid var(--ui-border);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
    outline:none;
  }
  /* Improve dropdown readability (font / size menus): native option list often renders on white */
  select option, select optgroup{
    color:#111;
    background:#fff;
  }
  select:focus{ border-color: rgba(91,140,255,0.65); }

  .workspace{
    padding: 14px 14px 60px;
    display:flex;
    justify-content:center;
  }

  .paperArea{
    width: min(100%, 920px);
    display:flex;
    flex-direction:column;
    gap: 16px;
    align-items:center;
  }

/* Page look */
  .pageBg, .titlePaper{
    width: calc(var(--a4w-mm) * 1mm);
    height: calc(var(--a4h-mm) * 1mm);
    background: #fff;
    color:#111;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    border: 1px solid rgba(0,0,0,0.12);
    position: relative;
    overflow:hidden;
  }

  /* Optional: dark pages (View > Dark Mode)
     UI stays the same; only the paper + script text invert. */
  :root[data-pages="dark"] .pageBg,
  :root[data-pages="dark"] .titlePaper{
    background: #202124;
    color: #f3f4f6;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 12px 40px rgba(0,0,0,0.60);
  }
  :root[data-pages="dark"] .pageNumber{ color: #f3f4f6; }
  :root[data-pages="dark"] .scriptEditor{ color: #f3f4f6; }

  :root[data-pages="dark"] .titleField[data-empty="1"],
  :root[data-pages="dark"] .contactField[data-empty="1"]{
    caret-color: #f3f4f6;
  }
  :root[data-pages="dark"] .titleField[data-empty="1"]::before,
  :root[data-pages="dark"] .contactField[data-empty="1"]::before{
    color: #f3f4f6;
    opacity: .35;
  }


  .pageHeaderBand{
    position:absolute; left:0; right:0; top:0;
    height: calc(var(--header-band-mm) * 1mm);
    pointer-events:none;
  }
  .pageNumber{
    position:absolute;
    top: calc(12.5 * 1mm); /* Final Draft-style: ~0.5in from top edge */
    right: calc(var(--m-right-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    color:#111;
    user-select:none;
    pointer-events:none;
  }

  /* Title page */
  .titleBody{
    position:absolute; inset:0;
    padding-top: calc(var(--header-band-mm) * 1mm);
    box-sizing:border-box;
  }
  .titleField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    right: calc(var(--tp-right-mm) * 1mm);
    text-align:center;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    min-height: calc(var(--baseline-step-mm) * 1mm);
    outline:none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .titleField[data-name="title"]{
    top: calc(98.1mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm));
    font-weight: 700;
    text-transform: uppercase;
  }
  .titleField[data-name="writtenby"]{ top: calc(115.6mm - (0.55 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  .titleField[data-name="name"]{ top: calc(127.7mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }

  .contactField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    bottom: calc(var(--m-bot-mm) * 1mm);
    width: calc(80 * 1mm);
    min-height: calc(24 * 1mm);
    text-align:left;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    outline:none;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Title page placeholders (Final Draft-style: grey pre-fill that disappears on type)
   We keep a hidden NBSP in empty fields so the caret has a real glyph box to align to.
   Placeholder itself is a ::before overlay driven by data-empty="1". */
  .titleField[data-empty="1"],
  .contactField[data-empty="1"]{
    color: transparent;
    caret-color: #111;
  }

  .titleField[data-empty="1"]::before,
  .contactField[data-empty="1"]::before{
    content: attr(data-placeholder);
    opacity: .35;
    pointer-events: none;
    position: absolute;
    left: 0; right: 0; top: 0;
    color: #111;
    white-space: pre-wrap;
  }
  .contactField[data-empty="1"]::before{
    right: auto;
  }

/* Script stack (visual pages behind one continuous editor) */
  .scriptStack{
    width: calc(var(--a4w-mm) * 1mm);
    position: relative;
  }
  .pagesLayer{
    position:absolute; left:0; right:0; top:0;
    pointer-events:none;
  }
  .pagesLayer .pageBg{
    margin-bottom: 16px;
  }
  .editorLayer{
    position:relative;
    z-index:5;
    /* align with pageBg stacking margins */
    pointer-events:auto;
  }

  /* One editable DOM that spans all pages (plus spacers) */
  .scriptEditor{
    width: calc(var(--a4w-mm) * 1mm);
    position: relative;
    outline:none;
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
    background: transparent;
    box-sizing:border-box;
    /* keep it inside page paper */
    padding-left: calc(var(--m-left-mm) * 1mm);
    padding-right: calc(var(--m-right-mm) * 1mm);
    /* no top/bottom padding: we insert explicit spacers per-page */
    padding-top: 0;
    padding-bottom: 0;
  }

  /* Page spacers live inside editor, but are non-editable */
  .pageSpacer{
    height: 0;
  }
  .pageSpacer[data-kind="top"]{
    height: calc(var(--m-top-mm) * 1mm);
  }
  .pageSpacer[data-kind="between"]{
    height: calc((var(--m-bot-mm) + var(--m-top-mm)) * 1mm);
  }
  .pageSpacer{
    pointer-events:none;
    user-select:none;
  }

  .line{
    min-height: calc(var(--baseline-step-mm) * 1mm);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    box-sizing: border-box;
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
    margin-right: 0;
  }

    /* Scene numbers (Format > Pages > Scene Numbers)
     Shooting script convention: show scene numbers on BOTH sides.
     Keep them comfortably in the margins (not crowding the slugline). */
  :root{
    /* Fixed box width for numbers (handles 1–3 digits cleanly) */
    --scene-num-box-w: 0.7in;

    /* Where the number box sits from the page edge */
    --scene-num-left-edge: 0.25in;   /* box's LEFT edge from page LEFT edge */
    --scene-num-right-edge: 0.25in;  /* box's RIGHT edge from page RIGHT edge */
  }

  :root[data-scenenums="1"] .line[data-type="scene"]::before,
  :root[data-scenenums="1"] .line[data-type="scene"]::after{
    content: attr(data-scene-num);
    position: absolute;
    top: 0;
    width: var(--scene-num-box-w);
    font-weight: 400;
    line-height: inherit;
    color: inherit;
    pointer-events: none;
    user-select: none;
    text-decoration: none;
  }

  /* LEFT scene number: right-aligned in a fixed margin box */
  :root[data-scenenums="1"] .line[data-type="scene"]::before{
    left: calc((-1) * (calc(var(--m-left-mm) * 1mm) - var(--scene-num-left-edge)));
    text-align: right;
  }

  /* RIGHT scene number: left-aligned in a fixed margin box */
  :root[data-scenenums="1"] .line[data-type="scene"]::after{
    left: calc(100% + (calc(var(--m-right-mm) * 1mm) - var(--scene-num-right-edge) - var(--scene-num-box-w)));
    text-align: left;
  }


  .line[data-type="scene"], .line[data-type="action"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
  }
  .line[data-type="character"]{
    width: calc((var(--a4w-mm) - var(--x-character-L-mm) - var(--x-character-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-character-L-mm) - var(--m-left-mm)) * 1mm);
  }
  .line[data-type="dialogue"]{
    width: calc((var(--a4w-mm) - var(--x-dialogue-L-mm) - var(--x-dialogue-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-dialogue-L-mm) - var(--m-left-mm)) * 1mm);
  }
  .line[data-type="parenthetical"]{
    width: calc((var(--a4w-mm) - var(--x-paren-L-mm) - var(--x-paren-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: calc((var(--x-paren-L-mm) - var(--m-left-mm)) * 1mm);
  }
  .line[data-type="transition"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
    text-align:right;
  }

  /* Dual Dialogue (side-by-side, Final Draft-style) */
  :root{
    --dual-gap-mm: 8;   /* gutter between columns */
    --dual-pad-mm: 4;   /* inner padding per column */
  }
  .line[data-type="dual"]{
    width: calc((var(--a4w-mm) - var(--x-action-L-mm) - var(--x-action-R-mm) + var(--wrap-cal-mm)) * 1mm);
    margin-left: 0;
  }
  .line[data-type="dual"] .dualGrid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: calc(var(--dual-gap-mm) * 1mm);
    width: 100%;
  }
  .line[data-type="dual"] .dualCol{
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .line[data-type="dual"] .dualField{
    min-height: calc(var(--baseline-step-mm) * 1mm);
    white-space: pre-wrap;
    word-break: break-word;
    outline: none;
    margin: 0;
  }
  .line[data-type="dual"] .dualChar{
    text-align: center;
    text-transform: uppercase;
    padding: 0 calc(var(--dual-pad-mm) * 1mm);
  }
  .line[data-type="dual"] .dualDlg{
    padding: 0 calc(var(--dual-pad-mm) * 1mm);
  }

  /* Final Draft-style: scene / character / transition are uppercase by default */
  .line[data-type="scene"],
  .line[data-type="character"],
  .line[data-type="transition"]{ text-transform: uppercase; }

  /* Auto scene separation: add one extra blank-line worth of space ABOVE every Scene Heading
     when it is not the first line on a page. This creates the common “double gap” between scenes. */
  .line + .line[data-type="scene"]{
    margin-top: calc(var(--baseline-step-mm) * 1mm);
  }

/* Optional: Bold Scene Headings (Format > Pages > Bold Scene Headings) */
:root[data-boldsceneheads="1"] .line[data-type="scene"]{
  font-weight: 700;
  letter-spacing: .2px;
}

/* Optional: Underline Scene Headings (Format > Pages > Underline Scene Headings) */
:root[data-underlinesceneheads="1"] .line[data-type="scene"]{
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: from-font;
}


  ::selection { background: rgba(91,140,255,0.25); }

  /* CAPS formatting is visual to preserve original casing for toggle */
  span[data-caps="1"]{ text-transform: uppercase; }
  /* Allow CAPS to affect ALL line types (previously dialogue/parenthetical were exempt). */

  .status{
    display:block;
    position: fixed; left: 14px; bottom: 12px;
    background: rgba(23,25,34,0.92);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--ui-muted);
    max-width: 70vw;
    z-index: 60;
  }
  .status b{ color: var(--ui-text); }

  .fontBadge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-left:10px;
    padding:6px 10px;
    border:1px solid var(--ui-border);
    border-radius: 999px;
    background: rgba(255,255,255,0.03);
    color: var(--ui-text);
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }
  .fontBadge .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--ui-accent);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
  }


  .hidden{ display:none !important; }


/* === Project B UI Skin (scoped, but used as primary chrome) === */

@font-face{
  font-family:"CourierFinalDraft";
  src: local("Courier Final Draft"), local("CourierFinalDraft"), local("Courier FinalDraft"), local("CourierFD");
  font-weight: 400;
  font-style: normal;
}

:root{
  --topBarH: 58px;

  /* Solid app background (avoid banding / double-tone when scrolling) */
  --uiBg:#141414;
  --uiBg2:#141414;
  --uiPanel:#1b1b1b;
  --uiText:#f2f2f2;
  --uiMuted:#b9b9b9;
  --uiBorder:#2b2b2b;
  --uiShadow: 0 18px 55px rgba(0,0,0,0.55);

  --paper:#ffffff;
  --paperText:#111111;
  --paperMuted:#5a5a5a;

  /* Script font stack */
  --scriptFont:'CourierFinalDraft','Courier Prime','Courier New',Courier,monospace;
  --fontSize: 12pt;
  --leading: 1;
  --paraLine: calc(1em * var(--leading));

  /* US Letter (8.5" × 11") */
  --paperW: 215.9mm;
  --paperH: 279.4mm;

  /* Page-edge margins */
  --mTop: 25.4mm;
  --mBottom: 25.4mm;
  --mLeft: 38.1mm;
  --mRight: 25.4mm;

  /* Visual gap between sheets in UI */
  --pageGap: 18px;

  /* Element indents measured from page edge */
  --indentBodyL: var(--mLeft);
  --indentBodyR: var(--mRight);

  --indentDialogueL: 34mm;
  --indentDialogueR: 34mm;

  --indentCharacterL: 54mm;
  --indentParenL: 44mm;
}

*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background: var(--uiBg);
  color:var(--uiText);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  padding-top: var(--topBarH);
}

/* Top bar */
.top{
  height: var(--topBarH);
  position:fixed; top:0; left:0; right:0; z-index:999;
  background: rgba(20,20,20,0.90);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--uiBorder);
}
.topInner{
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;

/* Focus mode: hide side panels and keep pages centered */

/* Right panel (Set type only) */

/* Stage */
.stage{display:flex; justify-content:center; width:100%;}

}

/* Flow layer (editable script surface) */
.flowLayer{
  position: relative;
  z-index: 2;
  margin-top: calc(var(--paperH) + var(--pageGap));
  padding-top: var(--mTop);
  padding-bottom: var(--mBottom);
  width: var(--paperW);
}
#flow{

}
.l{

  padding: 0;
  border: 0;
  background: transparent;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  outline: none;
  cursor: text;
  box-sizing:border-box;
  width:100%;
}

/* Formatting (Final Draft-ish) */
.scene{ font-weight:700; letter-spacing:.2px; text-transform:uppercase; }
.scene{ margin-top: var(--paraLine); margin-bottom: var(--paraLine); }
.action{ margin-bottom: var(--paraLine); }
.character{ margin-top: var(--paraLine); padding-left: var(--indentCharacterL); padding-right: var(--indentBodyR); font-weight:700; text-transform:uppercase; }
.dialogue{ margin-bottom: var(--paraLine); padding-left: var(--indentDialogueL); padding-right: var(--indentDialogueR); }
.paren{ padding-left: var(--indentParenL); padding-right: var(--indentDialogueR); color: var(--paperMuted); }
.transition{ margin-top: var(--paraLine); margin-bottom: var(--paraLine); padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); text-align:right; font-weight:700; letter-spacing:.2px; text-transform:uppercase; }
.shot{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); font-weight:700; letter-spacing:.15px; text-transform:uppercase; }
.note{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); font-style: italic; color: var(--paperMuted); }
.scene,.action,.shot,.note{ padding-left: var(--indentBodyL); padding-right: var(--indentBodyR); }

/* Page spacer to enforce breaks (non-editable) */
.pageSpacer{
  height: calc(var(--mBottom) + var(--pageGap) + var(--mTop) + 2px);
  pointer-events:none;
  user-select:none;
}
.pageSpacer{ contenteditable:false; }

@media (max-width: 1120px){

/* --- Print-safe export (fix cut-off / mismatch) --- */
#printRoot{ display:none; }
@media print{
  html, body{ margin:0 !important; padding:0 !important; }
  body.printing .wrap{ display:none !important; }
  body.printing #printRoot{ display:block !important; margin:0 !important; padding:0 !important; }

  /* Ensure the browser uses true US Letter with no forced margins (where supported). */
  @page{size:Letter; margin:0;}

  body.printing #printRoot .printPaper{
    /* PDF exporters can introduce fractional rounding that creates a phantom blank sheet.
       Use a slightly-shorter fixed height and clip overflow to prevent any spill. */
    box-sizing: border-box;
    width: calc(var(--a4w-mm) * 1mm);
    height: calc(var(--a4h-mm) * 1mm - 0.4mm);
    background:#fff !important;
    color:#111 !important;
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    padding:0 !important;
    position:relative;
    overflow:hidden;
    break-after: page;
  }
  body.printing #printRoot .printPaper:last-child{
    break-after: auto;
  }

  body.printing #printRoot .printPageNumber{
    position:absolute;
    top: calc(12.5 * 1mm);
    right: calc(var(--m-right-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    color:#111;
  }

  body.printing #printRoot .printContent{
    position:absolute; inset:0;
    box-sizing:border-box;
    padding-left: calc(var(--m-left-mm) * 1mm);
    padding-right: calc(var(--m-right-mm) * 1mm);
    padding-top: calc(var(--m-top-mm) * 1mm);
    padding-bottom: calc(var(--m-bot-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
  }

  body.printing #printRoot .printTitleContent{
    position:absolute; inset:0;
    box-sizing:border-box;
    padding-top: calc(var(--header-band-mm) * 1mm);
    font-family: var(--font-stack);
    font-size: calc(var(--font-size-pt) * 1pt);
    line-height: calc(var(--baseline-step-mm) * 1mm);
    color:#111;
  }
  body.printing #printRoot .printTitleField{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    right: calc(var(--tp-right-mm) * 1mm);
    text-align:center;
    white-space: pre-wrap;
    word-break: break-word;
  }
  body.printing #printRoot .printTitleField.title{
    top: calc(98.1mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm));
    font-weight:700;
    text-transform:uppercase;
  }
  body.printing #printRoot .printTitleField.writtenby{ top: calc(115.6mm - (0.55 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  body.printing #printRoot .printTitleField.name{ top: calc(127.7mm - (0.35 * var(--baseline-step-mm) * 1mm) + (0.25 * var(--baseline-step-mm) * 1mm)); }
  body.printing #printRoot .printContact{
    position:absolute;
    left: calc(var(--tp-left-mm) * 1mm);
    bottom: calc(var(--m-bot-mm) * 1mm);
    width: calc(80 * 1mm);
    text-align:left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Keep existing screenplay line formatting (do NOT override widths/indents) */
  body.printing #printRoot .line{ min-height: calc(var(--baseline-step-mm) * 1mm); }

<script>
/* Safe localStorage wrapper: Firefox file:// pages can throw SecurityError (opaque origins). */
const __LS = (()=>{ try{
  const ls = window.localStorage;
  const k = "__scripty_ls_test__";
  ls.setItem(k,"1"); ls.removeItem(k);
  return ls;
}catch(_e){ return null; }})();
const lsGetRaw = (key)=>{ try{ return __LS ? __LS.getItem(String(key)) : null; }catch(_e){ return null; } };
const lsSet    = (key, val)=>{ try{ __LS && __LS.setItem(String(key), String(val)); }catch(_e){} };
const lsRemove = (key)=>{ try{ __LS && __LS.removeItem(String(key)); }catch(_e){} };

/* UI-only glue: menus + wiring to Project A controls. No engine logic. */
(() => {
  function closeSubmenus(scope=document){
    scope.querySelectorAll(".submenuWrap.subOpen").forEach(w=>{
      w.classList.remove("subOpen");
      const b=w.querySelector(".submenuBtn");
      if(b) b.setAttribute("aria-expanded","false");
    });
  }
  function closeMenus(){
    closeSubmenus();
    document.querySelectorAll(".dropdown").forEach(d=>d.classList.remove("open"));
    document.querySelectorAll(".menuBtn").forEach(b=>b.setAttribute("aria-expanded","false"));
  }
  document.addEventListener("click",(e)=>{
    // Close only when clicking outside the top menus / dropdowns.
    if(e.target.closest(".menu") || e.target.closest(".dropdown") || e.target.closest(".submenu")) return;
    closeMenus();
  });
  document.querySelectorAll(".menuBtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const name = btn.dataset.menu;
      const dd = name ? document.getElementById("menu-"+name) : null;
      if(!dd) return;
      const open = dd.classList.contains("open");
      closeMenus();
      if(!open){ dd.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
    });
  });


  // Submenus: keep only one submenu open at a time, and close on selection.
  function setSubmenuOpen(wrap, open){
    const btn = wrap && wrap.querySelector(".submenuBtn");
    if(open){
      wrap.classList.add("subOpen");
      btn && btn.setAttribute("aria-expanded","true");
    }else{
      wrap.classList.remove("subOpen");
      btn && btn.setAttribute("aria-expanded","false");
    }
  }

  document.querySelectorAll(".submenuBtn").forEach(btn=>{
    const wrap = btn.closest(".submenuWrap");
    if(!wrap) return;

    const openThis = () => {
      const dd = wrap.closest(".dropdown");
      if(dd){
        dd.querySelectorAll(".submenuWrap.subOpen").forEach(w=>{
          if(w !== wrap) setSubmenuOpen(w, false);
        });
      }
      setSubmenuOpen(wrap, true);
    };

    // Click-to-open (desktop app feel)
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

function _getSelRangeInEditor(editor){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return null;
  const r = sel.getRangeAt(0);
  if(!editor.contains(r.commonAncestorContainer)) return null;

function _collectSelectedLines(editor, range){
  const lines = Array.from(editor.querySelectorAll(".line"));
  const hit = [];
  for(const ln of lines){
    try{
      if(range.intersectsNode(ln)) hit.push(ln);
    }catch(e){
      if(!range.collapsed) hit.push(ln);
    }
  }
  if(hit.length===0){
    const sel = window.getSelection();
    const node = sel && sel.anchorNode ? sel.anchorNode : null;
    const caretLine = node ? (node.nodeType===1 ? node.closest?.(".line") : node.parentElement?.closest?.(".line")) : null;
    if(caretLine && editor.contains(caretLine)) return [caretLine];
  }
  return hit;
}

function _walkTextNodes(root, cb){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  while((n = tw.nextNode())) cb(n);
}

function _uppercaseLineInPlace(line){

function _measureTextPx(sampleEl, s){
  const cs = window.getComputedStyle(sampleEl);
  const font = cs.font || `${cs.fontStyle} ${cs.fontVariant} ${cs.fontWeight} ${cs.fontSize}/${cs.lineHeight} ${cs.fontFamily}`;
  _measureTextPx._c = _measureTextPx._c || document.createElement("canvas");
  const ctx = _measureTextPx._c.getContext("2d");
  ctx.font = font;
  return ctx.measureText(s).width;
}

}

function _applyTypeToLines(type){
  const editor = document.getElementById("scriptEditor");
  if(!editor) return false;

  const r = _getSelRangeInEditor(editor);
  if(!r) return false;

  const lines = _collectSelectedLines(editor, r);
  if(!lines || lines.length===0) return false;

  for(const ln of lines){
    if(type==="dual"){ convertLineToDual(ln); continue; }
    ln.dataset.type = type;

    if(type==="scene" || type==="character" || type==="transition"){
      _uppercaseLineInPlace(ln);
    }

    if(type==="parenthetical"){
      const raw = (ln.innerText || ln.textContent || "").trim();
      // If blank, prefill () to match Final Draft ergonomics.
      // (We place the caret between the parens separately, after type application.)
      if(!raw){
        ln.innerText = "()";
        // Record the exact line we auto-filled so we can restore caret even if toolbar focus
        // steals the native selection (common on button clicks).
        try{ window.__lastAutoParensLineId = ln?.dataset?.id || null; }catch(_e){ window.__lastAutoParensLineId = null; }
        // Force caret inside for upcoming paginate()/selection-restore.
        try{ hintForceCaretInsideParens(ln); }catch(_e){}
        try{ placeCaretInsideParens(ln); }catch(_e){}
      } else {
        let s = raw;
        if(!s.startsWith("(")) s = "(" + s;
        if(!s.endsWith(")")) s = s + ")";
        ln.innerText = s;
      }
    } else {
      if(ln.style && ln.style.marginLeft) ln.style.marginLeft = "";
    }
  }

  _scheduleParentheticalAlign();
  return true;
}

function _scrollToLineExact(lineEl){
  if(!lineEl) return;
  const topBar = document.querySelector("header.top");
  const topBarH = topBar ? topBar.getBoundingClientRect().height : 0;

  // Position the line just under the top menubar.
  const y = window.scrollY + lineEl.getBoundingClientRect().top;
  const target = Math.max(0, y - topBarH - 18);

  // Use instant scroll so caret placement doesn't fight an in-progress smooth scroll.
  window.scrollTo({ top: target, behavior: "auto" });

  // Re-apply once next frame in case pagination/layout changes during the click.
  requestAnimationFrame(() => {
    const y2 = window.scrollY + lineEl.getBoundingClientRect().top;
    const target2 = Math.max(0, y2 - topBarH - 18);
    window.scrollTo({ top: target2, behavior: "auto" });
  });
}


// -------- Scene Hover Preview (tooltip) --------
let __scenePreviewTip = null;
let __scenePreviewHideTimer = null;
let __scenePreviewAnchor = null;

function __ensureScenePreviewTip(){
  if(__scenePreviewTip) return __scenePreviewTip;
  const tip = document.createElement("div");
  tip.className = "scenePreviewTip";
  tip.innerHTML = `<div class="hdr"></div><div class="body"></div>`;
  document.body.appendChild(tip);
  __scenePreviewTip = tip;
  return tip;
}

function __getLinePreviewText(lineEl){
  if(!lineEl) return "";
  // Use textContent so CSS uppercase doesn't rewrite the underlying preview meaningfully.
  const raw = (lineEl.textContent || "").replace(/\s+/g, " ").trim();
  return raw;
}

function __buildScenePreview(sceneEl){
  if(!sceneEl) return "";
  const parts = [];
  let chars = 0;

  // Start just after the scene heading.
  let cur = sceneEl.nextElementSibling;

  // Grab a few meaningful lines until next scene heading.
  // Keep it tight and fast to avoid UI lag.
  let linesTaken = 0;
  while(cur && linesTaken < 6){
    if(cur.classList && cur.classList.contains("pageSpacer")) { cur = cur.nextElementSibling; continue; }
    if(cur.classList && cur.classList.contains("pageHeaderBand")) { cur = cur.nextElementSibling; continue; }
    if(cur.classList && cur.classList.contains("pageNumber")) { cur = cur.nextElementSibling; continue; }

    if(cur.classList && cur.classList.contains("line")){
      const t = cur.getAttribute("data-type") || cur.dataset.type || "";
      if(t === "scene") break;

      // For dual dialogue, compress both sides into one line.
      if(t === "dual"){
        const leftChar = __getLinePreviewText(cur.querySelector('.dualField[data-part="L_CHAR"]'));
        const leftDlg  = __getLinePreviewText(cur.querySelector('.dualField[data-part="L_DLG"]'));
        const rightChar= __getLinePreviewText(cur.querySelector('.dualField[data-part="R_CHAR"]'));
        const rightDlg = __getLinePreviewText(cur.querySelector('.dualField[data-part="R_DLG"]'));
        const segs = [];
        if(leftChar || leftDlg) segs.push(`${leftChar}${leftDlg ? ": " + leftDlg : ""}`.trim());
        if(rightChar || rightDlg) segs.push(`${rightChar}${rightDlg ? ": " + rightDlg : ""}`.trim());
        const dual = segs.filter(Boolean).join("  |  ");
        if(dual){
          parts.push(dual);
          chars += dual.length;
          linesTaken++;
        }
      }else{
        const text = __getLinePreviewText(cur);
        if(text){
          parts.push(text);
          chars += text.length;
          linesTaken++;
        }
      }
      if(chars > 220) break;
    }
    cur = cur.nextElementSibling;
  }

  if(!parts.length) return "—";
  let out = parts.join("\n");
  if(out.length > 260) out = out.slice(0, 260).replace(/\s+$/,"") + "…";
  return out;
}

function __positionScenePreviewTip(tip, anchorEl){
  if(!tip || !anchorEl) return;
  const pad = 10;
  const ar = anchorEl.getBoundingClientRect();

  // Prefer to the right of the Scenes panel.
  let left = ar.right + 12;
  let top = ar.top;

  // Measure after content is set (tip is in DOM).
  const tr = tip.getBoundingClientRect();

  // If off right edge, flip to left.
  if(left + tr.width + pad > window.innerWidth){
    left = Math.max(pad, ar.left - tr.width - 12);
  }

  // Clamp vertically.
  if(top + tr.height + pad > window.innerHeight){
    top = Math.max(pad, window.innerHeight - tr.height - pad);
  }
  if(top < pad) top = pad;

  tip.style.left = `${Math.round(left)}px`;
  tip.style.top  = `${Math.round(top)}px`;
}


function __maybeRepositionScenePreview(){
  if(!__scenePreviewTip || !__scenePreviewAnchor) return;
  if(__scenePreviewTip.style.display === "none") return;
  __positionScenePreviewTip(__scenePreviewTip, __scenePreviewAnchor);
}


function __showScenePreview(sceneEl, btnEl, idx){
  __scenePreviewAnchor = btnEl || null;
  const tip = __ensureScenePreviewTip();
  clearTimeout(__scenePreviewHideTimer);

  const hdr = tip.querySelector(".hdr");
  const body = tip.querySelector(".body");
  if(hdr) hdr.textContent = `Scene ${idx + 1} preview`;
  if(body) body.textContent = __buildScenePreview(sceneEl);

  // Position + show
  tip.style.display = "block";
  __positionScenePreviewTip(tip, btnEl);
  requestAnimationFrame(()=> tip.classList.add("show"));
}

function __hideScenePreviewSoon(){
  if(!__scenePreviewTip) return;
  clearTimeout(__scenePreviewHideTimer);
  __scenePreviewHideTimer = setTimeout(()=>{
    if(!__scenePreviewTip) return;
    __scenePreviewTip.classList.remove("show");
    // wait for fade then hide
    setTimeout(()=>{
      if(__scenePreviewTip && !__scenePreviewTip.classList.contains("show")){
        __scenePreviewTip.style.display = "none";
        __scenePreviewAnchor = null;
      }
    }, 140);
  }, 40);
}

function rebuildScenesPanel(){
  const outline = document.getElementById("outline");
  const editor = document.getElementById("scriptEditor");
  if(!outline || !editor) return;

  // Query scene headings only (derived from script, no separate model)
  const scenes = Array.from(editor.querySelectorAll('.line[data-type="scene"]'));

  outline.innerHTML = "";

  if(!scenes.length){
    const empty = document.createElement("div");
    empty.className = "chip";
    empty.style.display = "block";
    empty.textContent = "No scenes";
    outline.appendChild(empty);
    return;
  }

  scenes.forEach((sceneEl, idx) => {
    const raw = (sceneEl.innerText || sceneEl.textContent || "");
    const text = raw.replace(/\s+/g, " ").trim() || "UNTITLED SCENE";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sceneBtn";
    btn.innerHTML = `<div class="n">Scene ${idx + 1}</div><div class="t"></div>`;
    btn.querySelector(".t").textContent = text;

    // Use pointerdown so a single click always triggers the jump, even if the panel
    // re-renders between mousedown and click (which can cancel the click event).
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();

      // Jump EXACTLY to this scene heading on the first click.
      _scrollToLineExact(sceneEl);

      // Keep editing focus in the script so caret placement is reliable.
      const editorRoot = document.getElementById("scriptEditor");
      if(editorRoot) editorRoot.focus({preventScroll:true});

      const lineId = sceneEl.getAttribute("data-id") || sceneEl.dataset.id;
      // Use engine-aware caret helper if available; otherwise place caret at element start.
      if(lineId && typeof window.scriptyPlaceCaretAtLineIndex === "function"){
        window.scriptyPlaceCaretAtLineIndex(lineId, 0);
      }else{
        _fallbackPlaceCaretAtElementStart(sceneEl);
      }
    }, {passive:false});

    // Hover / focus preview (non-interactive tooltip)
    btn.addEventListener("mouseenter", () => { __showScenePreview(sceneEl, btn, idx); });
    btn.addEventListener("mouseleave", __hideScenePreviewSoon);
    btn.addEventListener("focus", () => { __showScenePreview(sceneEl, btn, idx); });
    btn.addEventListener("blur", __hideScenePreviewSoon);

    outline.appendChild(btn);
  });
}

  function scheduleCounterUpdate(){
    // wait for pagination to finish inserting pageSpacer nodes
    requestAnimationFrame(() => requestAnimationFrame(updateTopCounters));
  }

  document.addEventListener("DOMContentLoaded", () => {
    const editor = document.getElementById("scriptEditor");
    if(editor){
      editor.addEventListener("input", scheduleCounterUpdate, true);
      editor.addEventListener("keyup", scheduleCounterUpdate, true);
      editor.addEventListener("paste", scheduleCounterUpdate, true);
      editor.addEventListener("input", scheduleScenesRefresh, true);
      editor.addEventListener("keyup", scheduleScenesRefresh, true);
      editor.addEventListener("paste", scheduleScenesRefresh, true);
    }
    scheduleCounterUpdate();
    scheduleScenesRefresh();
    // Keep tooltip positioned if user scrolls/resizes while hovering.
    window.addEventListener("scroll", __maybeRepositionScenePreview, {passive:true});
    window.addEventListener("resize", __maybeRepositionScenePreview, {passive:true});

  });

      const len = container.nodeValue ? container.nodeValue.length : 0;
      r.setEnd(container, Math.max(0, Math.min(offset, len)));
    }else if(container.nodeType === 1){
      const el = container;
      const n = el.childNodes ? el.childNodes.length : 0;
      const o = Math.max(0, Math.min(offset, n));

      if(n === 0){
        r.setEnd(el, 0);
      }else if(o === n){
        r.setEndAfter(el.childNodes[n-1]);
      }else{
        r.setEndBefore(el.childNodes[o]);
      }
    }else{
      r.setEnd(hostEl, 0);
    }
  }catch(_e){
    r.selectNodeContents(hostEl);
  }

  return r.toString();
}

function locateVisualIndexInElement(hostEl, container, offset){
  return visualStringInElement(hostEl, container, offset).length;
}

function locateVisualIndexInLine(lineEl, container, offset){
  // Strip any newlines browsers may synthesize between inline nodes.
  return visualStringInElement(lineEl, container, offset).replace(/\n/g,'').length;
}

  function resolveVisualIndexInElement(hostEl, index){
    const walker = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
    let idx = 0, current;
    while((current = walker.nextNode())){
      const len = current.nodeValue.length;
      if(idx + len >= index){
        return { node: current, offset: Math.max(0, index - idx) };
      }
      idx += len;
    }
    // Ensure text node exists
    if(!hostEl.firstChild) hostEl.appendChild(document.createTextNode(""));
    // End
    const last = (() => {
      let n=null; const w=document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
      while(w.nextNode()) n=w.currentNode;
      return n;
    })();
    return { node: last, offset: last ? last.nodeValue.length : 0 };
  }

  function _dualFieldForNode(node){
  const el = node && (node.nodeType===1 ? node : node.parentElement);
  return el ? el.closest(".dualField") : null;
}
function _dualHostForPart(lineEl, part){
  if(!lineEl) return null;
  if((lineEl.dataset.type||"") !== "dual") return lineEl;
  if(!part) return lineEl;
  return lineEl.querySelector(`.dualField[data-part="${CSS.escape(part)}"]`) || lineEl;
}

function locateScriptIndex(container, offset){
  const lineEl = container?.nodeType===1 ? container.closest?.(".line") : container?.parentElement?.closest(".line");
  if(!lineEl) return null;
  const lineId = lineEl.dataset.id;

  if((lineEl.dataset.type||"") === "dual"){
    const field = _dualFieldForNode(container);
    const part = field?.dataset?.part || "L_DLG";
    const host = field || lineEl;
    // Convert DOM point to a "visual character index" within the host using a Range.
    const idx = visualStringInElement(host, container, offset).replace(/\n/g,'').length;
    return { lineId, part, index: idx };
  }

  // Convert DOM point to a "visual character index" within the line using a Range.
  // This is robust across nested inline formatting (<b><i><span data-caps>...).
  const idx = locateVisualIndexInLine(lineEl, container, offset);
  return { lineId, index: idx };
}

  function resolveScriptIndex(lineId, index, part){
    const lineEl = $(`.line[data-id="${CSS.escape(lineId)}"]`);
    if(!lineEl) return null;
    const host = _dualHostForPart(lineEl, part) || lineEl;
    return resolveVisualIndexInElement(host, index);
  }


  function getSelectionDescriptor(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return null;
    const r = sel.getRangeAt(0);

    const editor = $("#scriptEditor");
    if(editor.contains(r.startContainer) && editor.contains(r.endContainer)){
      const a = locateScriptIndex(r.startContainer, r.startOffset);
      const b = locateScriptIndex(r.endContainer, r.endOffset);
      if(!a || !b) return null;
      return { scope:"script", lineIdStart:a.lineId, partStart:a.part, indexStart:a.index, lineIdEnd:b.lineId, partEnd:b.part, indexEnd:b.index };
    }

    // Title fields
    const titleFields = ["tp_title","tp_writtenby","tp_name","tp_contact"].map(id => $("#"+id));
    for(const field of titleFields){
      if(field.contains(r.startContainer) && field.contains(r.endContainer)){
        const s = locateVisualIndexInElement(field, r.startContainer.nodeType===3 ? r.startContainer : r.startContainer, r.startOffset);
        const e = locateVisualIndexInElement(field, r.endContainer.nodeType===3 ? r.endContainer : r.endContainer, r.endOffset);
        return { scope:"title", fieldId: field.id, indexStart:s, indexEnd:e };
      }
    }

    return null;
  }

  function restoreSelectionDescriptor(desc){
    if(!desc) return;
    const sel = window.getSelection();
    sel.removeAllRanges();

    if(desc.scope==="script"){
      const a = resolveScriptIndex(desc.lineIdStart, desc.indexStart, desc.partStart);
      const b = resolveScriptIndex(desc.lineIdEnd, desc.indexEnd, desc.partEnd);
      if(!a || !b) return;
      const range = document.createRange();
      range.setStart(a.node, a.offset);
      range.setEnd(b.node, b.offset);
      sel.addRange(range);
      return;
    }

    if(desc.scope==="title"){
      const field = $("#"+desc.fieldId);
      if(!field) return;
      const a = resolveVisualIndexInElement(field, desc.indexStart);
      const b = resolveVisualIndexInElement(field, desc.indexEnd);
      const range = document.createRange();
      range.setStart(a.node, a.offset);
      range.setEnd(b.node, b.offset);
      sel.addRange(range);
      field.focus();
      return;
    }
  }

  

  // ---------- Caret stability guard ----------
  // Track the last known good caret/selection inside the script lines so we can recover
  // if the browser ever drops the caret into a spacer/anchor (can cause 1-char jumps or "vertical" typing).
  let LAST_GOOD_SCRIPT_SEL = null;

  document.addEventListener("selectionchange", () => {
    const d = getSelectionDescriptor();
    if(d && d.scope === "script"){
      LAST_GOOD_SCRIPT_SEL = d;
    }
  });

  function repairCaretIfDetached(){
    const editor = $("#scriptEditor");
    const sel = window.getSelection();
    if(!editor || !sel || sel.rangeCount === 0) return false;

    const r = sel.getRangeAt(0);
    const within = editor.contains(r.startContainer) && editor.contains(r.endContainer);

    // IMPORTANT: Don't "repair" an active selection that is already within the editor.
    // Cmd/Ctrl+A often anchors the range to the editor element itself (not a .line).
    if(!r.collapsed){
      try{
        if(editor.contains(r.commonAncestorContainer)) return false;
      }catch(_e){}
    }
        const el = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;

    // During IME/composition or some browser editing operations, the collapsed caret can temporarily
    // report its container as the editor element itself. Treat that as "not detached" to avoid
    // snapping back to a stale location mid-typing.
    const isEditorRootPoint = within && r.collapsed && (r.startContainer === editor || el === editor);

    // If the caret is anchored on the editor root (common after select-all + delete),
    // snap it into the nearest real line before we classify it as "not detached".
    if(isEditorRootPoint){
      try{ if(snapCaretIntoNearestLine()) return true; }catch(_e){}
    }

    const bad =
      !within ||
      !el ||
      !!el.closest("#caretAnchor") ||
      !!el.closest(".pageSpacer") ||
      (!el.closest(".line") && !isEditorRootPoint);

    if(!bad) return false;

    // Prefer restoring the last good in-script selection
    if(LAST_GOOD_SCRIPT_SEL){
      restoreSelectionDescriptor(LAST_GOOD_SCRIPT_SEL);
      return true;
    }

    // Fallback: end of last line
    const lines = $$(".line", editor);
    const last = lines[lines.length - 1];
    if(last){
      placeCaretAtLineIndex(last.dataset.id, getLineTextLength(last));
      return true;
    }

    return false;
  }

// ---------- History (Undo/Redo) ----------
  const HISTORY_LIMIT = 250;
  let undoStack = [];
  let redoStack = [];
  let snapshotTimer = null;
  const SNAPSHOT_DEBOUNCE_MS = 250;

  // Prevent history mutation during programmatic DOM rebuilds (paginate/render/load/undo/redo).
  let HISTORY_LOCK = false;

  function stateFingerprint(state){
  try{
    const wrapCal = parseFloat(getComputedStyle(root).getPropertyValue('--wrap-cal-mm')) || 0;
    let total = 0;
    for(const ln of (state.lines || [])){
      if(ln && ln.type === "dual" && ln.dual){
        const d = ln.dual;
        const buckets = [
          ...(d.left?.characterRuns||[]), ...(d.left?.dialogueRuns||[]),
          ...(d.right?.characterRuns||[]), ...(d.right?.dialogueRuns||[]),
        ];
        for(const r of buckets) total += (r.t || "").length;
      }else{
        for(const r of (ln.runs || [])) total += (r.t || "").length;
      }
    }
    return `${state.fontSizePt||12}|${(state.fontStack||"").trim()}|${state.baselineCal||1}|${wrapCal.toFixed(2)}|sn:${(state.pageSettings && state.pageSettings.sceneNumbers) ? 1 : 0}|${(state.lines||[]).length}|${total}`;
  }catch(e){
    return String(Date.now());
  }
}

function snapshot(reason="edit"){
  if(HISTORY_LOCK) return;
  const state = serializeDocFromDOM();
  const sel = getSelectionDescriptor();

  // Skip duplicate consecutive snapshots using a lightweight fingerprint
  const fp = stateFingerprint(state);
  const last = undoStack.length ? undoStack[undoStack.length-1].fp : null;
  if(last && last === fp) return;

  undoStack.push({ state, sel, fp });
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  setStatus(`Saved history (${reason}).`);
}

  function scheduleSnapshot(reason="edit"){
    clearTimeout(snapshotTimer);
    snapshotTimer = setTimeout(() => snapshot(reason), SNAPSHOT_DEBOUNCE_MS);
  }

  function applyState(docState, selDesc){
    HISTORY_LOCK = true;
    try{
      DOC = docState;
      applyDocSettings(DOC);
      renderFromDoc(DOC);
      requestAnimationFrame(() => {
        paginate();
        restoreSelectionDescriptor(selDesc);
      });
    }finally{
      // Unlock on next frame so any immediate input events from render/paginate don't snapshot.
      requestAnimationFrame(() => { HISTORY_LOCK = false; });
    }
  }

  function doUndo(){
    // Need at least 2 snapshots: [..., previous, current]
    if(undoStack.length < 2) return;

    clearTimeout(snapshotTimer);
    HISTORY_LOCK = true;

    const current = undoStack.pop();     // move current to redo
    redoStack.push(current);

    const prev = undoStack[undoStack.length-1];
    applyState(prev.state, prev.sel);
    setStatus("Undo");
  }

  function doRedo(){
    if(redoStack.length === 0) return;

    clearTimeout(snapshotTimer);
    HISTORY_LOCK = true;

    const next = redoStack.pop();        // apply next, and it becomes current
    undoStack.push(next);

    applyState(next.state, next.sel);
    setStatus("Redo");
  }

  // ---------- Editor structure + normalization ----------

  function normalizeEditorStructure(){
    const editor = $("#scriptEditor");

    // Remove any existing spacers that aren't first/top or between-page
    for(const sp of $$(".pageSpacer", editor)){
      // keep; we'll rebuild in paginate()
      // but keep ONLY those inside editor; they are non-editable anyway
    }

    // Wrap stray nodes into .line (rare)
    for(const node of Array.from(editor.childNodes)){
      if(node.nodeType===1 && (node.id==="caretAnchor" || node.classList.contains("line") || node.classList.contains("pageSpacer"))) continue;
      if(node.nodeType===3 && node.nodeValue.trim()===""){ node.remove(); continue; }
      // wrap
      const line = makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]);
      if(node.nodeType===3){
        line.textContent = node.nodeValue.replace(/\r?\n/g,'');
      } else {
        line.innerHTML = "";
        line.appendChild(node);
      }
      editor.insertBefore(line, node.nextSibling);
      if(node.parentNode) node.remove();
    }

    // Remove stray <br> inside lines
    for(const line of $$(".line", editor)){
      for(const br of $$("br", line)) br.remove();
      if(!line.dataset.id) line.dataset.id = uid();
      if(!line.dataset.type) line.dataset.type = "action";
    }
  }

  function ensureAtLeastOneLine(){
    const editor = $("#scriptEditor");
    if(!editor.querySelector(".line")){
      editor.appendChild(makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]));
    }
  }

  
  function ensureCaretAnchor(){
    const editor = $("#scriptEditor");
    if(!editor) return null;
    let anchor = $("#caretAnchor", editor);
    if(!anchor){
      anchor = document.createElement("span");
      anchor.id = "caretAnchor";
      anchor.textContent = "\u200B"; // ZWSP
      anchor.setAttribute("aria-hidden","true");
      anchor.contentEditable = "false";
      anchor.style.position = "absolute";
      anchor.style.left = "0";
      anchor.style.top = "0";
      anchor.style.width = "1px";
      anchor.style.height = "1px";
      anchor.style.overflow = "hidden";
      anchor.style.opacity = "0";
      anchor.style.pointerEvents = "none";
      editor.prepend(anchor);
    }
    return anchor;
  }

  function ensureLeadingTopSpacer(){
    const editor = $("#scriptEditor");
    const first = editor.firstElementChild;
    if(!(first && first.classList.contains("pageSpacer") && first.dataset.kind==="top")){
      const top = document.createElement("div");
      top.className = "pageSpacer";
      top.dataset.kind = "top";
      top.contentEditable = "false";
      editor.prepend(top);
    }
  }

  // If the browser collapses the caret onto the editor root element (common after large deletes),
  // typing can create stray text nodes *outside* .line elements, which shows up as text appearing
  // in the page margin or "vertical" typing. This snaps the caret back into the nearest .line.
  function snapCaretIntoNearestLine(){
    const editor = $("#scriptEditor");
    const sel = window.getSelection();
    if(!editor || !sel || sel.rangeCount === 0) return false;

    const r = sel.getRangeAt(0);
    if(!r.collapsed) return false;

    // Only handle the problematic case: caret anchored on the editor element itself.
    if(r.startContainer !== editor) return false;

    try{ ensureCaretAnchor(); }catch(_e){}
    try{ ensureLeadingTopSpacer(); }catch(_e){}
    try{ ensureAtLeastOneLine(); }catch(_e){}

    const kids = Array.from(editor.childNodes);
    const i = Math.max(0, Math.min(r.startOffset, kids.length));

    const findLineForward = (from) => {
      for(let j=from;j<kids.length;j++){
        const n = kids[j];
        if(n && n.nodeType===1 && n.classList && n.classList.contains("line")) return n;
      }
      return null;
    };
    const findLineBackward = (from) => {
      for(let j=from;j>=0;j--){
        const n = kids[j];
        if(n && n.nodeType===1 && n.classList && n.classList.contains("line")) return n;
      }
      return null;
    };

    let line = findLineForward(i) || findLineBackward(i-1) || editor.querySelector(".line");
    if(!line) return false;

    try{
      placeCaretAtLineIndex(line.dataset.id, 0);
      return true;
    }catch(_e){}
    return false;
  }



  // ---------- Pagination (single editable DOM + spacers) ----------
  
  function getPageMetricsPx(){
    const pageH = mmToPx(parseFloat(getComputedStyle(root).getPropertyValue('--a4h-mm')));
    const top = mmToPx(parseFloat(getComputedStyle(root).getPropertyValue('--m-top-mm')));
    const bot = mmToPx(parseFloat(getComputedStyle(root).getPropertyValue('--m-bot-mm')));
    const gap = 16; // px between pages (visual gap)
    const writingH = pageH - top - bot;
    return { pageH, top, bot, writingH, gap };
  }

  function makeMeasurer(editor){
    let m = $("#_measurer", editor);
    if(m) return m;
    m = document.createElement("div");
    m.id = "_measurer";
    m.className = "line";
    m.dataset.type = "action";
    m.contentEditable = "false";
    m.style.position = "absolute";
    m.style.left = "-99999px";
    m.style.top = "0";
    m.style.visibility = "hidden";
    m.style.pointerEvents = "none";
    editor.appendChild(m);
    return m;
  }

  function lineTextFromRuns(runs){
    return (runs||[]).map(r => r.t || "").join("");
  }

  function trimLeadingSpaceFromRuns(runs){
    if(!runs || !runs.length) return runs;
    const r0 = runs[0];
    if((r0.t || "").startsWith(" ")){
      const t = r0.t.replace(/^ +/,"");
      runs[0] = {...r0, t};
    }
    if(runs.length===0) runs = [{t:"",b:false,i:false,u:false,s:false,c:false}];
    return runs;
  }

  function measureRunsHeight(measurer, type, runs){
    measurer.dataset.type = type || "action";
    measurer.innerHTML = "";
    measurer.appendChild(renderRuns(runs));
    return measurer.getBoundingClientRect().height;
  }

  function findSplitIndexToFit(lineEl, runs, remainingH, measurer){
    const total = runsTextLength(runs);
    if(total <= 1) return 0;

    const type = lineEl.dataset.type || "action";
    // If even a single character doesn't fit, return 0 to force new page.
    const h1 = measureRunsHeight(measurer, type, splitRuns(runs, 1)[0]);
    if(h1 > remainingH) return 0;

    let lo = 1, hi = total; // we know lo fits
    while(lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      const leftRuns = splitRuns(runs, mid)[0];
      const h = measureRunsHeight(measurer, type, leftRuns);
      if(h <= remainingH) lo = mid;
      else hi = mid - 1;
    }

    // Prefer breaking on whitespace to mimic Word/FD wrapping.
    const fullText = lineTextFromRuns(runs);
    let idx = lo;
    const back = fullText.slice(0, idx);
    const ws = Math.max(back.lastIndexOf(" "), back.lastIndexOf("	"));
    if(ws > 0 && ws < idx){
      // break AFTER the whitespace so next line doesn't start with it
      idx = ws + 1;
    }

    // Safety: ensure progress
    idx = Math.max(1, Math.min(idx, total-1));
    return idx;
  }


  // ---------- Pagination selection reaffirm guard ----------
  // Prevents rare caret jumps / word-splitting when typing very fast:
  // pagination rebuild can schedule a next-frame selection restore; if the user keeps typing,
  // that restore becomes stale and can yank the caret backwards. We invalidate reaffirm restores
  // whenever the selection or input stream advances.
  let __paginateReaffirmRAF = 0;
  let __paginateReaffirmToken = 0;
  let __selEpoch = 0;

  function __cancelPaginateReaffirm(){
    try{
      if(__paginateReaffirmRAF){
        cancelAnimationFrame(__paginateReaffirmRAF);
        __paginateReaffirmRAF = 0;
      }
    }catch(_e){}
    __paginateReaffirmToken++;
  }

  // Any caret movement should invalidate pending reaffirm restores.
  document.addEventListener("selectionchange", () => {
    try{ __selEpoch++; }catch(_e){}
  }, true);

  // ---------- Scene number attributes (for display only) ----------
  function updateSceneNumberAttributes(){
    const editor = $("#scriptEditor");
    if(!editor) return;
    const sceneLines = Array.from(editor.querySelectorAll('.line[data-type="scene"]'));
    let n = 1;
    for(const ln of sceneLines){
      ln.dataset.sceneNum = String(n++);
    }
  }
  function clearSceneNumberAttributes(){
    const editor = $("#scriptEditor");
    if(!editor) return;
    for(const ln of editor.querySelectorAll('.line[data-scene-num]')){
      delete ln.dataset.sceneNum;
    }
  }

  function paginate(){
    const editor = $("#scriptEditor");
    if(!editor) return;

    let selDesc = getSelectionDescriptor();
    if(__pendingSelectionOverride){
      selDesc = __pendingSelectionOverride;
      __pendingSelectionOverride = null;
    }
    // Keep a stable caret anchor node (Firefox caret stability), but never move selection into it.
    const caretAnchor = ensureCaretAnchor();


    // Gather real lines in order (ignore spacers)
    const lines = $$(".line", editor);

    // Remove all spacers, we'll re-insert deterministically
    for(const sp of $$(".pageSpacer", editor)) sp.remove();

    const { writingH, top, bot, gap } = getPageMetricsPx();

    const frag = document.createDocumentFragment();

    // Preserve caret anchor as the first child so focus/selection never detaches.
    if(caretAnchor) frag.appendChild(caretAnchor);

    // Top spacer: real px height so it matches layout even with zoom rounding
    const topSp = document.createElement("div");
    topSp.className="pageSpacer"; topSp.dataset.kind="top"; topSp.contentEditable="false";
    topSp.style.height = `${top}px`;
    frag.appendChild(topSp);

    const measurer = makeMeasurer(editor);

    // Track splits so we can repair selection if the caret was in a part we moved to a new line.
    const splits = [];

    const measureLine = (el) => el.getBoundingClientRect().height;

    let used = 0;
    const queue = lines.slice();

    while(queue.length){
      const line = queue.shift();

      // Skip if node got detached somehow
      if(!line || !line.classList || !line.classList.contains("line")) continue;

      // Ensure line has id/type
      if(!line.dataset.id) line.dataset.id = uid();
      if(!line.dataset.type) line.dataset.type = "action";

      // Remaining space on current page
      let remaining = writingH - used;

      // If nothing left, start a new page
      if(remaining <= 0.5){
        const between = document.createElement("div");
        between.className="pageSpacer"; between.dataset.kind="between"; between.contentEditable="false";
        between.style.height = `${top + bot + gap}px`;
        frag.appendChild(between);
        used = 0;
        remaining = writingH;
      }

      let h = measureLine(line);

      // If it fits, place it
      if(h <= remaining){
        frag.appendChild(line);
        used += h;
        continue;
      }

      // If line is taller than a full page writing area, we'll split repeatedly.
      const runs = lineRunsFromDOM(line);
      const totalLen = runsTextLength(runs);

      // If it doesn't fit in remaining space but WOULD fit on a fresh page (or remaining is tiny), start new page.
      if(used > 0){
        const fullH = measureRunsHeight(measurer, line.dataset.type, runs);
        if(fullH > writingH || remaining < 8){
          const between = document.createElement("div");
          between.className="pageSpacer"; between.dataset.kind="between"; between.contentEditable="false";
          between.style.height = `${top + bot + gap}px`;
          frag.appendChild(between);
          used = 0;
          queue.unshift(line);
          continue;
        }
      }

      // Try to split within the paragraph so it can flow across pages.
      const splitIdx = findSplitIndexToFit(line, runs, remaining, measurer);
      if(splitIdx <= 0 || splitIdx >= totalLen){
        // Can't split safely -> new page
        const between = document.createElement("div");
        between.className="pageSpacer"; between.dataset.kind="between"; between.contentEditable="false";
        between.style.height = `${top + bot + gap}px`;
        frag.appendChild(between);
        used = 0;
        queue.unshift(line);
        continue;
      }

      const [leftRuns, rightRunsRaw] = splitRuns(runs, splitIdx);
      const rightRuns = trimLeadingSpaceFromRuns(rightRunsRaw);

      // Mutate current line to left
      const oldId = line.dataset.id;
      line.innerHTML = "";
      line.appendChild(renderRuns(leftRuns));

      // Create continuation line (same type)
      const cont = makeLine(line.dataset.type, rightRuns);

      // Record split to adjust selection later
      splits.push({ oldId, splitIdx, newId: cont.dataset.id });

      // Place left part now
      frag.appendChild(line);
      used += measureRunsHeight(measurer, line.dataset.type, leftRuns);

      // Start new page for continuation
      const between = document.createElement("div");
      between.className="pageSpacer"; between.dataset.kind="between"; between.contentEditable="false";
      between.style.height = `${top + bot + gap}px`;
      frag.appendChild(between);
      used = 0;

      // Process continuation next (it might need further splitting)
      queue.unshift(cont);
    }

    // Rebuild editor DOM
    editor.innerHTML = "";
    editor.appendChild(frag);

    // Update scene numbers in the left margin (if enabled)
    if(isSceneNumbersEnabled()) updateSceneNumberAttributes();
    else clearSceneNumberAttributes();

    // Remove measurer after layout
    $("#_measurer", editor)?.remove();

    // Fix selection if it was inside a chunk we moved to a continuation line
    if(selDesc && selDesc.scope==="script" && splits.length){
      const fixPoint = (lineId, idx) => {
        for(const sp of splits){
          if(sp.oldId === lineId && idx > sp.splitIdx){
            return { lineId: sp.newId, idx: Math.max(0, idx - sp.splitIdx) };
          }
        }
        return { lineId, idx };
      };
      const a = fixPoint(selDesc.lineIdStart, selDesc.indexStart);
      const b = fixPoint(selDesc.lineIdEnd, selDesc.indexEnd);
      selDesc = { ...selDesc, lineIdStart:a.lineId, indexStart:a.idx, lineIdEnd:b.lineId, indexEnd:b.idx };

// Smart type heuristics (Final Draft-ish)
function isMostlyUpper(s){
  const letters = (s.match(/[A-Za-z]/g) || []).length;
  if(letters === 0) return false;
  const upper = (s.match(/[A-Z]/g) || []).length;
  return upper / letters >= 0.85;
}

function looksLikeSceneHeading(t){
  const s = (t||"").trim();
  return /^(INT\.|EXT\.|INT\/EXT\.|I\/E\.|EST\.|INT\.\/EXT\.)\s/i.test(s);
}

function looksLikeTransition(t){
  const s = (t||"").trim();
  if(s.length < 3) return false;
  if(s.length > 28) return false;
  if(!/TO:\s*$/.test(s)) return false;
  return isMostlyUpper(s);
}

function looksLikeCharacter(t, prevLineEl){
  const s = (t||"").trim();
  if(s.length < 1 || s.length > 35) return false;
  // Character lines are usually short, mostly uppercase, and NOT sentence-like.
  if(/[:]/.test(s)) return false;
  if(/[\.\,\;\?\!]/.test(s)) return false;
  if(/\)$/.test(s)) return false;
  const wc = s.split(/\s+/).filter(Boolean).length;
  if(wc > 4) return false;
  if(!isMostlyUpper(s)) return false;
  // Character is usually introduced after a blank line or a scene heading/action break
  if(prevLineEl && getLineTextLength(prevLineEl)===0) return true;
  return false;
}

function applySmartTypeFromText(lineEl){
  if(!lineEl) return false;
  const t = lineEl.innerText.replace(/\n/g,'');
  const cur = lineEl.dataset.type || "action";
  const prev = previousLine(lineEl);

  // Don't auto-change if the user has explicitly set a non-action type already.
  // But allow scene/transition detection from action because that's the common workflow.
  if(cur === "action"){
    if(looksLikeSceneHeading(t)){
      setLineType(lineEl, "scene", { paginate:false, snapshot:false, preserveSelection:true });
      return true;
    }
    if(looksLikeTransition(t)){
      setLineType(lineEl, "transition", { paginate:false, snapshot:false, preserveSelection:true });
      return true;
    }
  }

  // If a line is explicitly character but no longer looks like one, gently fall back to action.
  if(cur === "character"){
    const s = (t||"").trim();
    if(s && !isMostlyUpper(s)){
      setLineType(lineEl, "action", { paginate:false, snapshot:false, preserveSelection:true });
      return true;
    }
  }
  return false;
}

function _uppercaseTextNodes(rootEl){
  if(!rootEl) return;
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(!node.nodeValue) return NodeFilter.FILTER_REJECT;
      // Skip our invisible caret anchor if it ever ends up inside.
      if(node.parentElement && node.parentElement.id === "caretAnchor") return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const tn of nodes){
    tn.nodeValue = tn.nodeValue.toUpperCase();
  }
}

function applyTypeCapitalization(lineEl, type){
  if(!lineEl) return;
  // FD behaviour: Scene / Character / Transition are uppercase.
  if(type === "scene" || type === "character" || type === "transition"){
    _uppercaseTextNodes(lineEl);
  }
}


  function ensureBlankLineBefore(lineEl){
    const prev = previousLine(lineEl);
    if(prev && getLineTextLength(prev)===0) return;
    const blank = makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]);
    lineEl.parentElement.insertBefore(blank, lineEl);
  }
  function ensureBlankLineAfter(lineEl){
    const nxt = nextLine(lineEl);
    if(nxt && getLineTextLength(nxt)===0) return;
    const blank = makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]);
    lineEl.parentElement.insertBefore(blank, lineEl.nextSibling);

    function _dualFieldTextLen(lineEl, part){

      left: { characterRuns: [{...EMPTY_RUN}], dialogueRuns: [{...EMPTY_RUN}] },
      right:{ characterRuns: [{...EMPTY_RUN}], dialogueRuns: [{...EMPTY_RUN}] },
    });

    if(prevType === "character") seed.left.characterRuns = _ensureRuns(runs);
    else if(prevType === "dialogue") seed.left.dialogueRuns = _ensureRuns(runs);

  function setLineType(lineEl, type, opts={}){
    if(!lineEl) return;
    // Options:
    // - opts.paginate (default true): caller may batch pagination (e.g., input handler)
    // - opts.snapshot (default true): whether to create an undo snapshot for this type change
    // - opts.preserveSelection (default false): attempt to keep caret/selection stable
    const preserve = !!opts.preserveSelection && type !== "dual";
    const selDesc = preserve ? getSelectionDescriptor() : null;

    if(type === "dual"){
      if(!lineEl.dataset.id) lineEl.dataset.id = uid();
      convertLineToDual(lineEl);

      if(opts.snapshot !== false){
        scheduleSnapshot("type");
      }

      if(opts.paginate !== false){
        paginate();
      }

      // Land the caret in the left Character box (FD-like starting point).
      requestAnimationFrame(() => {
        try{
          const id = lineEl.dataset.id;
          const end = _dualFieldTextLen(lineEl, "L_CHAR");
          placeCaretAtLineIndex(id, end, "L_CHAR");
        }catch(_e){}
      });
      return;
    }

    lineEl.dataset.type = type;

    // If the line was created or pasted with embedded <br> / newlines, treat them as
    // soft breaks so re-wrapping works correctly when switching column widths.
    try{ _removeSoftBreaksInLine(lineEl); }catch(_e){}

    // Final Draft-like: these block types are uppercase by default.
    try{ applyTypeCapitalization(lineEl, type); }catch(_e){}

    // Parenthetical ergonomics: when switching a blank line to Parenthetical, prefill "()"
    // and put the caret inside. Must happen BEFORE paginate() captures the selection.
    if(type === "parenthetical"){
      try{
        const raw = (lineEl.innerText || lineEl.textContent || "").replace(/\n/g,"").trim();
        if(!raw){
          // Ensure the line has a stable id before we start pinning selection.
          if(!lineEl.dataset.id) lineEl.dataset.id = uid();
          lineEl.innerText = "()";
          // Hard guarantee: caret lands BETWEEN the parentheses (survives paginate/restore passes).
          try{ pinCaretInsideParens(lineEl); }catch(_e){
            try{ hintForceCaretInsideParens(lineEl); }catch(_e2){}
            try{ placeCaretInsideParens(lineEl); }catch(_e2){}
          }
        }else{
          // If user already has text, wrap it with parens if needed.
          let s = raw;
          if(!s.startsWith("(")) s = "(" + s;
          if(!s.endsWith(")")) s = s + ")";
          if(s !== raw) lineEl.innerText = s;
        }
      }catch(_e){}
    }

    if(type==="scene"){
      ensureBlankLineBefore(lineEl);
      ensureBlankLineAfter(lineEl);
    }
    if(type==="character"){

    }

    if(opts.snapshot !== false){
      scheduleSnapshot("type");
    }

    // If we're deferring pagination, don't rebuild the DOM here — that can fight the browser's
    // post-input caret placement (causing the caret to "snap back" while typing INT./EXT. etc.)
    if(opts.paginate !== false){

      requestAnimationFrame(() => {
        try{ restoreSelectionDescriptor(selDesc); }catch(_e){}
      });
    }
  }

  function insertTextAtCaretPlain(text){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;
    const r = sel.getRangeAt(0);
    let ok = false;
    try{
      ok = document.execCommand && document.execCommand("insertText", false, text);

    if(ok) return;

    r.deleteContents();

    if(!sel || sel.rangeCount===0) return;
    const r = sel.getRangeAt(0);

    // Prefer a local host (dual dialogue field or line) so tab width feels consistent.
    let host = null;
    try{
      const n = r.startContainer;
      const el = (n && n.nodeType === 1) ? n : (n ? n.parentElement : null);
      host = el && (el.closest ? (el.closest(".dualField") || el.closest(".line")) : null);
    }catch(_e){}
    if(!host) host = (typeof getActiveLine === "function") ? getActiveLine() : null;
    if(!host){
      host = document.getElementById("scriptEditor") || document.body;
    }

    // Compute caret index within the host (best-effort, DOM-nesting safe).
    let idx = 0;
    try{
      const sc = r.startContainer;
      const so = r.startOffset;
      if(host && host.classList && host.classList.contains("line") && typeof locateVisualIndexInLine === "function"){
        idx = locateVisualIndexInLine(host, sc, so);
      }else if(typeof locateVisualIndexInElement === "function"){
        idx = locateVisualIndexInElement(host, sc, so);
      }else{

        pre.selectNodeContents(host);
        pre.setEnd(sc, so);
        idx = (pre.toString() || "").replace(/\n/g,"").length;

    const TAB = 4;
    let add = TAB - (idx % TAB);
    if(add === 0) add = TAB;

    insertTextAtCaretPlain(" ".repeat(add));

function toggleCapsOnSelection(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    const editor = $("#scriptEditor");
    if(!editor.contains(range.commonAncestorContainer)) return;
    if(range.collapsed) return;

    // Take one snapshot before mutation (Word/FD style)
    scheduleSnapshot("caps");

    // Collect all text nodes that intersect the selection (skip caret anchor / spacers)
    const textNodes = [];
    const walker = document.createTreeWalker(
      editor,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node){
          if(!node.nodeValue || node.nodeValue.length===0) return NodeFilter.FILTER_REJECT;
          const p = node.parentElement;
          if(!p) return NodeFilter.FILTER_REJECT;
          if(p.closest && p.closest("#caretAnchor")) return NodeFilter.FILTER_REJECT;
          if(p.closest && p.closest(".pageSpacer")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const intersectsRange = (node) => {
      const r2 = document.createRange();
      r2.selectNodeContents(node);
      // true if ranges overlap
      return !(range.compareBoundaryPoints(Range.END_TO_START, r2) >= 0 ||
               range.compareBoundaryPoints(Range.START_TO_END, r2) <= 0);
    };

    let n;
    while((n = walker.nextNode())){
      if(intersectsRange(n)) textNodes.push(n);
    }
    if(textNodes.length===0) return;

    // Decide toggle direction:
    // If ANY selected text is not inside a caps span => APPLY caps.
    // Otherwise => REMOVE caps.
    const isInCaps = (node) => {
      const el = node.parentElement;
      return !!(el && el.closest && el.closest('span[data-caps="1"]'));
    };
    const shouldApply = textNodes.some(t => !isInCaps(t));

    // Helper: split a text node and return the middle node [start,end)
    function isolateTextSlice(textNode, start, end){
      let node = textNode;
      const len = node.nodeValue.length;

      const safeStart = Math.max(0, Math.min(start, len));
      const safeEnd   = Math.max(0, Math.min(end, len));
      if(safeEnd <= safeStart) return null;

      // Split at end first, then at start so indices remain valid
      if(safeEnd < len) node.splitText(safeEnd);
      if(safeStart > 0) node = node.splitText(safeStart);
      return node; // now exactly the selected slice
    }

    function wrapCaps(textNode){
      const capsSpan = document.createElement("span");
      capsSpan.dataset.caps = "1";
      textNode.parentNode.insertBefore(capsSpan, textNode);
      capsSpan.appendChild(textNode);
    }
    function unwrapCapsSlice(textNode){
      const capsSpan = textNode.parentElement && textNode.parentElement.closest
        ? textNode.parentElement.closest('span[data-caps="1"]')
        : null;
      if(!capsSpan) return;

      // Preserve any inline formatting *inside* the caps span (b/i/u/s/etc).
      // We move only the selected text slice out of the caps span, recreating its
      // ancestor formatting chain (excluding the caps span) so nothing disappears.
      const chain = [];
      let p = textNode.parentNode;
      while(p && p !== capsSpan){
        if(p.nodeType === 1) chain.push(p);
        p = p.parentNode;
      }

      // Build clone chain from outermost -> innermost
      let outerClone = null;
      let inner = null;
      for(let i = chain.length - 1; i >= 0; i--){
        const src = chain[i];
        const clone = src.cloneNode(false); // shallow clone keeps tag + attrs
        if(!outerClone){
          outerClone = clone;
          inner = clone;
        }else{
          inner.appendChild(clone);
          inner = clone;
        }
      }

      // Insert either the clone chain (if any) or the raw text node before capsSpan
      if(outerClone){
        capsSpan.parentNode.insertBefore(outerClone, capsSpan);
        inner.appendChild(textNode); // move the slice into the innermost clone
      }else{
        capsSpan.parentNode.insertBefore(textNode, capsSpan);
      }

      // Clean up any now-empty wrappers left behind inside capsSpan
      for(const src of chain){
        if(src && src.parentNode && !src.firstChild){
          src.remove();
        }
      }

      // If the capsSpan is empty after removal, delete it.
      if(!capsSpan.firstChild || !capsSpan.textContent){
        if(!capsSpan.textContent || capsSpan.textContent.length === 0) capsSpan.remove();
      }
    }


    // Apply mutation node-by-node
    for(const t of textNodes){
      const start = (t === range.startContainer) ? range.startOffset : 0;
      const end   = (t === range.endContainer) ? range.endOffset : t.nodeValue.length;

      const slice = isolateTextSlice(t, start, end);
      if(!slice) continue;

      if(shouldApply){
        // Avoid double-wrapping
        if(!isInCaps(slice)) wrapCaps(slice);
      } else {
        // Remove only the selected slice from caps
        if(isInCaps(slice)) unwrapCapsSlice(slice);
      }
    }

    // Preserve selection: serialize a descriptor *before* paginate rebuild moves nodes
    const selDesc = getSelectionDescriptor();

    requestAnimationFrame(() => {
      normalizeEditorStructure();
      paginate();
      // Restore selection after paginate
      requestAnimationFrame(() => restoreSelectionDescriptor(selDesc));
    });
  }

  // - Suppress spellcheck only on the currently active .line while you're typing *inside a word*.
  // - Re-enable spellcheck only when the word is committed (space / punctuation / Enter),
  //   or when the caret moves to a different line / leaves the editor.

  // This prevents the common native behavior where a misspelled word gets re-underlined mid-edit
  // after a short pause, then clears again on the next keystroke (the "flashing" you reported).

  const SPELLCHECK_COMMIT_MS = 60;

function _getActiveLineInEditor(){

    let node = r.startContainer;
