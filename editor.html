    const prefix = parsed.prefix;
    const time = parsed.time;
    const newText = time ? (prefix + " " + loc.toUpperCase() + " - " + time) : (prefix + " " + loc.toUpperCase());

    line.textContent = newText;

    try{ if(typeof normalizeEditorStructure === "function") normalizeEditorStructure(); }catch(_e){}

    // Put caret at end of location (before time if any), so the flow feels natural.
    try{
      const sel = window.getSelection();
      const r = document.createRange();
      r.selectNodeContents(line);
      // Move caret before " - " if it exists
      const idx = newText.indexOf(" - ");
      const target = (idx >= 0) ? idx : newText.length;
      // Find node + offset by walking text nodes
      let remaining = target;
      let node = null;
      const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT, null);
      while(walker.nextNode()){
        const t = walker.currentNode;
        const L = t.nodeValue.length;
        if(remaining <= L){ node = t; break; }
        remaining -= L;
      }
      if(!node){
        node = line.firstChild;
        remaining = (node && node.nodeType === 3) ? node.nodeValue.length : 0;
      }
      r.setStart(node, Math.max(0, Math.min(remaining, node.nodeValue.length)));
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    }catch(_e){}

    if(!keepOpen){ hide(); return; }
    update({ keepOpen:true });
  };

  const handleKey = (e) => {
    if(!menu || menu.hidden) return false;

    const line = safeActiveLine();
    if(!isSceneLine(line)){ hide(); return false; }

    // Only consume keys that are for suggestion navigation/cycling.
    if(e.key === "ArrowDown"){
      e.preventDefault();
      activeIdx = (activeIdx + 1) % currentItems.length;
      render();
      apply(currentItems[activeIdx], { keepOpen:true });
      return true;
    }
    if(e.key === "ArrowUp"){
      e.preventDefault();
      activeIdx = (activeIdx - 1 + currentItems.length) % currentItems.length;
      render();
      apply(currentItems[activeIdx], { keepOpen:true });
      return true;
    }

    // Tab cycles; Shift+Tab cycles backwards. Does not accept/close.
    if(e.key === "Tab"){
      // If the editor has other Tab behaviors, only consume when menu is open with items.
      e.preventDefault();

      if(!_cycleActive || _cycleLineId !== ((line.dataset && line.dataset.id) ? line.dataset.id : (line.getAttribute("data-line-id") || ""))){
        _cycleActive = true;
        _cycleLineId = (line.dataset && line.dataset.id) ? line.dataset.id : (line.getAttribute("data-line-id") || "");
        _cycleItems = currentItems.slice(0);
        activeIdx = e.shiftKey ? (_cycleItems.length - 1) : 0;
      }else{
        activeIdx = e.shiftKey
          ? ((activeIdx - 1 + _cycleItems.length) % _cycleItems.length)
          : ((activeIdx + 1) % _cycleItems.length);
      }

      render();
      apply(_cycleItems[activeIdx], { keepOpen:true });
      return true;
    }

    if(e.key === "Escape"){
      e.preventDefault();
      hide();
      return true;
    }

    // Do not consume Enter/Shift+Enter: allow normal scene->action flow.
    if(e.key === "Enter"){
      hide();
      return false;
    }

    return false;
  };

  function boot(){
    menu   = document.getElementById("sceneLocMenu");
    listEl = document.getElementById("sceneLocMenuList");
    titleEl= document.getElementById("sceneLocMenuTitle");
    editor = getEditor();
    if(!menu || !listEl || !editor) return;

    // Expose hooks used by the engine lifecycle.
    window.__sceneLocMenuUpdate = (opts={}) => { try{ update(opts); }catch(_e){} };
    window.__sceneLocMenuHandleKey = (e) => { try{ return handleKey(e); }catch(_e){ return false; } };

    // Keyup catches BOTH native typing and preventDefault insert paths.
    editor.addEventListener("keyup", (ev) => {
      if(document.activeElement !== editor && !editor.contains(document.activeElement)) return;

      // Break out of cycling when normal typing occurs (so matches refresh).
      if(_cycleActive){
        const k = ev && ev.key;
        const keep = (k === "Tab" || k === "Shift" || k === "ArrowUp" || k === "ArrowDown" || k === "Alt" || k === "Control" || k === "Meta");
        if(!keep){
          _cycleActive = false;
          _cycleLineId = "";
          _cycleItems = [];
        }
      }
      update({ fastGuard:true });
    }, true);

    editor.addEventListener("mouseup", () => { update({ fastGuard:true }); }, true);
    window.addEventListener("scroll", () => { if(!menu.hidden) update({ fastGuard:true }); }, true);
    window.addEventListener("resize", () => { if(!menu.hidden) update({ fastGuard:true }); }, true);

    // Hide when clicking away.
    window.addEventListener("mousedown", (e) => {
      if(menu.hidden) return;
      const t = e.target;
      if(t && t instanceof Node && menu.contains(t)) return;
      hide();
    }, true);
  }

  // Menu is after this script tag; wait until DOM is ready.
  if(document.readyState === "loading"){
    window.addEventListener("DOMContentLoaded", () => { try{ boot(); }catch(_e){} }, {once:true});
  }else{
    try{ boot(); }catch(_e){}
  }


})();


</script>

<script>
/* ---------- Find / Replace (SCRIPT editor only) ---------- */
(() => {
  const editor = document.getElementById("scriptEditor");
  const panel = document.getElementById("findPanel");
  if(!editor || !panel) return;

  const $ = (id)=>document.getElementById(id);

  const findInp = $("findInp");
  const replaceInp = $("replaceInp");
  const replaceRow = $("replaceRow");
  const countEl = $("findCount");
  const errEl = $("findErr");
  const titleEl = $("findTitle");

  const btnPrev = $("findPrev");
  const btnNext = $("findNext");
  const btnReplace = $("findReplace");
  const btnReplaceAll = $("findReplaceAll");
  const btnClose = $("findClose");

  const togCase = $("findCase");
  const togWord = $("findWord");
  const togRegex = $("findRegex");

  const MAX_MATCHES = 5000;
  const DEBOUNCE_MS = 180;

  let lastOpenSel = null;
  let matches = [];
  let curIndex = -1;
  let searchTimer = null;

  function inScriptFocus(){
    const ae = document.activeElement;
    if(ae && (ae === editor || editor.contains(ae))) return true;
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return false;
    const r = sel.getRangeAt(0);
    return editor.contains(r.commonAncestorContainer);
  }

  function setToggle(btn, on){
    btn.classList.toggle("on", !!on);
    btn.setAttribute("aria-pressed", on ? "true":"false");
  }

  function showErr(msg){
    errEl.textContent = msg || "";
  }

  function openPanel(mode){
    if(!inScriptFocus()){
      // If user triggers from elsewhere, do nothing (per requirements)
      return;
    }
    lastOpenSel = (typeof getSelectionDescriptor === "function") ? getSelectionDescriptor() : null;

    panel.classList.add("open");
    const showReplace = (mode === "replace");
    if(titleEl) titleEl.textContent = showReplace ? "Replace" : "Find";
    replaceRow.style.display = showReplace ? "" : "none";
    btnReplace.style.display = showReplace ? "" : "none";
    btnReplaceAll.style.display = showReplace ? "" : "none";

    // focus
    requestAnimationFrame(() => {
      (showReplace ? replaceInp : findInp).focus();
      (showReplace ? replaceInp : findInp).select();
      scheduleSearch(true);
    });
  }

  function closePanel(){
    panel.classList.remove("open");
    showErr("");
    clearHighlights();
    matches = [];
    curIndex = -1;
    renderCount();
    // restore prior selection if possible
    if(lastOpenSel && typeof restoreSelectionDescriptor === "function"){
      requestAnimationFrame(() => restoreSelectionDescriptor(lastOpenSel));
    }
  }

  // Expose minimal API for menu items / external triggers.
  window.__scriptyFindReplaceOpen = openPanel;
  window.__scriptyFindReplaceClose = closePanel;


  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function buildRegex(){
    const q = findInp.value || "";
    if(!q){
      showErr("");
      return null;
    }

    const useRegex = togRegex.classList.contains("on");
    const matchCase = togCase.classList.contains("on");
    const wholeWord = togWord.classList.contains("on");

    let source = q;
    if(!useRegex) source = escapeRegExp(q);

    if(wholeWord){
      // Keep it simple and predictable (within-line only)
      source = `\\b(?:${source})\\b`;
    }

    const flags = "g" + (matchCase ? "" : "i");
    try{
      showErr("");
      return new RegExp(source, flags);
    }catch(e){
      showErr("Invalid pattern");
      return null;
    }
  }

  function getSearchHosts(){
    // A "host" is where we allow matches to occur (within one logical line / field).
    // We never match across separate lines/fields.
    const hosts = [];
    const lineEls = Array.from(editor.querySelectorAll(".line"));
    for(const lineEl of lineEls){
      const type = (lineEl.dataset.type || "");
      const lineId = lineEl.dataset.id;
      if(!lineId) continue;

      if(type === "dual"){
        const fields = Array.from(lineEl.querySelectorAll(".dualField"));
        for(const f of fields){
          const part = f.dataset.part || "";
          hosts.push({ lineId, part, el: f });
        }
      }else{
        hosts.push({ lineId, part: null, el: lineEl });
      }
    }
    return hosts;
  }

  
  function __findHostTextStream(hostEl){
    // Build a text stream that matches resolveVisualIndexInElement() indexing:
    // - concatenates ONLY text nodes in DOM order
    // - ignores <br> (which would appear as "\n" in textContent/innerText and breaks indexing)
    if(!hostEl) return "";
    let out = "";
    const walker = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
    while(walker.nextNode()){
      const n = walker.currentNode;
      if(n && typeof n.nodeValue === "string") out += n.nodeValue;
    }
    return out;
  }

function computeMatches(){
    clearHighlights();
    matches = [];
    curIndex = -1;

    const re = buildRegex();
    if(!re){
      renderCount();
      return;
    }

    const hosts = getSearchHosts();
    const started = performance.now();

    for(const h of hosts){
      const text = __findHostTextStream(h.el);
      re.lastIndex = 0;

      let m;
      while((m = re.exec(text))){
        const start = m.index;
        const end = start + (m[0] || "").length;
        if(end <= start){
          // Avoid infinite loops on zero-length matches
          re.lastIndex = start + 1;
          continue;
        }
        matches.push({ lineId: h.lineId, part: h.part, start, end });
        if(matches.length >= MAX_MATCHES) break;
        // Basic "too slow" guard
        if(performance.now() - started > 120){
          // Stop scanning if it looks pathological
          break;
        }
      }
      if(matches.length >= MAX_MATCHES) break;
      if(performance.now() - started > 120) break;
    }

    if(matches.length){
      curIndex = 0;
      applyHighlights();
      jumpToCurrent(false);
    }else{
      renderCount();
    }
  }

  function renderCount(){
    const total = matches.length;
    const cur = (total && curIndex >= 0) ? (curIndex + 1) : 0;
    countEl.textContent = `${cur} of ${total}`;
  }

  
  function withHistoryLock(fn){
    // Prevent Find/Replace highlight spans from polluting the script undo history.
    // HISTORY_LOCK is defined by the editor's custom history system.
    const has = (typeof HISTORY_LOCK !== "undefined");
    const prev = has ? HISTORY_LOCK : false;
    try{
      if(has) HISTORY_LOCK = true;
      return fn();
    }finally{
      if(has) HISTORY_LOCK = prev;
    }
  }

function clearHighlights(){
    // unwrap all highlight spans (history-locked so undo snapshots never capture these transient spans)
    withHistoryLock(() => {
      const spans = editor.querySelectorAll("span.findMark, span.findMarkCurrent");
      spans.forEach(sp => {
        const parent = sp.parentNode;
        if(!parent) return;
        while(sp.firstChild) parent.insertBefore(sp.firstChild, sp);
        sp.remove();
        try{ parent.normalize(); }catch(_e){}
      });
    });
  }

  function wrapTextSlice(textNode, start, end, className){
    let node = textNode;
    const len = node.nodeValue.length;
    const s = Math.max(0, Math.min(start, len));
    const e = Math.max(0, Math.min(end, len));
    if(e <= s) return null;

    if(e < len) node.splitText(e);
    if(s > 0) node = node.splitText(s);

    const span = document.createElement("span");
    span.className = className;
    node.parentNode.insertBefore(span, node);
    span.appendChild(node);
    return span;
  }

  function applyHighlights(){
    const selDesc = (typeof getSelectionDescriptor === "function") ? getSelectionDescriptor() : null;

    withHistoryLock(() => {
      // Group matches per host, so we can walk text nodes once per host.
    const byHost = new Map(); // key: lineId|part
    for(let i=0;i<matches.length;i++){
      const m = matches[i];
      const key = `${m.lineId}||${m.part||""}`;
      if(!byHost.has(key)) byHost.set(key, []);
      byHost.get(key).push({ ...m, idx: i });
    }
    for(const list of byHost.values()){
      list.sort((a,b)=>a.start - b.start);
    }

    for(const [key, list] of byHost.entries()){
      const [lineId, part] = key.split("||");
      const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(lineId)}"]`);
      if(!lineEl) continue;

      let hostEl = lineEl;
      if((lineEl.dataset.type||"") === "dual" && part){
        hostEl = lineEl.querySelector(`.dualField[data-part="${CSS.escape(part)}"]`) || lineEl;
      }

      // Walk text nodes and wrap from end->start to keep offsets stable.
      const textNodes = [];
      const walker = document.createTreeWalker(hostEl, NodeFilter.SHOW_TEXT, null);
      while(walker.nextNode()){
        const n = walker.currentNode;
        if(n.nodeValue) textNodes.push(n);
      }

      // Build cumulative offsets for each text node
      const spansToMake = [];
      let acc = 0;
      for(const n of textNodes){
        const start = acc;
        const end = acc + n.nodeValue.length;
        spansToMake.push({ node:n, start, end });
        acc = end;
      }

      // For each match, find the text nodes it intersects and wrap slices
      for(let k=list.length-1;k>=0;k--){
        const mm = list[k];
        const isCur = (mm.idx === curIndex);
        const cls = isCur ? "findMark findMarkCurrent" : "findMark";

        // Find nodes overlapping [mm.start, mm.end)
        for(let t=spansToMake.length-1; t>=0; t--){
          const tn = spansToMake[t];
          if(mm.end <= tn.start) continue;
          if(mm.start >= tn.end) continue;

          const localStart = Math.max(0, mm.start - tn.start);
          const localEnd   = Math.min(tn.end - tn.start, mm.end - tn.start);
          if(localEnd <= localStart) continue;

          // Don't wrap whitespace-only slices (visual noise)
          const sliceStr = tn.node.nodeValue.slice(localStart, localEnd);
          if(!sliceStr || !sliceStr.trim()) continue;

          const sp = wrapTextSlice(tn.node, localStart, localEnd, cls);
          if(sp) sp.dataset.mi = String(mm.idx);
        }
      }
      try{ hostEl.normalize(); }catch(_e){}
    }
    });

    // Restore selection (if it was in script) after wrapping
    if(selDesc && typeof restoreSelectionDescriptor === "function"){
      requestAnimationFrame(() => restoreSelectionDescriptor(selDesc));
    }

    renderCount();
  }

  
  function jumpToCurrent(ensurePanelOpen=true){
    if(ensurePanelOpen && !panel.classList.contains("open")) return;
    if(!matches.length || curIndex < 0) return;

    // Re-apply highlights so current match is distinct
    clearHighlights();
    applyHighlights();

    const m = matches[curIndex];

    // Always scroll to the containing line/field (selection may not be visibly painted while inputs have focus)
    try{
      const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(m.lineId)}"]`);
      let scrollEl = lineEl;
      if(lineEl && m.part){
        const f = lineEl.querySelector(`.dualField[data-part="${CSS.escape(m.part)}"]`);
        if(f) scrollEl = f;
      }
      if(scrollEl && scrollEl.scrollIntoView){
        scrollEl.scrollIntoView({ block:"center", inline:"nearest" });
        // subtle flash to orient the eye
        if(lineEl){
          lineEl.classList.remove("findLineFlash");
          // force reflow so animation retriggers
          void lineEl.offsetWidth;
          lineEl.classList.add("findLineFlash");
          setTimeout(()=>lineEl.classList.remove("findLineFlash"), 650);
        }
      }
    }catch(_e){}

    // Also set an actual DOM selection for replace operations + accessibility
    if(typeof resolveScriptIndex !== "function") return;
    const a = resolveScriptIndex(m.lineId, m.start, m.part || undefined);
    const b = resolveScriptIndex(m.lineId, m.end, m.part || undefined);
    if(!a || !b) return;

    const range = document.createRange();
    range.setStart(a.node, a.offset);
    range.setEnd(b.node, b.offset);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function nextMatch(dir){
    if(!matches.length) return;
    curIndex = (curIndex + dir + matches.length) % matches.length;
    jumpToCurrent();
  }

  function scheduleSearch(force=false){
    if(!panel.classList.contains("open") && !force) return;
    if(searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => computeMatches(), DEBOUNCE_MS);
  }

  function replaceOne(){
    if(!matches.length || curIndex < 0) return;
    const rep = (replaceInp.value ?? "");
    const m = matches[curIndex];
    if(!m) return;

    showErr("");

    // Take an undo snapshot BEFORE we mutate, and ensure the mutation itself doesn't get polluted by highlight spans.
    try{
      if(typeof snapshot === "function") snapshot("find-replace:pre");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace:pre");
    }catch(_e){}

    const lineEl = editor.querySelector(`.line[data-id="${CSS.escape(m.lineId)}"]`);

    // Prefer span-based replacement: the current highlight is the most reliable anchor.
    const curSpan =
      editor.querySelector('span.findMarkCurrent[data-mi="'+curIndex+'"]') ||
      editor.querySelector('span.findMarkCurrent') ||
      editor.querySelector('span.findMark[data-mi="'+curIndex+'"]');

    const doCapFix = () => {
      try{
        if(!lineEl) return;
        const t = (lineEl.dataset.type || "action");
        if(typeof applyTypeCapitalization === "function"){
          applyTypeCapitalization(lineEl, t);
        }
      }catch(_e){}
    };

    const finalize = () => {
      // Ensure no transient spans remain in the DOM when we commit history.
      clearHighlights();

      // Normalize affected host for stable selection + history serialization.
      try{
        let hostEl = lineEl;
        if(lineEl && m.part){
          const f = lineEl.querySelector(`.dualField[data-part="${CSS.escape(m.part)}"]`);
          if(f) hostEl = f;
        }
        if(hostEl && hostEl.normalize) hostEl.normalize();
      }catch(_e2){}

      doCapFix();

      try{
        if(typeof normalizeEditorStructure === "function") normalizeEditorStructure();
        if(typeof paginate === "function") paginate();
      }catch(_e3){}

      // Commit an undo snapshot AFTER the change, while the DOM is clean (no highlights).
      try{
        if(typeof snapshot === "function") snapshot("find-replace");
        else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace");
      }catch(_e4){}

      // Re-run search/highlights on next frame (history-locked inside highlight ops).
      requestAnimationFrame(() => {
        computeMatches();
        if(matches.length){
          // Move to next match after replace.
          curIndex = Math.min(curIndex, matches.length-1);
          nextMatch(+1);
        }
      });
    };

    if(curSpan){
      // Replace text inside wrapper.
      try{
        if(curSpan.firstChild && curSpan.firstChild.nodeType === 3){
          curSpan.firstChild.nodeValue = rep;
        }else{
          curSpan.textContent = rep;
        }
      }catch(_e){}
      finalize();
      return;
    }

    // Fallback: Range-based replacement via resolved indices.
    try{
      const a = resolveScriptIndex(m.lineId, m.start, m.part || undefined);
      const b = resolveScriptIndex(m.lineId, m.end, m.part || undefined);
      if(!a || !b) return;

      const r = document.createRange();
      r.setStart(a.node, a.offset);
      r.setEnd(b.node, b.offset);

      r.deleteContents();
      r.insertNode(document.createTextNode(rep));
    }catch(_e){}

    finalize();
  }


  function replaceAll(){
    if(!matches.length) return;
    const rep = (replaceInp.value ?? "");
    const total = matches.length;

    showErr("");

    // Snapshot pre-change.
    try{
      if(typeof snapshot === "function") snapshot("find-replace-all:pre");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace-all:pre");
    }catch(_e){}

    // Ensure highlights exist so we can operate span-by-span (most reliable).
    clearHighlights();
    computeMatches();
    if(!matches.length){
      showErr("0 matches.");
      return;
    }

    // Apply highlights so each match is wrapped.
    clearHighlights();
    applyHighlights();

    // Replace from end -> start to avoid any DOM shifting concerns.
    const spans = Array.from(editor.querySelectorAll("span.findMark, span.findMarkCurrent"));
    const touchedLines = new Set();

    for(let i=spans.length-1;i>=0;i--){
      const sp = spans[i];
      if(!sp) continue;

      // Track affected lines for capitalization re-apply (scene/character/transition)
      try{
        const ln = sp.closest(".line");
        if(ln && ln.dataset && ln.dataset.id) touchedLines.add(ln.dataset.id);
      }catch(_e){}

      try{
        if(sp.firstChild && sp.firstChild.nodeType === 3){
          sp.firstChild.nodeValue = rep;
        }else{
          sp.textContent = rep;
        }
      }catch(_e2){}
    }

    // Cleanup highlights and normalize.
    clearHighlights();
    try{ editor.normalize(); }catch(_e3){}

    // Re-apply capitalization rules for affected lines (important for Scene Headings).
    try{
      if(typeof applyTypeCapitalization === "function"){
        for(const id of touchedLines){
          const ln = editor.querySelector(`.line[data-id="${CSS.escape(id)}"]`);
          if(!ln) continue;
          applyTypeCapitalization(ln, (ln.dataset.type || "action"));
        }
      }
    }catch(_e4){}

    try{
      if(typeof normalizeEditorStructure === "function") normalizeEditorStructure();
      if(typeof paginate === "function") paginate();
    }catch(_e5){}

    // Snapshot post-change (DOM clean, no highlights).
    try{
      if(typeof snapshot === "function") snapshot("find-replace-all");
      else if(typeof scheduleSnapshot === "function") scheduleSnapshot("find-replace-all");
    }catch(_e6){}

    requestAnimationFrame(() => {
      computeMatches();
      showErr(`Replaced ${total} occurrence${total===1?"":"s"}.`);
      setTimeout(()=>{ if(panel.classList.contains("open")) showErr(""); }, 1200);
    });
  }


  // ---------- UI events ----------
  findInp.addEventListener("input", () => scheduleSearch());
  replaceInp.addEventListener("input", () => { /* no-op */ });

  [togCase, togWord, togRegex].forEach(btn=>{
    btn.addEventListener("click", () => {
      setToggle(btn, !btn.classList.contains("on"));
      scheduleSearch(true);
    });
  });

  btnPrev.addEventListener("click", () => nextMatch(-1));
  btnNext.addEventListener("click", () => nextMatch(+1));
  btnReplace.addEventListener("click", () => replaceOne());
  btnReplaceAll.addEventListener("click", () => replaceAll());
  btnClose.addEventListener("click", () => closePanel());

  // Enter behavior
  findInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      if(e.shiftKey) nextMatch(-1);
      else nextMatch(+1);
    }else if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  });

  replaceInp.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      replaceOne();
    }else if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  });

  // Close on Esc from anywhere while panel open
  document.addEventListener("keydown", (e) => {
    if(!panel.classList.contains("open")) return;
    if(e.key === "Escape"){
      e.preventDefault();
      closePanel();
    }
  }, true);

  // Keyboard open hooks (capture early so browser Find doesn't steal it)
  document.addEventListener("keydown", (e) => {
    const isMac = navigator.platform.toLowerCase().includes("mac");
    const mod = isMac ? e.metaKey : e.ctrlKey;

    if(!mod) return;
    const key = (e.key || "").toLowerCase();

    if(key === "f"){
      if(!inScriptFocus()) return;
      e.preventDefault();
      openPanel("find");
    }else if(key === "h"){
      if(!inScriptFocus()) return;
      e.preventDefault();
      openPanel("replace");
    }
  }, true);

  // If user edits script while search panel is open, remove highlights and re-scan shortly.
  editor.addEventListener("input", () => {
    if(!panel.classList.contains("open")) return;
    // Prevent highlights from "sticking" across edits (ephemeral requirement)
    clearHighlights();
    scheduleSearch(true);
  });

  editor.addEventListener("blur", () => {
    if(!panel.classList.contains("open")) return;
    // Keep highlights while the panel is open (focus moves to inputs).
    // Clearing here breaks Replace/Replace All because the active match wrapper disappears.
  }, true);
})();
</script>

<div id="bootLoader" aria-hidden="true">
  <div class="bootBox" role="status" aria-live="polite">
    <div class="bootRow">
      <div class="bootSpinner"></div>
      <div class="bootText" id="bootLoaderText">Loading script…</div>
    </div>
  </div>
</div>

</body>
