  function _isCommitEvent(ev){
    const inputType = ev && ev.inputType ? ev.inputType : "";
    const data = (ev && typeof ev.data === "string") ? ev.data : "";

    if(inputType === "insertParagraph") return true;

    // Space / punctuation -> word committed
    if(data && __SPELLCHECK_BOUNDARY_CHARS.has(data)) return true;

    // Pasting / drop / replacement / transpose: treat as commit so marks settle quickly

          try{ normalizeEditorStructure(); }catch(_e){}
          try{ paginate(); }catch(_e){}

    // Home/End (best effort: go to start/end of current line's text)

  // Autocorrect boundary detection: mark boundary inputs here,

function normalizePastedText(text){
  let t = (text || "").replace(/\r/g, "");
  // Normalize common invisible/spacing characters
  t = t.replace(/\u00A0/g, " ");            // NBSP -> space
  t = t.replace(/[\u200B\u200C\u200D\uFEFF]/g, ""); // zero-width chars
  // Normalize smart quotes and apostrophes
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'");
  t = t.replace(/[\u201C\u201D\u201E\u2033]/g, '"');
  // Normalize dashes
  t = t.replace(/[\u2013\u2014]/g, "-");
  // Normalize line endings and trim trailing spaces per line (keeps leading spaces if user wants them)
  t = t.split("\n").map(line => line.replace(/[ \t]+$/g, "")).join("\n");
  return t;
}


// ---------- Rich Paste (keep structure + inline formatting) ----------
function cssPxToNumber(v){
  if(!v) return 0;
  const m = String(v).match(/(-?\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function fmtFromAncestors(el){
  const fmt = { b:false,i:false,u:false,s:false,c:false };
  let n = el;
  while(n && n.nodeType===1){
    const tag = n.tagName;
    if(tag==="B" || tag==="STRONG") fmt.b = true;
    if(tag==="I" || tag==="EM") fmt.i = true;
    if(tag==="U") fmt.u = true;
    if(tag==="S" || tag==="STRIKE") fmt.s = true;

    const st = n.getAttribute && n.getAttribute("style");
    if(st){
      const low = st.toLowerCase();
      if(low.includes("font-weight") && low.match(/font-weight\s*:\s*(bold|[6-9]\d\d)/)) fmt.b = true;
      if(low.includes("font-style") && low.match(/font-style\s*:\s*italic/)) fmt.i = true;
      if(low.includes("text-decoration") && low.match(/underline/)) fmt.u = true;
      if(low.includes("text-decoration") && low.match(/line-through/)) fmt.s = true;
      if(low.includes("text-transform") && low.match(/uppercase/)) fmt.c = true;
    }
    if(n.dataset && n.dataset.caps==="1") fmt.c = true;
    n = n.parentElement;
  }
  return fmt;
}

function collectRunsFromHTMLBlock(blockEl){
  // Returns runs with '\n' included where <br> appears, so caller can split into multiple lines.
  const runs = [];
  const push = (t, fmt) => {
    if(t === "") return;
    const last = runs[runs.length-1];
    const r = { t, b:!!fmt.b, i:!!fmt.i, u:!!fmt.u, s:!!fmt.s, c:!!fmt.c };
    if(last && last.b===r.b && last.i===r.i && last.u===r.u && last.s===r.s && last.c===r.c){
      last.t += r.t;
    } else runs.push(r);
  };

  function walk(node){
    if(node.nodeType === 3){
      const text = node.nodeValue || "";
      if(text) push(text, fmtFromAncestors(node.parentElement));
      return;
    }
    if(node.nodeType !== 1) return;
    const el = node;
    if(el.tagName === "BR"){
      push("\n", {b:false,i:false,u:false,s:false,c:false});
      return;
    }
    // Treat <p>/<div> nested blocks as inline within this block (we already split blocks outside).
    for(const child of Array.from(el.childNodes)) walk(child);
    // Some editors use <span style="white-space:pre"> etc. We rely on text nodes.
  }
  walk(blockEl);

  if(runs.length===0) runs.push({t:"",b:false,i:false,u:false,s:false,c:false});
  return runs;
}

function splitRunsOnNewlines(runs){
  const lines = [];
  let cur = [];
  const flush = () => {
    if(cur.length===0) cur = [{t:"",b:false,i:false,u:false,s:false,c:false}];
    // Remove any literal \n from runs
    cur = cur.map(r => ({...r, t:(r.t||"").replace(/\n/g,"")}));
    lines.push(cur);
    cur = [];
  };

  for(const r of runs){
    const t = r.t || "";
    if(!t.includes("\n")){
      cur.push({...r});
      continue;
    }
    const parts = t.split("\n");
    for(let i=0;i<parts.length;i++){
      const part = parts[i];
      if(part){
        cur.push({...r, t: part});
      }
      if(i !== parts.length-1){
        flush();
      }
    }
  }
  flush();
  return lines;
}

function classifyByHeuristics(text, prevType){
  const t = (text||"").replace(/\s+$/,"");
  const s = t.trim();
  if(s === "") return "action";
  if(lineLooksLikeSceneHeading(s)) return "scene";
  if(looksLikeTransition(s)) return "transition";
  if(/^\(.+\)$/.test(s)) return "parenthetical";
  // PDF/clipboard plain text often loses the blank-line cue before character.
  // Use a looser character detector as a fallback.
  if(looksLikeCharacter(s, null) || looksLikeCharacterLoose(s)) return "character";
  // Dialogue inference
  if(prevType==="character" || prevType==="parenthetical" || prevType==="dialogue"){
    // Do NOT keep consuming action lines as dialogue when PDF paste has no blank line.
    // Break out of dialogue mode when the next line looks like third-person narration.
    if(looksLikeNarrationAction(s)) return "action";
    return "dialogue";
  }
  return "action";
}

function looksLikeCharacterLoose(s){
  const t = (s||"").trim();
  if(!t) return false;
  if(lineLooksLikeSceneHeading(t)) return false;
  if(looksLikeTransition(t)) return false;
  if(/^\(.+\)$/.test(t)) return false;
  // Keep it conservative.
  if(t.length > 35) return false;
  // Allow a single parenthetical suffix like (V.O.)/(O.S.)/(CONT'D)
  // IMPORTANT: do the punctuation check *after* removing the suffix,
  // because (V.O.) contains periods that would otherwise incorrectly disqualify the line.
  const base = t.replace(/\s*\((V\.O\.|O\.S\.|CONT'D|CONT\.?D)\)\s*$/i, "").trim();
  if(!base) return false;
  // Now disqualify punctuation in the *name* part only.
  if(/[\.:,;!?]/.test(base)) return false;
  // Mostly uppercase letters, allow spaces and apostrophes.
  if(!isMostlyUpper(base)) return false;
  // Word count limit
  const wc = base.split(/\s+/).filter(Boolean).length;
  if(wc > 4) return false;
  return true;
}

// Rich-paste helper: Character cues are usually short, mostly-uppercase lines.
// This is intentionally conservative to avoid misclassifying ALL CAPS action.
function lineLooksLikeCharacterName(t){
  return looksLikeCharacterLoose(t);
}


function looksLikeNarrationAction(s){
  const t = (s||"").trim();
  if(!t) return false;

  // Strong cue: starts with third-person / scene-description determiners.
  // Common screenplay action openings that should NOT be treated as dialogue.
  if(/^(Her|His|Their|She|He|They|The|A|An|It|Outside|Inside|In\b|On\b|At\b|With\b)\b/.test(t)) return true;

  // Score-based cue: dialogue leans 1st/2nd person; action leans 3rd person.
  const lower = t.toLowerCase();
  const dialogueHits = (lower.match(/\b(i|i'm|ive|i've|id|i'd|me|my|mine|we|we're|weve|we've|our|ours|you|you're|youre|you've|youve|your|yours)\b/g) || []).length;
  const actionHits   = (lower.match(/\b(he|she|they|their|them|his|her|hers|him|its|it’s|it)\b/g) || []).length;

  // If it's clearly 3rd-person narration (and not clearly dialogue), treat as action.
  if(actionHits >= 2 && actionHits >= dialogueHits + 1) return true;

  // Another cue: action often has descriptive clauses and commas.
  if(actionHits >= 1 && /[,;]/.test(t) && dialogueHits === 0) return true;

  return false;
}




function lineLooksLikeSceneHeading(t){
  const s = (t||"").trim();
  // allow optional leading numbering like "1 " from certain PDF pastes
  const s2 = s.replace(/^\d+\s+/, "");
  return looksLikeSceneHeading(s2);
}

function runsLineStartsWithBoldSlug(runsLine){
  if(!runsLine || !runsLine.length) return false;
  // Find first non-space char and see if it's in a bold run
  let idx = 0;
  for(const r of runsLine){
    const t = (r.t || "");
    let j = 0;
    while(j < t.length && /\s/.test(t[j])) j++;
    if(j < t.length){
      // first visible char is in this run
      if(!r.b) return false;
      const full = runsLine.map(x=>x.t||"").join("");
      return lineLooksLikeSceneHeading(full);
    }
    idx += t.length;
  }
  return false;
}

function ensureBlankAfterScene(lines){
  const out = [];
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    out.push(ln);
    if(ln.type === "scene"){
      const next = lines[i+1];
      if(next){
        const nextBlank = (next.runs||[]).every(r => (r.t||"").trim()==="");
        if(!nextBlank){
          out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
        }
      }
    }
  }
  // Coalesce multiple blanks
  const cleaned = [];
  for(const ln of out){
    const isBlank = (ln.runs||[]).every(r => (r.t||"").trim()==="");
    if(isBlank && cleaned.length){
      const prevBlank = (cleaned[cleaned.length-1].runs||[]).every(r => (r.t||"").trim()==="");
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  return cleaned;
}

function ensureBlankAfterDialogueBlock(lines){
  // Insert a single blank line after a dialogue block (dialogue + optional parentheticals)
  // when the next non-blank line is a different block type.
  const out = [];
  const isBlank = (ln) => (ln.runs||[]).every(r => (r.t||"").trim()==="");
  const isDialogueFamily = (t) => (t === "dialogue" || t === "parenthetical");

  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    out.push(ln);

    if(!isDialogueFamily(ln.type)) continue;

    // Find the next line (immediate) and decide if we're ending a dialogue block.
    const next = lines[i+1];
    if(!next) continue;
    if(isBlank(next)) continue; // already has gap

    // If next is still dialogue/parenthetical, we're in the same block.
    if(isDialogueFamily(next.type)) continue;

    // If current line is dialogue-family and the next is a new block, insert one blank.
    out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
  }

  // Coalesce multiple blanks
  const cleaned = [];
  for(const ln of out){
    const blank = isBlank(ln);
    if(blank && cleaned.length){
      const prevBlank = isBlank(cleaned[cleaned.length-1]);
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  return cleaned;
}


function detectTypeFromHTMLBlock(blockEl, text, prevType){
  const cls = (blockEl.getAttribute("class") || "").toLowerCase();
  const style = (blockEl.getAttribute("style") || "").toLowerCase();

  const has = (re) => re.test(cls) || re.test(style);

  if(has(/scene|slug|heading/)) return "scene";
  if(has(/character/)) return "character";
  if(has(/dialogue/)) return "dialogue";
  if(has(/paren/)) return "parenthetical";
  if(has(/transition/)) return "transition";
  if(has(/action/)) return "action";

  // Indent heuristic via inline styles (common in HTML exports)
  const ml = cssPxToNumber((style.match(/margin-left\s*:\s*([^;]+)/)||[])[1]);
  const ti = cssPxToNumber((style.match(/text-indent\s*:\s*([^;]+)/)||[])[1]);
  const pl = cssPxToNumber((style.match(/padding-left\s*:\s*([^;]+)/)||[])[1]);
  const indent = Math.max(ml, pl) + Math.max(0, ti);

  // Rough thresholds (px) – tuned for typical 96dpi exports
  // Character ~ 3.0-3.7in from left -> >= 230px common
  if(indent >= 210 && isMostlyUpper((text||"").trim())) return "character";
  // Dialogue often around 2.0-2.5in -> 140-190px
  if(indent >= 130 && indent < 210){
    const s = (text||"").trim();
    if(/^\(.+\)$/.test(s)) return "parenthetical";
    if(prevType==="character" || prevType==="parenthetical") return "dialogue";
    // If it looks like character, still treat as character
    if(isMostlyUpper(s) && s.length<=35 && !/[:\.\,\;\?\!]/.test(s)) return "character";
    return "dialogue";
  }

  return classifyByHeuristics(text, prevType);
}

function parseClipboardHTMLToLines(htmlText){
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, "text/html");
  const body = doc.body;

  // Prefer paragraphs/divs; fall back to body child nodes
  const blocks = Array.from(body.querySelectorAll("p, div, li")).filter(el => {
    // Ignore container divs that only contain other blocks
    if(el.tagName==="DIV" && el.querySelector("p,div,li") && (el.innerText||"").trim()==="") return false;
    return true;
  });
  const useBlocks = blocks.length ? blocks : Array.from(body.childNodes).filter(n => n.nodeType===1);

  const out = [];
  let prevType = "action";

  for(const block of useBlocks){
    const rawText = (block.innerText || block.textContent || "").replace(/\r/g,"");
    // Keep intentional blank lines: if a block is empty, we insert a blank action line.
    if(rawText.trim()===""){
      out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
      prevType = "action";
      continue;
    }

    const runs = collectRunsFromHTMLBlock(block);
    const runLines = splitRunsOnNewlines(runs);

    for(const rl of runLines){
      const text = rl.map(r=>r.t||"").join("");
      let type = detectTypeFromHTMLBlock(block, text, prevType);
      // If the line starts with a bolded INT/EXT slug (common in PDF/FD pastes), force SCENE.
      if(runsLineStartsWithBoldSlug(rl)) type = "scene";

      // Character + dialogue recognition for rich pastes:
      // - A mostly-uppercase short line like "MOTHER (V.O.)" should be CHARACTER.
      // - Lines immediately following a CHARACTER/PARENTHETICAL should be DIALOGUE until a blank/new block.
      const tTrim = (text||"").trim();
      if(type !== "scene" && type !== "transition" && type !== "parenthetical"){
        if(lineLooksLikeCharacterName(tTrim)) type = "character";
      }
      if((prevType === "character" || prevType === "parenthetical") && type === "action" && tTrim){
        if(!lineLooksLikeSceneHeading(tTrim) && !looksLikeTransition(tTrim) && !lineLooksLikeCharacterName(tTrim)){
          if(!looksLikeNarrationAction(tTrim)) type = "dialogue";
        }
      }

      out.push({ type, runs: rl });
      prevType = type;
    }
  }

  // Coalesce consecutive blanks to a single blank line (Word/FD-ish)
  const cleaned = [];
  for(const ln of out){
    const isBlank = ln.runs.every(r => (r.t||"").trim()==="");
    if(isBlank && cleaned.length){
      const prevBlank = cleaned[cleaned.length-1].runs.every(r => (r.t||"").trim()==="");
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  const post = looksHardWrappedLines(cleaned) ? reflowWrappedPlainPaste(cleaned) : cleaned;
  return ensureBlankAfterDialogueBlock(ensureBlankAfterScene(post));
}


function expandFlatScreenplayText(t){
  // Some external sources (certain PDF viewers, some web apps) put the entire page on the clipboard
  // as one giant paragraph with minimal/newline loss. Try to reconstruct likely screenplay breaks.
  const raw = (t || "");
  const nlCount = (raw.match(/\n/g) || []).length;
  if(nlCount >= 3) return raw;

  const longEnough = raw.length >= 140;
  const hasSlug = /\b(?:INT\.|EXT\.|INT\/EXT\.|I\/E\.|EST\.)\b/i.test(raw);
  const hasTo = /\b[A-Z ]{3,40}TO:\b/.test(raw) || /\b(?:CUT TO:|DISSOLVE TO:|SMASH CUT TO:|MATCH CUT TO:|FADE OUT\.|FADE TO BLACK\.)\b/.test(raw);
  if(!longEnough || (!hasSlug && !hasTo)) return raw;

  let s = raw;

  // Normalize weird spacing that can hide boundaries.
  s = s.replace(/\s{3,}/g, "  ");

  // Insert breaks before sluglines.
  s = s.replace(/(\s)(?=(?:INT\.|EXT\.|INT\/EXT\.|I\/E\.|EST\.)\s)/gi, "\n");

  // Insert breaks before common transitions / any ALLCAPS phrase ending with TO:
  s = s.replace(/(\s)(?=(?:CUT TO:|DISSOLVE TO:|SMASH CUT TO:|MATCH CUT TO:|WIPE TO:|FADE OUT\.|FADE TO BLACK\.)\b)/g, "\n");
  s = s.replace(/(\s)(?=[A-Z][A-Z \.\-]{2,40}TO:\b)/g, "\n");

  // Insert breaks before parentheticals when they look like their own beat.
  s = s.replace(/(\s)(?=\([^\)\n]{2,60}\)\s)/g, "\n");

  // Light character cue detection: break before short ALL CAPS tokens followed by two spaces or a quote/dash.
  // This is intentionally conservative to avoid chopping ACTION lines.
  s = s.replace(/(\s)(?=[A-Z][A-Z0-9 \.\'\-\(\)]{1,28}(?:\s{2,}|\s*[\u2014\-]))/g, "\n");

  // Clean up: collapse multiple newlines and trim.
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}


function looksHardWrappedLines(lines){
  // Heuristic: detect PDF-style hard-wrapped paragraphs (newline at every visual wrap).
  // We only attempt this when there are no intentional blank lines.
  if(!lines || lines.length < 3) return false;
  const blankCount = lines.filter(ln => (ln.runs||[]).every(r => (r.t||"").trim()==="")).length;
  if(blankCount > 0) return false;

  // Ignore if there are many explicit screenplay blocks (scene/transition/character) in the chunk.
  const nonBody = lines.filter(ln => ["scene","transition","character","parenthetical"].includes(ln.type)).length;
  if(nonBody >= Math.max(2, Math.floor(lines.length/3))) return false;

  const texts = lines.map(ln => (ln.runs||[]).map(r=>r.t||"").join("").trim()).filter(Boolean);
  if(texts.length < 3) return false;

  const avgLen = texts.reduce((a,s)=>a+s.length,0)/texts.length;
  const shortProp = texts.filter(s => s.length > 0 && s.length < 75).length / texts.length;

  const noTerminalProp = texts.filter(s => !/[\.!\?:…"\)]\s*$/.test(s)).length / texts.length;
  const nextStartsLowerProp = texts.slice(1).filter(s => /^[a-z(]/.test(s)).length / Math.max(1, texts.length-1);

  // Typical hard-wrap: many short lines, most lines don't end with terminal punctuation,
  // and many subsequent lines start lowercase/paren.
  if(shortProp >= 0.55 && (noTerminalProp >= 0.55 || nextStartsLowerProp >= 0.45) && avgLen < 90) return true;

  return false;
}

function parsePlainScreenplayTextToLines(text){
  let t = normalizePastedText(text||"");
  t = expandFlatScreenplayText(t);
  const rawLines = t.split("\n");

  const out = [];
  let prevType = "action";

  for(const raw of rawLines){
    const line = raw.replace(/\r/g,"");
    if(line.trim()===""){
      out.push({ type:"action", runs:[{t:"",b:false,i:false,u:false,s:false,c:false}] });
      prevType = "action";
      continue;
    }

    const type = classifyByHeuristics(line, prevType);
    out.push({ type, runs:[{t:line,b:false,i:false,u:false,s:false,c:false}] });

    // Dialogue chaining: once character occurs, next non-blank becomes dialogue until blank / scene / transition / new character
    if(type==="scene" || type==="transition" || type==="action") prevType = type;
    else prevType = type;
  }

  // Reduce accidental multiple blanks
  const cleaned = [];
  for(const ln of out){
    const isBlank = ln.runs.every(r => (r.t||"").trim()==="");
    if(isBlank && cleaned.length){
      const prevBlank = cleaned[cleaned.length-1].runs.every(r => (r.t||"").trim()==="");
      if(prevBlank) continue;
    }
    cleaned.push(ln);
  }
  // PDF copy/paste often hard-wraps every visual line and strips blank lines/indent.
  // Try to reflow wrapped lines back into paragraphs within the same block.
  const shouldReflow = looksHardWrappedLines(cleaned);
  const post = shouldReflow ? reflowWrappedPlainPaste(cleaned) : cleaned;
  return ensureBlankAfterDialogueBlock(ensureBlankAfterScene(post));
}

function reflowWrappedPlainPaste(lines){
  const out = [];
  const endsSentence = (s) => /[\.\!\?\:]\s*$/.test(s);
  const startsLower = (s) => /^[a-z]/.test((s||"").trim());
  const startsParen = (s) => /^\(/.test((s||"").trim());

  // Heuristic: identify action/narration lines that often follow dialogue without an empty line
  // after PDF paste (e.g., "Her son paws at her leg...", "She crosses...", "The door..." etc.).
  // We use this to avoid "sucking" action into dialogue mode.
  const looksLikeActionNarration = (s) => {
    const t = (s||"").trim();
    if(!t) return false;
    // Sentence case, with lowercase present.
    if(!/^[A-Z]/.test(t) || !/[a-z]/.test(t)) return false;
    // Common narration starters.
    const starters = /^(Her|His|Their|She|He|They|The|A|An|Outside|Inside|In|On|At|Across|Behind|Above|Below)\b/;
    if(!starters.test(t)) return false;
    // Longer and clausey tends to be action, not dialogue.
    if(t.length < 24) return false;
    // Often contains punctuation typical of action prose.
    if(!/[\,\.\;\:—\-]/.test(t)) return false;
    return true;
  };

  for(let i=0;i<lines.length;i++){
    const cur = lines[i];
    const curText = (cur.runs||[]).map(r=>r.t||"").join("");
    const next = lines[i+1];
    const nextText = next ? (next.runs||[]).map(r=>r.t||"").join("") : "";

    // Always keep scene/transition/character as standalone paragraphs.
    if(cur.type === "scene" || cur.type === "transition" || cur.type === "character" || cur.type === "parenthetical"){
      out.push(cur);
      continue;
    }

    // Attempt to merge action/dialogue hard-wrapped lines.
    if((cur.type === "action" || cur.type === "dialogue") && next && next.type === cur.type){
      // If current line likely continues (no terminal punctuation) OR next starts lowercase, merge.
      if(!endsSentence(curText) || startsLower(nextText)){
        // Merge by appending a space + nextText (preserve original as unformatted run)
        const mergedText = (curText.trimEnd() + " " + nextText.trimStart()).replace(/\s+/g, " ");
        // Replace current, skip next
        lines[i+1] = { ...next, type: cur.type, runs:[{t: mergedText,b:false,i:false,u:false,s:false,c:false}] };
        // Don't push current yet; it has been merged into next slot.
        continue;
      }
    }

    // Dialogue often continues across multiple hard-wrapped lines even if next is misclassified as action.
    if(cur.type === "dialogue" && next && next.type === "action" && (startsLower(nextText) || startsParen(nextText))){
      const mergedText = (curText.trimEnd() + " " + nextText.trimStart()).replace(/\s+/g, " ");
      lines[i+1] = { ...next, type: "dialogue", runs:[{t: mergedText,b:false,i:false,u:false,s:false,c:false}] };
      continue;
    }

    out.push(cur);
  }

  // Second pass: rebuild dialogue chaining when characters are detected in a PDF-like paste.
  const chained = [];
  let mode = "action";
  for(const ln of out){
    const txt = (ln.runs||[]).map(r=>r.t||"").join("").trim();
    if(ln.type === "scene" || ln.type === "transition"){
      mode = "action";
      chained.push(ln);
      continue;
    }
    if(ln.type === "character"){
      mode = "dialogue";
      chained.push(ln);
      continue;
    }
    if(ln.type === "parenthetical"){
      mode = "dialogue";
      chained.push(ln);
      continue;
    }
    if(mode === "dialogue" && ln.type === "action" && txt){
      // If we're in dialogue mode, only chain into dialogue when it doesn't look like narration.
      // This prevents action paragraphs after dialogue from being mis-typed when PDF paste
      // removes the separating blank line.
      if(looksLikeActionNarration(txt)){
        mode = "action";
        chained.push(ln);
      } else {
        chained.push({ ...ln, type: "dialogue" });
      }
      continue;
    }
    // Reset mode on blank or clear action paragraphs.
    if(!txt) mode = "action";
    chained.push(ln);
  }

  return chained;
}

function pasteLinesModelAtCaret(lines){
  if(!lines || !lines.length) return;

  scheduleSnapshot("paste-rich");
  deleteSelectionWordlike();

  const editor = $("#scriptEditor");
  const sel = window.getSelection();
  if(!editor || !sel || sel.rangeCount===0) return;
  let r = sel.getRangeAt(0);

  // Robustness: after Cmd/Ctrl+A (or other broad selections), the browser range can be anchored
  // on the editor root instead of inside a .line. Final Draft/Word still allow paste-replace.
  let line = getActiveLine();
  if(!line){
    line = editor.querySelector(".line") || null;
    if(!line){
      const nl = makeLine("action", [{t:"",b:false,i:false,u:false,s:false,c:false}]);
      editor.innerHTML = "";
      editor.appendChild(nl);
      line = nl;
    }
    // Place caret at the start of this fallback line so locateScriptIndex works.
    try{ placeCaretAtLineIndex(line.dataset.id, 0); }catch(_e){}
    r = (sel && sel.rangeCount) ? sel.getRangeAt(0) : r;
  }


  const touched = [line];
  const loc = locateScriptIndex(r.startContainer, r.startOffset);
  const splitIdx = loc ? loc.index : getLineTextLength(line);

  const baseRuns = lineRunsFromDOM(line);
  const [leftRuns, rightRuns] = splitRuns(baseRuns, splitIdx);

  // Apply first line into current line
  const first = lines[0];
  if(first && first.type) line.dataset.type = first.type;

  const mergedFirst = mergeRuns(leftRuns, first.runs || [{t:"",b:false,i:false,u:false,s:false,c:false}]);
  line.innerHTML = "";
  line.appendChild(renderRuns(mergedFirst));

  let insertAfter = line;

  // Middle lines become new lines
  for(let i=1;i<lines.length;i++){
    const item = lines[i];
    const isLast = (i === lines.length-1);
    const runs = item.runs || [{t:"",b:false,i:false,u:false,s:false,c:false}];

    if(isLast){
      // Last line gets the rightRuns appended
      const finalRuns = mergeRuns(runs, rightRuns);
      const endLine = makeLine(item.type || (line.dataset.type||"action"), finalRuns);
      insertAfter.parentElement.insertBefore(endLine, insertAfter.nextSibling);
      insertAfter = endLine;

      touched.push(endLine);
      // Caret at end of pasted content (before rightRuns)
      const pastedLen = runsTextLength(runs);
      placeCaretAtLineIndex(endLine.dataset.id, pastedLen);
    } else {
      const nl = makeLine(item.type || (line.dataset.type||"action"), runs);
      insertAfter.parentElement.insertBefore(nl, insertAfter.nextSibling);
      insertAfter = nl;
      touched.push(nl);
    }
  }

  // If only one line pasted, caret should end at end of inserted content within current line
  if(lines.length === 1){
    const pastedLen = runsTextLength(first.runs || []);
    placeCaretAtLineIndex(line.dataset.id, splitIdx + pastedLen);
  }

  // Enforce screenplay boundary spacing (e.g., blank line before CHARACTER, around SCENE).
  for(const ln of touched){
    try{ _applyBoundarySpacing(ln); }catch(_e){}
  }

  normalizeEditorStructure();
  paginate();
}

$("#scriptEditor").addEventListener("paste", (e) => {

// Title page placeholder integrity + native undo (Final Draft-style)
// IMPORTANT: Do NOT stomp titleField.textContent on every keystroke — that clears the browser's native undo stack.
// We only "normalize" anchors when necessary, and we prefer undoable edit operations (execCommand) while focused.
const __TITLE_IDS = ["tp_title","tp_writtenby","tp_name","tp_contact"];


  // Title page history (Word-like undo granularity)
  // Native browser undo inside contenteditable can coalesce large chunks. For the title page fields,
  // we snapshot *pre-change* state via beforeinput (capture) and restore it ourselves, which feels
  // closer to Word/Final Draft (smaller, predictable undo steps).
  const __TITLE_HISTORY = new WeakMap();
  const __TITLE_HISTORY_LIMIT = 250;
  let __TITLE_HISTORY_RESTORING = false;

  function __initTitleHistory(el){
    if(!el) return;
    if(__TITLE_HISTORY.has(el)) return;
    __TITLE_HISTORY.set(el, { undo: [], redo: [], composing: false, compStart: null });
  }

  function __titleGetSelectionOffsets(el){
    try{
      const sel = window.getSelection();
      if(!sel || !sel.rangeCount) return {start:0,end:0};
      const r = sel.getRangeAt(0);
      if(!el.contains(r.commonAncestorContainer)) return {start:0,end:0};

      const pre = r.cloneRange();
      pre.selectNodeContents(el);
      pre.setEnd(r.startContainer, r.startOffset);
      const start = pre.toString().length;

      const pre2 = r.cloneRange();
      pre2.selectNodeContents(el);
      pre2.setEnd(r.endContainer, r.endOffset);
      const end = pre2.toString().length;

      return { start, end };
    }catch(_e){
      return {start:0,end:0};
    }
  }

  function __titleSnapshot(el){
    const off = __titleGetSelectionOffsets(el);
    return { text: String(el.textContent || ""), start: off.start, end: off.end };
  }

  function __titleSetSelectionOffsets(el, start, end){
    try{
      if(!el) return;
      const txt = String(el.textContent || "");
      const s = Math.max(0, Math.min(start, txt.length));
      const e = Math.max(0, Math.min(end,   txt.length));
      const a = Math.min(s,e), b = Math.max(s,e);

      // Ensure a text node exists.
      if(!el.firstChild || el.firstChild.nodeType !== 3){
        el.textContent = txt.length ? txt : "\u00A0";
      }

      const locate = (pos) => {
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
        let node = null;
        let remaining = pos;
        while((node = walker.nextNode())){
          const len = (node.nodeValue || "").length;
          if(remaining <= len) return { node, offset: remaining };
          remaining -= len;
        }
        const last = (el.lastChild && el.lastChild.nodeType===3) ? el.lastChild : el.firstChild;
        const llen = last && last.nodeValue ? last.nodeValue.length : 0;
        return { node: last, offset: llen };
      };

      const p1 = locate(a);
      const p2 = locate(b);

      const r = document.createRange();
      r.setStart(p1.node, p1.offset);
      r.setEnd(p2.node, p2.offset);

      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }catch(_e){}
  }

  function __titlePushUndo(el){
    try{
      __initTitleHistory(el);
      const h = __TITLE_HISTORY.get(el);
      if(!h) return;
      const snap = __titleSnapshot(el);
      const last = h.undo.length ? h.undo[h.undo.length-1] : null;
      if(last && last.text === snap.text && last.start === snap.start && last.end === snap.end) return;
      h.undo.push(snap);
      if(h.undo.length > __TITLE_HISTORY_LIMIT) h.undo.shift();
    }catch(_e){}
  }

  function __titleClearRedo(el){
    try{
      const h = __TITLE_HISTORY.get(el);
      if(h) h.redo.length = 0;
    }catch(_e){}
  }

  function __titleRestore(el, snap){
    if(!el || !snap) return;
    __TITLE_HISTORY_RESTORING = true;
    __titleInternal(() => {
      el.textContent = String(snap.text || "");
    });
    // Sync placeholder flags/anchors without creating an additional undo step.
    __syncTitleEmptyState(el, { duringInput:false });
    __TITLE_HISTORY_RESTORING = false;

    try{ el.focus({preventScroll:true}); }catch(_e){}
    if(el.dataset.empty === "1"){
      __placeCaretInTitleEmpty(el);
    }else{
      __titleSetSelectionOffsets(el, snap.start, snap.end);
    }
  }

  function __titleUndo(el){
    __initTitleHistory(el);
    const h = __TITLE_HISTORY.get(el);
    if(!h || !h.undo.length) return;
    const current = __titleSnapshot(el);
    const prev = h.undo.pop();
    h.redo.push(current);
    if(h.redo.length > __TITLE_HISTORY_LIMIT) h.redo.shift();
    __titleRestore(el, prev);
  }

  function __titleRedo(el){
    __initTitleHistory(el);
    const h = __TITLE_HISTORY.get(el);
    if(!h || !h.redo.length) return;
    const current = __titleSnapshot(el);
    const next = h.redo.pop();
    h.undo.push(current);
    if(h.undo.length > __TITLE_HISTORY_LIMIT) h.undo.shift();
    __titleRestore(el, next);
  }

  function __titleUndoActive(){
    const ae = document.activeElement;
    if(ae && __TITLE_IDS.includes(ae.id)) __titleUndo(ae);
  }
  function __titleRedoActive(){
    const ae = document.activeElement;
    if(ae && __TITLE_IDS.includes(ae.id)) __titleRedo(ae);
  }


let __TITLE_INTERNAL_EDIT = false;

function __stripTitleAnchors(s){

  if(!el) return;

  const raw = String(el.textContent || "");

  const cleaned = __getTitleUserText(el).replace(/\r/g,"").replace(/\n/g,"").trim();

  if(document.activeElement === el){

function __syncTitleEmptyState(el, opts){
  if(!el) return;
  const duringInput = !!(opts && opts.duringInput);

  const cleaned = __getTitleUserText(el);

function __placeCaretInTitleEmpty(el){

  // otherwise apply to the active line. This prevents "half-snapping" where only one
  // block changes type and the rest keeps old margins/indent until you manually fix gaps.
  function _rangeIntersectsNode(range, node){
    try{
      if(range.intersectsNode) return range.intersectsNode(node);
    }catch(_e){}
    const nr = document.createRange();
    nr.selectNodeContents(node);
    // overlap test
    return !(range.compareBoundaryPoints(Range.END_TO_START, nr) <= 0 ||
             range.compareBoundaryPoints(Range.START_TO_END, nr) >= 0);
  }

    if(!editor.contains(r.startContainer) || !editor.contains(r.endContainer)) return [];
    const out = [];
    for(const ln of $$(".line", editor)){
      try{
        if(_rangeIntersectsNode(r, ln)) out.push(ln);
      }catch(_e){}
    }
    return out;
  }

  function _applyBoundarySpacing(lineEl){
    if(!lineEl) return;

    const t = lineEl.dataset.type || "action";

    if(t === "scene"){
      const prev = previousLine(lineEl);
      const nxt  = nextLine(lineEl);

      // Blank before scene unless previous is already blank, or previous is also a scene.
      if(prev && prev.dataset.type !== "scene" && getLineTextLength(prev) !== 0){
        ensureBlankLineBefore(lineEl);
      }
      // Blank after scene unless next is blank, or next is also a scene.
      if(nxt && nxt.dataset.type !== "scene" && getLineTextLength(nxt) !== 0){
        ensureBlankLineAfter(lineEl);
      }
    }

    if(t === "character"){
      const prev = previousLine(lineEl);
      // Character typically sits after a blank/action break; insert a blank before
      // unless previous is blank or a scene (FD often allows direct after scene blank already).
      if(prev && prev.dataset.type !== "scene" && getLineTextLength(prev) !== 0){
        ensureBlankLineBefore(lineEl);
      }
    }
  }

  // Remove soft line breaks within a line element so Action/Dialogue paragraphs can re-wrap cleanly.
  // This fixes cases where pasted content leaves <br> or newline characters inside a single .line,
  // causing "dropped" wrapped lines instead of filling available space.
  function _sanitizeWrapText(s){
    return (s||"")
      .replace(/\u200B/g,"")
      .replace(/[\r\n]+/g," ")
      .replace(/[\t ]+/g," ")
      .trim();
  }
  function _removeSoftBreaksInLine(lineEl){
    if(!lineEl) return;
    // Replace <br> with a single space text node
    const brs = lineEl.querySelectorAll("br");
    brs.forEach(br => br.replaceWith(document.createTextNode(" ")));

    // Replace newline characters inside text nodes with spaces (preserve spans/formatting)
    const walker = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    for(const tn of nodes){
      if(tn.nodeValue && /[\r\n]/.test(tn.nodeValue)){
        tn.nodeValue = tn.nodeValue.replace(/[\r\n]+/g," ");
      }
    }
  }



  function setTypeOnSelection(type){
    let lines = _getSelectedLines();
    if(!lines.length) return false;

    // One snapshot for the whole operation (not one per line)
    scheduleSnapshot("type-selection");

    // Preserve selection through paginate-induced DOM moves
    const selDesc = getSelectionDescriptor();

    // If converting a multi-line highlight into a wrapped paragraph type (e.g. Action/Dialogue),
    // reflow the selected lines so words can wrap naturally to the new column width.
    // Without this, previously "hard" line splits create visible right-side gaps.
    if(type === "dialogue" || type === "action"){
      // Merge consecutive, non-blank selected lines into paragraphs (split on blank lines or non-adjacent blocks).
      const editor = $("#scriptEditor");
      const isBlank = (ln) => getLineTextLength(ln) === 0;
      const merged = [];
      let group = [];
      const flush = () => {
        if(!group.length) return;
        // Merge only if it's truly multi-line and all non-blank
        if(group.length > 1 && group.every(ln => !isBlank(ln))){
          const texts = group.map(ln => _sanitizeWrapText(ln.innerText || ln.textContent || "")).filter(Boolean);
          // Join with smart spacing (avoid adding space after hyphen)
          let combined = "";
          for(const t of texts){
            if(!combined){ combined = t; continue; }
            if(/[-—]$/.test(combined)) combined += t;
            else combined += " " + t;
          }
          const keep = group[0];
          keep.textContent = combined;
          // Remove the rest
          for(let i=1;i<group.length;i++){
            group[i].remove();
          }
          merged.push(keep);
        }else{
          merged.push(...group);
        }
        group = [];
      };

      // lines is in DOM order. Group by adjacency & blanks.
      for(const ln of lines){
        if(!group.length){
          group.push(ln);
          continue;
        }
        const prev = group[group.length-1];
        const adjacent = (previousLine(ln) === prev); // true adjacency in document flow
        if(!adjacent || isBlank(prev) || isBlank(ln)){
          flush();
          group.push(ln);
        }else{
          group.push(ln);
        }
      }
      flush();

      // Replace `lines` with the merged set for downstream typing (type assignment + formatting rules)
      lines.length = 0;
      lines.push(...merged);

      // Ensure no embedded soft breaks remain in the affected lines
      for(const ln of lines){ _removeSoftBreaksInLine(ln); }
    }

    // Apply type to all intersecting lines
    for(const ln of lines){
      if(!ln || !ln.classList || !ln.classList.contains("line")) continue;
      if(type === "dual"){ convertLineToDual(ln); continue; }
      ln.dataset.type = type;
      // Clean up soft breaks that can behave like hard returns after width/indent changes.
      try{ _removeSoftBreaksInLine(ln); }catch(_e){}
      // Apply FD-like capitalization where appropriate (length-preserving).
      try{ applyTypeCapitalization(ln, type); }catch(_e){}

      // Parenthetical ergonomics for batch Set Type: wrap existing text in parentheses.
      // (We do NOT move the caret here; selection is preserved/restored for multi-line operations.)
      if(type === "parenthetical"){
        try{
          const raw = (ln.innerText || ln.textContent || "").replace(/\n/g,"").trim();
          if(!raw){
            ln.innerText = "()";
          }else{
            let s = raw;
            if(!s.startsWith("(")) s = "(" + s;
            if(!s.endsWith(")")) s = s + ")";
            if(s !== raw) ln.innerText = s;
          }
        }catch(_e){}
      }
    }

    // Apply boundary spacing rules (careful not to insert "air" between consecutive
    // lines of the same type that the user is deliberately mass-converting).
    for(const ln of lines){
      _applyBoundarySpacing(ln);
    }

    if(type === "parenthetical") _scheduleParentheticalAlign();

    requestAnimationFrame(() => {
      normalizeEditorStructure();
      paginate();
      requestAnimationFrame(() => restoreSelectionDescriptor(selDesc));
    });

    return true;
  }

  function jsonpGet_(endpoint, params={}, timeoutMs=20000){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      const qs = new URLSearchParams(Object.assign({}, params, { callback: cb, _: String(Date.now()) }));
      const src = endpoint + (endpoint.includes("?") ? "&" : "?") + qs.toString();

      const s = document.createElement("script");
      s.async = true;

      let done = false;
      const t = setTimeout(()=>{
        if(done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP timeout"));
      }, timeoutMs);

      function cleanup(){
        clearTimeout(t);
        try{ delete window[cb]; }catch(_e){ window[cb] = undefined; }
        if(s.parentNode) s.parentNode.removeChild(s);
      }

      window[cb] = (data)=>{
        if(done) return;
        done = true;
        cleanup();
        resolve(data);
      };

      s.onerror = ()=>{
        if(done) return;
        done = true;
        cleanup();
        reject(new Error("JSONP load error"));
      };

      s.src = src;
      document.head.appendChild(s);
    });
  }

      const txt = await r.text();
      try{ return JSON.parse(txt); }catch(_e){ throw new Error("Non-JSON response"); }
    } finally {
      clearTimeout(t);
    }
  }

      reject(new Error("Save timeout (iframe blocked, fetch failed)"));
    }, timeoutMs);
  });
}

function extractDocFromPayload_(payload){
    if(!payload) return null;
    return payload.doc || payload.data || payload.DOC || payload.document || null;
  }

  function extractFileIdFromPayload_(payload){
    if(!payload) return "";
    return String(payload.fileId || payload.id || payload.docId || payload.fileID || "");
  }

  function cleanFileName_(name){
    const base = String(name||"").trim().replace(/\.json$/i,"");
    const safe = base.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g," ").trim();
    return safe || "Untitled";
  }

  
  // ---------- Untitled naming (prevents overwrite when creating new scripts) ----------
  const UNTITLED_SEQ_KEY = (location.host + location.pathname + "__SCRIPTY_UNTITLED_SEQ_V1").toLowerCase();
  function nextUntitledName_(){
    let n = 0;
    try{ n = parseInt(lsGetRaw(UNTITLED_SEQ_KEY) || "0", 10) || 0; }catch(_e){ n = 0; }
    n = n + 1;
    try{ lsSet(UNTITLED_SEQ_KEY, String(n)); }catch(_e){}
    return "Untitled Script " + n;
  }

function getPreferredCloudName_(doc, route){
    const fromQuery = route && route.name ? route.name : "";
    const fromTitle = doc && doc.title && doc.title.title ? doc.title.title : "";
    return cleanFileName_(fromQuery || fromTitle || "Untitled");
  }

  async function driveLoadDoc_(endpoint, route){
    // Try JSONP first (older "JSONP + XDR Save" backends), then fetch.
    const ep = normalizeEndpoint(endpoint);
    if(!ep) throw new Error("Cloud URL not set.");
    const fileId = route && route.fileId ? route.fileId : "";
    const name = route && route.name ? route.name : "";
    const params = fileId ? { action:"load", fileId, id:fileId } : { action:"load", name };
    try{
      const p = await jsonpGet_(ep, params, 20000);
      return p;
    }catch(_e){
      const qs = new URLSearchParams(Object.assign({}, params, { _: String(Date.now()) }));
      return await fetchJsonGet_(ep + (ep.includes("?")?"&":"?") + qs.toString(), 20000);
    }
  }

  async function driveSaveDoc_(endpoint, payload){
  const ep = normalizeEndpoint(endpoint);
  if(!ep) throw new Error("Cloud URL not set.");
  
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 20000);
  try{
    const r = await fetch(ep, {
      method:"POST",
      headers: { "Content-Type":"text/plain;charset=UTF-8" },
      body: JSON.stringify(payload || {}),
      cache:"no-store",
      signal: ctl.signal
    });
    const txt = await r.text();
    try{ 
      return JSON.parse(txt); 
    }catch(_e){ 
      return { ok:true, note:"Saved (response unreadable)" }; 
    }
  } finally { 
    clearTimeout(t); 
  }
}

  // Active cloud context for this editor session
  let __cloud = { endpoint:"", fileId:"", pid:"", name:"" };
  let __cloudSaving = false;
  let __cloudAutosaveQueued = false;


  function getSavedRaw(){

  function migrateLegacyIfPresent(){

      if(!legacyRaw) return false;

      if(getSavedRaw()) return false;
      lsSet(STORAGE_KEY_V2, legacyRaw);

  function _docHasAnyContent(doc){
    try{
      const t = doc?.title || {};

  function persistDocToStorage(opts={}){
    const { state=null, quiet=false, source="save" } = opts;
    try{
      const doc = state || serializeDocFromDOM();
      const payload = JSON.stringify(doc);
      lsSet(STORAGE_KEY_V2, payload);
      lsSet(STORAGE_META_KEY, JSON.stringify({ savedAt: new Date().toISOString(), bytes: payload.length, source }));
      if(!quiet){
        setStatus(`Saved locally (${Math.round(payload.length/1024)} KB) · ${new Date().toLocaleTimeString()}`);
      }else{
        setStatus("Autosaved locally · " + new Date().toLocaleTimeString());

      return true;
    }catch(err){

  async function persistDocToCloud(opts={}){
    const { doc=null, source="manual" } = opts;
    if(!__cloud || !__cloud.endpoint) return false;

    // Only manual save is allowed to CREATE a brand-new Drive file.
    // Autosave will only update once we have a fileId.
    if(!__cloud.fileId && source !== "manual") return false;

    if(__cloudSaving){
      // Coalesce autosaves while a save is in-flight
      if(source !== "manual") __cloudAutosaveQueued = true;
      return false;
    }

    __cloudSaving = true;
    try{
      const d = doc || serializeDocFromDOM();
      const name = getPreferredCloudName_(d, { name: __cloud.name });

      const payload = {
        action: "save",
        fileId: __cloud.fileId || "",
        id: __cloud.fileId || "",
        pid: __cloud.pid || "",
        name,
        doc: d,
        data: d
      };

      const res = await driveSaveDoc_(__cloud.endpoint, payload);

      // If GAS returns a message, capture the assigned fileId for future overwrites
      const newId = extractFileIdFromPayload_(res);
      if(newId && !__cloud.fileId){
        __cloud.fileId = newId;
        try{
          const u = new URL(location.href);
          u.searchParams.set("fileId", newId);
          // Keep pid if present (it keeps local autosave namespace stable)
          if(__cloud.endpoint) u.searchParams.set("cloud", __cloud.endpoint);
          history.replaceState(null, "", u.toString());
        }catch(_e){}
      }

      if(res && res.ok === false){
        throw new Error(res.error || "Cloud save failed.");
      }

      setStatus(source === "manual" ? "Saved to Drive." : "Auto-saved to Drive.");
      return true;

    }catch(err){
      setStatus("Cloud save failed: " + (err && err.message ? err.message : String(err)));
      return false;

    }finally{
      __cloudSaving = false;
      if(__cloudAutosaveQueued){
        __cloudAutosaveQueued = false;
        // Run one more autosave after the current save finishes
        persistDocToCloud({ source:"autosave" });
      }
    }
  }

  function scheduleAutosave(){

// ---------- Print-safe PDF export ----------
function buildPrintRoot(){
  const printRoot = document.getElementById("printRoot");
  const editor = document.getElementById("scriptEditor");
  const pagesLayer = document.getElementById("pagesLayer");
  const titlePage = document.getElementById("titlePage");
  if(!printRoot || !editor) return;

  // Clear
  printRoot.innerHTML = "";

  // Title page clone (non-editable) — preserve inline formatting (bold/italic/underline/spans)
  if(titlePage){
    const t = document.createElement("div");
    t.className = "printTitle printPaper";

    // IMPORTANT:
    // - Title fields are contenteditable and may contain inline markup (e.g. <span style="font-style:italic">)
    // - Using innerText would strip that markup and cause export/print mismatches.
    // - We also suppress placeholder/NBSP padding when a field is visually empty.
    const getFieldHTML = (id) => {
      const el = document.getElementById(id);
      if(!el) return "";
      if(el.getAttribute("data-empty") === "1") return "";
      // Some fields keep a NBSP so the caret can sit on an "empty" line.
      // Remove a pure-NBSP payload so it doesn't print as a blank glyph box.
      const html = (el.innerHTML ?? "");
      const text = (el.innerText ?? "").replace(/[\u00A0\s]+/g, "");
      if(text.length === 0) return "";
      return html;
    };

    t.innerHTML = `
      <div class="printTitleContent">
        <div class="printTitleField title"></div>
        <div class="printTitleField writtenby"></div>
        <div class="printTitleField name"></div>
        <div class="printContact"></div>
      </div>`;

    t.querySelector(".printTitleField.title").innerHTML = getFieldHTML("tp_title");
    t.querySelector(".printTitleField.writtenby").innerHTML = getFieldHTML("tp_writtenby");
    t.querySelector(".printTitleField.name").innerHTML = getFieldHTML("tp_name");
    t.querySelector(".printContact").innerHTML = getFieldHTML("tp_contact");

    printRoot.appendChild(t);
  }

  // Group editor children into pages using between-spacers as delimiters
  const kids = Array.from(editor.children);
  const pages = [];
  let cur = [];

  const pushIfNonEmpty = (arr) => {
    if(arr.length) pages.push(arr);
  };

  for(const el of kids){
    if(el.classList.contains("pageSpacer")){
      const kind = el.getAttribute("data-kind");
      if(kind === "top"){
        // ignore (top margin spacer)
        continue;
      }
      if(kind === "between"){
        // delimiter between pages
        pushIfNonEmpty(cur);
        cur = [];
        continue;
      }
      continue;
    }
    if(el.classList.contains("line")){
      cur.push(el);
    }
  }
  pushIfNonEmpty(cur);

  // If editor is completely empty, still print a single blank script page
  if(pages.length === 0){
    pages.push([]);
  }

  // Some documents can accumulate a "visually empty" first script page (e.g. leading blank line
  // blocks used for spacing). In print/PDF this becomes a random blank page between the title
  // page and the first writing page. Trim ONLY leading empty pages; keep intentional blanks later.
  // Normalize any text down to what would register as "ink" on the page.
  // We aggressively strip/neutralize invisible formatting chars that frequently
  // sneak in via contenteditable / copy-paste (NBSP, zero-width, soft hyphen,
  // bidi controls, various Unicode "format" chars, etc.).
  const normalizeVisibleText = (s) => {
    let out = String(s ?? "");
    // 1) Remove common invisible/format characters explicitly
    out = out.replace(/[\u00A0\u00AD\u034F\u061C\u180E\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, " ");
    // 2) Remove any remaining Unicode "format" chars (Cf) and space separators (Zs)
    //    (Property escapes supported in modern browsers; fallback keeps prior behavior)
    try{
      out = out.replace(/[\p{Cf}\p{Zs}]/gu, " ");
    }catch(e){ /* ignore */ }
    // 3) Collapse whitespace
    out = out.replace(/\s+/g, " ").trim();
    return out;
  };

  const isVisuallyEmptyPage = (lineEls) => {
    if(!lineEls || lineEls.length === 0) return true;
    for(const el of lineEls){
      // innerText is closer to what the user sees than textContent (handles <br> etc.)
      const t = normalizeVisibleText(el.innerText ?? "");
      if(t.length) return false;

      // If a line contains any non-text renderable content, treat as non-empty.
      if(el.querySelector && el.querySelector("img,svg,canvas")) return false;
    }
    return true;
  };

  while(pages.length > 1 && isVisuallyEmptyPage(pages[0])){
    pages.shift();
  }

// Build print pages
  pages.forEach((lineEls, i) => {
    const page = document.createElement("div");
    page.className = "printPage printPaper";

    // Page numbers: no number on first script page
    if(i > 0){
      const pn = document.createElement("div");
      pn.className = "printPageNumber";
      pn.textContent = (i+1) + ".";
      page.appendChild(pn);
    }

    const content = document.createElement("div");
    content.className = "printContent";

    for(const lineEl of lineEls){
      const clone = lineEl.cloneNode(true);
      clone.removeAttribute("contenteditable");
      content.appendChild(clone);
    }

    page.appendChild(content);
    printRoot.appendChild(page);
  });
}

function enterPrintMode(){
  document.body.classList.add("printing");
  buildPrintRoot();
}

function exitPrintMode(){
  document.body.classList.remove("printing");
  const printRoot = document.getElementById("printRoot");
  if(printRoot) printRoot.innerHTML = "";
}

  /********************************************************************
   * Custom, stable spell underlines for #scriptEditor (no flicker)
   * - Disables native browser squiggles in contenteditable (Firefox flicker)
   * - Proofs only INACTIVE lines to avoid caret/selection interference

  const __PROOF_OK_TOKENS = new Set([
    "int","ext","i/e","est","day","night","cont'd","contd","v/o","vo","o/s","os","b.g.","bg","pov","c/u","cu","sfx","vfx",
    "mr","mrs","ms","dr","st","jr","sr","i\'m","i\'ll","i\'ve","i\'d"
  ]);

  function __proofNormalizeWord(w){ return (w||"").toLowerCase().replace(/[’‘]/g,"\'"); }

  function __proofShouldCheck(wordRaw){
    if(!wordRaw) return false;
    // Ignore ALL CAPS (CHARACTER names, acronyms)
    if(wordRaw === wordRaw.toUpperCase() && /[A-Z]/.test(wordRaw)) return false;
    // Ignore anything with digits or underscores
    if(/[0-9_]/.test(wordRaw)) return false;
    // Ignore tokens with internal dots/slashes commonly used in scripts
    const w = wordRaw.toLowerCase();
    if(__PROOF_OK_TOKENS.has(w)) return false;
    // Short fragments
    if(w.length <= 1) return false;
    return true;
  }

  
function __proofBuildIndex(){
    if(!__PROOF_DICT) return;

    // Suggestion index tuned for Word / Final Draft feel:
    // - Candidate retrieval uses character bigrams (handles wrong first letter, transpositions)
    // - Ranking uses bounded Damerau‑Levenshtein (OSA) + overlap + prefix preference
    const words = Array.from(__PROOF_DICT);
    const first = new Map(); // char -> [wordIndex]
    const bi = new Map();    // bigram -> [wordIndex]

    for(let i=0;i<words.length;i++){
      const w = words[i];
      if(!w || w.length < 2) continue;

      const k = w[0];
      let a = first.get(k);
      if(!a){ a=[]; first.set(k, a); }
      a.push(i);

      const seen = new Set();
      for(let j=0;j<w.length-1;j++){
        const bg = w[j] + w[j+1];
        if(seen.has(bg)) continue;
        seen.add(bg);
        let b = bi.get(bg);
        if(!b){ b=[]; bi.set(bg, b); }
        b.push(i);
      }
    }

    __PROOF_INDEX = { words, first, bi };
  }

  function __proofSaveUserWords(){
    try{
      const arr = Array.from(__PROOF_USER_WORDS || []);
      lsSet(__PROOF_USER_KEY, JSON.stringify(arr));
    }catch(_e){}
  }

  async function __proofLoadUserWords(){
    if(__PROOF_USER_WORDS) return;
    __PROOF_USER_WORDS = new Set();
    try{
      const raw = lsGetRaw(__PROOF_USER_KEY);
      if(raw){
        JSON.parse(raw).forEach(w => {
          if(typeof w === "string" && w.trim()) __PROOF_USER_WORDS.add(w.trim().toLowerCase());
        });
      }
    }catch(_e){}
  }

  function __proofAddUserWord(wordRaw){
    const w = __proofNormalizeWord(wordRaw).trim();
    if(!w) return;
    if(!__PROOF_USER_WORDS) __PROOF_USER_WORDS = new Set();
    __PROOF_USER_WORDS.add(w);
    __proofSaveUserWords();

    const wasInDict = (__PROOF_DICT && __PROOF_DICT.has(w));
    if(__PROOF_DICT) __PROOF_DICT.add(w);
    if(wasInDict) return;

    // Incrementally update suggestion index (avoid rebuild)
    try{
      if(__PROOF_INDEX && __PROOF_INDEX.words && __PROOF_INDEX.first && __PROOF_INDEX.bi){
        const idx = __PROOF_INDEX;
        const id = idx.words.length;
        idx.words.push(w);

        const k = w[0];
        let a = idx.first.get(k);
        if(!a){ a=[]; idx.first.set(k, a); }
        a.push(id);

        const seen = new Set();
        for(let j=0;j<w.length-1;j++){
          const bg = w[j] + w[j+1];
          if(seen.has(bg)) continue;
          seen.add(bg);
          let b = idx.bi.get(bg);
          if(!b){ b=[]; idx.bi.set(bg, b); }
          b.push(id);
        }
      }else{
        __proofBuildIndex();
      }
    }catch(_e){}
  }

  function __proofBigrams(w){
    const out = [];
    const seen = new Set();
    for(let i=0;i<w.length-1;i++){
      const bg = w[i] + w[i+1];
      if(seen.has(bg)) continue;
      seen.add(bg);
      out.push(bg);
    }
    return out;
  }

  // Optimal String Alignment (restricted Damerau‑Levenshtein) with early exit.
  function __proofDamerauOSA(a, b, maxDist){
    if(a === b) return 0;
    const al = a.length, bl = b.length;
    if(Math.abs(al - bl) > maxDist) return maxDist + 1;
    if(al === 0) return bl;
    if(bl === 0) return al;

    let dp0 = new Array(bl+1);
    let dp1 = new Array(bl+1);
    let dp2 = new Array(bl+1);

    for(let j=0;j<=bl;j++) dp1[j] = j;

    for(let i=1;i<=al;i++){
      dp2[0] = i;
      let rowMin = dp2[0];

      for(let j=1;j<=bl;j++){
        const cost = (a.charCodeAt(i-1) === b.charCodeAt(j-1)) ? 0 : 1;

        let val = dp1[j] + 1;              // deletion
        const ins = dp2[j-1] + 1;          // insertion
        if(ins < val) val = ins;
        const sub = dp1[j-1] + cost;       // substitution
        if(sub < val) val = sub;

        // transposition
        if(i>1 && j>1 &&
           a.charCodeAt(i-1) === b.charCodeAt(j-2) &&
           a.charCodeAt(i-2) === b.charCodeAt(j-1)){
          const tr = dp0[j-2] + 1;
          if(tr < val) val = tr;
        }

        dp2[j] = val;
        if(val < rowMin) rowMin = val;
      }

      if(rowMin > maxDist) return maxDist + 1;

      // rotate rows
      const t = dp0; dp0 = dp1; dp1 = dp2; dp2 = t;
    }

    return dp1[bl];
  }

  function __proofCaseify(srcRaw, candLower){
    const s = (srcRaw || "");
    if(!s) return candLower;

    const hasLetter = /[A-Za-z]/.test(s);
    if(hasLetter && s === s.toUpperCase()) return candLower.toUpperCase();

    // Title case (first letter upper, rest lower)
    if(s.length >= 2 && s[0] === s[0].toUpperCase() && s.slice(1) === s.slice(1).toLowerCase()){
      return candLower[0].toUpperCase() + candLower.slice(1);
    }

    return candLower;
  }

  function __proofGetSuggestions(wordRaw, limit=8){
    const w = __proofNormalizeWord(wordRaw);
    if(!w || w.length < 2) return [];

    if(!__PROOF_INDEX) __proofBuildIndex();
    const idx = __PROOF_INDEX;
    if(!idx || !idx.words || !idx.bi) return [];

    const wl = w.length;
    const maxDist = wl <= 4 ? 1 : 2;
    const minLen = Math.max(2, wl - 2);
    const maxLen = wl + 2;

    // Candidate retrieval by bigram overlap
    const bgs = __proofBigrams(w);
    const counts = new Map(); // wordIndex -> overlapCount
    for(const bg of bgs){
      const arr = idx.bi.get(bg);
      if(!arr) continue;
      for(const id of arr){
        counts.set(id, (counts.get(id) || 0) + 1);
      }
    }

    let candEntries = Array.from(counts.entries());
    candEntries.sort((a,b) => b[1] - a[1]);
    candEntries = candEntries.slice(0, 1400); // cap work

    // Fallback: same-first-letter bucket if bigram overlap yields little (short words, etc.)
    if(candEntries.length < 80 && idx.first){
      const fallback = idx.first.get(w[0]) || [];
      const take = Math.min(4000, fallback.length);
      for(let i=0;i<take;i++){
        const id = fallback[i];
        if(!counts.has(id)) candEntries.push([id, 0]);
      }
    }

    const pref = w.slice(0, Math.min(3, w.length));
    const scored = [];

    for(const [id, ov] of candEntries){
      const cand = idx.words[id];
      if(!cand) continue;
      if(cand === w) continue;
      if(cand.length < minLen || cand.length > maxLen) continue;

      const d = __proofDamerauOSA(w, cand, maxDist);
      if(d > maxDist) continue;

      // Lower score is better
      let score = d * 100;
      score -= ov * 10;
      score += Math.abs(cand.length - wl) * 5;
      if(pref && cand.startsWith(pref)) score -= 8;
      if(cand[0] !== w[0]) score += 3;

      scored.push([cand, score]);
    }

    scored.sort((a,b) => a[1] - b[1] || a[0].localeCompare(b[0]));

    const uniq = [];
    const seen = new Set();
    for(const [cand] of scored){
      if(seen.has(cand)) continue;
      seen.add(cand);
      uniq.push(__proofCaseify(wordRaw, cand));
      if(uniq.length >= limit) break;
    }
    return uniq;
  }

  async function __proofLoadDict(){
    if(__PROOF_DICT || __PROOF_DICT_LOADING) return;
    __PROOF_DICT_LOADING = true;
    try{
      // base64 -> Uint8Array
      const bin = atob(__PROOF_DICT_GZ_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);

      // gzip inflate via DecompressionStream (modern browsers)
      let text = "";
      if("DecompressionStream" in window){
        const ds = new DecompressionStream("gzip");
        const blob = new Blob([bytes]);
        const stream = blob.stream().pipeThrough(ds);
        text = await new Response(stream).text();
      } else {
        console.warn("DecompressionStream not available; custom proofing disabled.");
        __PROOF_DICT = new Set();
        return;
      }

      const set = new Set();
      const lines = text.split(/\r?\n/);
      for(const line of lines){
        const w = (line||"").trim().toLowerCase();
        if(!w) continue;
        set.add(w);
      }
      // Add common screenplay contractions/variants
      ["dont","doesnt","didnt","cant","wont","im","ive","ill","id","youre","theyre","isnt","arent","wasnt","werent","couldnt","shouldnt","wouldnt"].forEach(x=>set.add(x));

      // Load user dictionary (persisted)
      try{
        if(!__PROOF_USER_WORDS){
          const raw = lsGetRaw(__PROOF_USER_KEY);
          __PROOF_USER_WORDS = new Set();
          if(raw){
            JSON.parse(raw).forEach(w => {
              if(typeof w === "string" && w.trim()) __PROOF_USER_WORDS.add(w.trim().toLowerCase());
            });
          }
        }
        for(const w of (__PROOF_USER_WORDS||[])) set.add(w);
      }catch(_e){ __PROOF_USER_WORDS = new Set(); }

      __PROOF_DICT = set;
      __PROOF_INDEX = null;
      __proofBuildIndex();
    }catch(err){
      console.error("Proof dict load failed:", err);
      __PROOF_DICT = new Set();
    }finally{
      __PROOF_DICT_LOADING = false;
    }
  }

  function __unwrap(node){
    const parent = node.parentNode;
    if(!parent) return;
    while(node.firstChild) parent.insertBefore(node.firstChild, node);
    parent.removeChild(node);
  }

  function __stripProof(lineEl){
    if(!lineEl) return;
    lineEl.querySelectorAll("span.proof-miss").forEach(__unwrap);
  }

  function __walkTextNodes(root){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if(!p) return NodeFilter.FILTER_REJECT;
        if(p.closest && (p.closest("span.proof-miss") || p.closest("span.proof-gram"))) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const out = [];
    let n;
    while((n = walker.nextNode())) out.push(n);
    return out;
  }

  function __applyProofToLine(lineEl){
    if(!lineEl || !__PROOF_DICT) return;
    const plain = (lineEl.textContent || "");
    if(plain.length > 800) return;

    __stripProof(lineEl);

    const textNodes = __walkTextNodes(lineEl);
    for(const tn of textNodes){
      const s = tn.nodeValue;
      let m;
      const reWord = /[A-Za-z][A-Za-z'’‘]*/g;
      reWord.lastIndex = 0;
      let lastIdx = 0;
      const frag = document.createDocumentFragment();
      let changed = false;

      while((m = reWord.exec(s))){
        const wRaw = m[0];
        const start = m.index;
        const end = start + wRaw.length;

        const before = s.slice(lastIdx, start);
        if(before) frag.appendChild(document.createTextNode(before));

        const wNorm = __proofNormalizeWord(wRaw);
        const ok = !__proofShouldCheck(wRaw) || __PROOF_DICT.has(wNorm);
        if(ok){
          frag.appendChild(document.createTextNode(wRaw));
        } else {
          const span = document.createElement("span");
          span.className = "proof-miss";
          span.textContent = wRaw;
          frag.appendChild(span);
          changed = true;
        }
        lastIdx = end;
      }

      const after = s.slice(lastIdx);
      if(after) frag.appendChild(document.createTextNode(after));

      if(changed){
        tn.parentNode.replaceChild(frag, tn);
      }
    }
  }


// --- Context proofing via LanguageTool (online) ---
function __stripGrammar(lineEl){
  if(!lineEl) return;
  try{
    lineEl.querySelectorAll("span.proof-gram").forEach(__unwrap);
  }catch(_e){}
}

function __gramMakeIgnoreKey(ruleId, badText){
  const t = __proofNormalizeWord(badText).trim();
  return (ruleId || "rule") + "::" + t;
}

// Local confused-word / wrong-context checks (offline, fast)
// These catch common screenplay-proofing mistakes even when the online checker is unavailable.
function __localConfusedWordMatches(text){
  const t = String(text || "");
  const out = [];
  if(!t) return out;

  const push = (m, ruleId, msg, sugs) => {
    try{
      const start = m.index;
      const end = start + m[0].length;
      if(start < 0 || end <= start) return;
      const bad = t.slice(start, end);
      out.push({ start, end, bad, ruleId, msg, sugs: (sugs||[]).slice(0,8) });
    }catch(_e){}
  };

  // there/their/they're
  // "there coming", "their going", etc.
  const reThere = /\bthere\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|is\b|was\b|gonna\b|going\b|coming\b|doing\b|saying\b|leaving\b|waiting\b))/ig;
  let m;
  while((m = reThere.exec(t))){
    push(m, "LOCAL_CONFUSED_THERE_THEYRE", 'Possibly wrong word: use "they\'re" for "they are".', ["they're"]);
  }

  const reTheir = /\btheir\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|is\b|was\b|gonna\b|going\b|coming\b|doing\b|saying\b))/ig;
  while((m = reTheir.exec(t))){
    push(m, "LOCAL_CONFUSED_THEIR_THEYRE", 'Possibly wrong word: use "they\'re" for "they are".', ["they're"]);
  }

  // your/you're
  const reYour = /\byour\b(?=\s+(?:[a-z]{2,}ing\b|are\b|were\b|not\b|gonna\b|going\b|coming\b|doing\b|here\b|late\b|ready\b|welcome\b))/ig;
  while((m = reYour.exec(t))){
    push(m, "LOCAL_CONFUSED_YOUR_YOURE", 'Possibly wrong word: use "you\'re" for "you are".', ["you're"]);
  }

  // its/it's (simple heuristic)
  const reIts = /\bits\b(?=\s+(?:a\b|an\b|the\b|very\b|really\b|so\b|too\b|not\b|been\b|going\b|coming\b|[a-z]{2,}ing\b))/ig;
  while((m = reIts.exec(t))){
    push(m, "LOCAL_CONFUSED_ITS_ITS", 'Possibly missing apostrophe: use "it\'s" for "it is".', ["it's"]);
  }

  // beet/beat (drum context)
  const reBeetDrum = /\bbeet\b(?=\s+of\s+the\s+drum\b)/ig;
  while((m = reBeetDrum.exec(t))){
    push(m, "LOCAL_CONFUSED_BEET_BEAT", 'Possibly wrong word in this context (drums): "beat".', ["beat"]);
  }

  // Simple "than/then" check in comparative phrases (very conservative)
  const reThenThan = /\bthen\b(?=\s+(?:more\b|less\b|better\b|worse\b|older\b|you\b|i\b|we\b|they\b|he\b|she\b|it\b))/ig;
  while((m = reThenThan.exec(t))){
    // Only flag if there is also a comparative earlier in the line
    const left = t.slice(0, m.index).toLowerCase();
    if(/\b(?:more|less|better|worse|rather)\b/.test(left)){
      push(m, "LOCAL_CONFUSED_THEN_THAN", 'Possibly wrong word: "than" is used for comparisons.', ["than"]);
    }
  }

// were/where (only flag the very specific, high-confidence "were are/is" pattern)
const reWereAre = /\bwere\b(?=\s+(?:are|is)\b)/ig;
while((m = reWereAre.exec(t))){
  push(m, "LOCAL_CONFUSED_WERE_WHERE", 'Possibly wrong word: "where" fits here (location).', ["where"]);
}

// betting/beating (common screenplay slip: "drums/heart/pulse ... betting")
const reBetting = /\bbetting\b/ig;
while((m = reBetting.exec(t))){
  const start = m.index;
  const end = start + m[0].length;
  const left = t.slice(Math.max(0, start - 40), start).toLowerCase();
  // crude but effective: look for a subject + copula within 40 chars
  if(/\b(drums?|heart|pulse|fists?|knuckles?)\b[^.]{0,25}\b(?:were|was|are|is|been|be)\s*$/.test(left)){
    push(m, "LOCAL_CONFUSED_BETTING_BEATING", 'Possibly wrong word in this context: "beating".', ["beating"]);
  }
}

// staring/steering (very specific phrase)
const reStaringWheel = /\bstaring\b(?=\s+wheel\b)/ig;
while((m = reStaringWheel.exec(t))){
  push(m, "LOCAL_CONFUSED_STARING_STEERING", 'Possibly wrong word: "steering wheel".', ["steering"]);
}

// affect/effect (high-confidence noun phrase: "an affect" -> "an effect")
const reAnAffect = /\ban\s+affect\b/ig;
while((m = reAnAffect.exec(t))){
  push(m, "LOCAL_CONFUSED_AFFECT_EFFECT", 'Possibly wrong word: "effect" (noun) is common here.', ["an effect"]);
}

  return out;
}

async function __gramCheckText(text){
  const t = (text || "").trim();
  if(!t) return [];
  const now = Date.now();
  const cached = __GRAM_CACHE.get(t);
  if(cached && (now - cached.ts) < __GRAM_CACHE_MS) return cached.matches || [];

  const body = new URLSearchParams();
  body.set("text", t);
  body.set("language", __GRAM_LANGUAGE);

  // Hard timeout so a stalled request never blocks proofing.
  const controller = new AbortController();
  const timer = setTimeout(() => { try{ controller.abort(); }catch(_e){} }, 8000);

  try{
    const resp = await fetch(__GRAM_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
      signal: controller.signal
    });
    if(!resp.ok) throw new Error("LT " + resp.status);
    const json = await resp.json();
    const matches = Array.isArray(json.matches) ? json.matches : [];
    __GRAM_CACHE.set(t, {ts: now, matches});
    return matches;
  }catch(_e){
    return [];
  }finally{
    clearTimeout(timer);
  }
}

function __resolveTextPos(root, index){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let n;
  let remaining = index;
  while((n = walker.nextNode())){
    const len = (n.nodeValue || "").length;
    if(remaining <= len) return {node:n, offset:remaining};
    remaining -= len;
  }
  return {node:null, offset:0};
}

function __wrapLineRange(lineEl, start, end, meta){
  if(!lineEl) return null;
  if(start >= end) return null;
  const a = __resolveTextPos(lineEl, start);
  const b = __resolveTextPos(lineEl, end);
  if(!a.node || !b.node) return null;

  const r = document.createRange();
  try{
    r.setStart(a.node, a.offset);
    r.setEnd(b.node, b.offset);
  }catch(_e){ return null; }

  const span = document.createElement("span");
  span.className = "proof-gram";
  if(meta){
    for(const k in meta){
      try{ span.dataset[k] = String(meta[k]); }catch(_e){}
    }
  }

  const frag = r.extractContents();
  span.appendChild(frag);
  r.insertNode(span);
  r.detach();
  return span;
}

let __gramReqSeq = 0;
const __gramTimers = new WeakMap();

function __scheduleGrammar(lineEl){
  if(!lineEl) return;
  // If disabled, keep the page clean.
  if(!__GRAM_ENABLED){
    __stripGrammar(lineEl);
    return;
  }

  try{
    const old = __gramTimers.get(lineEl);
    if(old) clearTimeout(old);
  }catch(_e){}

  const t = setTimeout(() => {
    const active = __getActiveLine && __getActiveLine();
    if(active && active === lineEl) return; // don't touch active line
    __applyGrammarToLine(lineEl);
  }, 140);

  try{ __gramTimers.set(lineEl, t); }catch(_e){}
}

async function __applyGrammarToLine(lineEl){
  if(!lineEl || !__GRAM_ENABLED) return;

  const before = (lineEl.textContent || "");
  const text = before.trim();
  if(text.length < 8 || text.length > 900) { __stripGrammar(lineEl); return; }
  if(!/[A-Za-z]{3,}/.test(text)) { __stripGrammar(lineEl); return; }

  // Local (offline) confused-word checks.
  const __local = __localConfusedWordMatches(text);

  const reqId = ++__gramReqSeq;
  lineEl.__gramReqId = reqId;

  const matches = await __gramCheckText(text);

  // Stale / changed / re-focused
  if(lineEl.__gramReqId !== reqId) return;
  if((lineEl.textContent || "") !== before) return;
  const active = __getActiveLine && __getActiveLine();
  if(active && active === lineEl) return;

  // Filter matches to keep screenplay noise down:
  // prefer typos + confused words + grammar, and only when we have replacements.
  const kept = [];
  // Seed with local matches first so they can show even if the online checker is unreachable.
  for(const lm of (__local || [])){
    const ignoreKey = __gramMakeIgnoreKey(lm.ruleId || "", lm.bad || "");
    if(__GRAM_IGNORES && __GRAM_IGNORES.has(ignoreKey)) continue;
    kept.push({ start: lm.start, end: lm.end, msg: lm.msg || "", ruleId: lm.ruleId || "", bad: lm.bad || "", sugs: (lm.sugs || []).slice(0,8) });
    if(kept.length >= 6) break;
  }
  for(const m of (matches || [])){
    if(!m || typeof m.offset !== "number" || typeof m.length !== "number") continue;
    if(m.length <= 0) continue;

    const rule = m.rule || {};
    const issue = rule.issueType || "";
    const cat = (rule.category && rule.category.id) ? rule.category.id : "";

    if(issue === "misspelling") continue; // we already handle spelling locally
    const okCat = (cat === "TYPOS" || cat === "CONFUSED_WORDS" || cat === "GRAMMAR" || cat === "SEMANTICS");
    const okIssue = (issue === "typographical" || issue === "grammar");
    if(!okCat && !okIssue) continue;

    const bad = text.slice(m.offset, m.offset + m.length);
    if(!/[A-Za-z]{2,}/.test(bad)) continue;

    const reps = Array.isArray(m.replacements) ? m.replacements : [];
    const sug = reps.map(r => r && r.value).filter(v => typeof v === "string" && v.trim()).slice(0, 8);
    if(!sug.length) continue;

    const ruleId = rule.id || "";
    const ignoreKey = __gramMakeIgnoreKey(ruleId, bad);
    if(__GRAM_IGNORES && __GRAM_IGNORES.has(ignoreKey)) continue;

    kept.push({
      start: m.offset,
      end: m.offset + m.length,
      msg: m.message || "",
      ruleId,
      bad,
      sugs: sug
    });

    if(kept.length >= 6) break;
  }

  // Remove old grammar underlines, then apply new ones (back-to-front)
  __stripGrammar(lineEl);
  if(!kept.length) return;

  // Make non-overlapping (earliest wins)
  kept.sort((a,b) => a.start - b.start);
  const nonOver = [];
  let lastEnd = -1;
  for(const k of kept){
    if(k.start < lastEnd) continue;
    nonOver.push(k);
    lastEnd = k.end;
  }

  for(let i=nonOver.length-1;i>=0;i--){
    const k = nonOver[i];
    __wrapLineRange(lineEl, k.start, k.end, {
      sugs: k.sugs.join("|"),
      msg: k.msg,
      ruleid: k.ruleId
    });
  }
}

  let __proofLastActiveLine = null;

  function __getActiveLine(){
    try{
      const sel = window.getSelection();
      if(!sel || sel.rangeCount===0) return null;
      let node = sel.getRangeAt(0).startContainer;
      if(node && node.nodeType === 3) node = node.parentElement;
      if(!node) return null;
      return node.closest ? node.closest(".line") : null;
    }catch(_e){ return null; }
  }

  function __scheduleProof(lineEl){
    if(!lineEl) return;
    setTimeout(() => {
      const active = __getActiveLine();
      if(active && active === lineEl) return;

      // Native browser/OS spellcheck handles misspellings.
      // Ensure no legacy custom misspell marks remain.
      try{ __stripProof(lineEl); }catch(_e){}

      // Context proofing (wrong-word usage) only.
      __scheduleGrammar(lineEl);
    }, 40);
  }

  function __bindCustomProofing(){
    const editor = document.getElementById("scriptEditor");
    if(!editor) return;

    // Only suppress native underlines when using System/Browser spellcheck.
    // If we are in native mode, we do NOT run custom proofing (browser handles it).
    if(typeof __isNativeSpellMode === "function" && !__isNativeSpellMode()){
      _setSpellSuppressLine(null);
      return;
    }
    // (Disabled) Custom dictionary proofing is off; native spellcheck handles misspellings.
    const onMaybeLineChange = () => {
      const active = __getActiveLine();
      if(active && active !== __proofLastActiveLine){
        if(__proofLastActiveLine) __scheduleProof(__proofLastActiveLine);
        // __stripProof(active); // keep underlines while editing; avoid caret jumps
        __proofLastActiveLine = active;
      }
    };

    editor.addEventListener("keyup", onMaybeLineChange, true);
    editor.addEventListener("mouseup", onMaybeLineChange, true);
    editor.addEventListener("focus", onMaybeLineChange, true);
    editor.addEventListener("click", onMaybeLineChange, true);

    editor.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){
        const active = __getActiveLine();
        if(active) __scheduleProof(active);
      }
    }, true);

    editor.addEventListener("blur", () => {
      if(__proofLastActiveLine) __scheduleProof(__proofLastActiveLine);
    }, true);

    
    editor.addEventListener("paste", () => {
      const active = __getActiveLine();
      if(active) __scheduleProof(active);
    }, true);

    // Initial pass: context-proof a chunk of the document without touching the active line.
    setTimeout(() => {
      try{
        const lines = Array.from(editor.querySelectorAll(".line"));
        const cap = Math.min(lines.length, 180);
        const active = __getActiveLine();
        for(let i=0;i<cap;i++){
          if(active && lines[i] === active) continue;
          __scheduleGrammar(lines[i]);
        }
      }catch(_e){}
    }, 800);
  }

  function clampToViewport(x, y){
    const pad = 8;
    const r = menu.getBoundingClientRect();
    let nx = x, ny = y;
    if(nx + r.width + pad > window.innerWidth) nx = Math.max(pad, window.innerWidth - r.width - pad);
    if(ny + r.height + pad > window.innerHeight) ny = Math.max(pad, window.innerHeight - r.height - pad);
    return {x:nx, y:ny};
  }

  function showAt(x, y){
    menu.hidden = false;

  function replaceWord(newWord){
    if(!currentSpan) return;

    const line = currentLine || currentSpan.closest(".line");

    // Replace span with plain text to keep DOM clean
    const t = document.createTextNode(newWord);
    currentSpan.replaceWith(t);

    // Re-proof the line shortly after the DOM settles
    if(line) __scheduleProof(line);

    try{

  btnClose.addEventListener("click", hide);

  window.addEventListener("keydown", (e) => { if(e.key === "Escape") hide(); }, true);
  window.addEventListener("mousedown", (e) => {
    if(menu.hidden) return;

  }, true);

  window.addEventListener("resize", hide, true);
