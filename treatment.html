<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treatment — Camp</title>
<meta name="theme-color" content="#17181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Oswald:wght@300;400;600&family=Space+Grotesk:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Archivo+Black&family=Special+Elite&family=Montserrat:wght@300;400;600;800&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
  :root{
    --bg:#141414; --panel:#1a1a1a; --panel2:#212121; --panel3:#262624; --border:#333330;
    --muted:#9a9a96; --accent:#c1272d; --accent-hover:#a8181e; --good:#6fbf8b;
    --pageDark:#070d08; --pageLight:#e6f4c4; --inkDark:#e6f4c4; --inkLight:#070d08;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#f2f0ec; font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* Top bar (same as Storyboard) */
  #topbar{ height:56px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--border); }
  #topbar .back{ font-size:13px; color:var(--muted); white-space:nowrap; }
  #topbar .back:hover{ color:#f2f0ec; }
  #topbar .sep{ width:1px; height:18px; background:var(--border); }
  #topbar .title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30vw; }
  #topbar .grow{ flex:1; }
  #topbar .scriptLink{ font-size:12.5px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:6px 10px; white-space:nowrap; }
  #topbar .scriptLink:hover{ color:#f2f0ec; border-color:#5a5a54; }
  #statusMsg{ font-size:12px; color:var(--muted); white-space:nowrap; }
  #statusMsg.err{ color:#ff8f8f; }
  .btn{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:#f2f0ec; font-size:13px; }
  .btn:hover{ background:#2a2a26; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn:disabled{ opacity:.45; cursor:default; pointer-events:none; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; }

  #body{ flex:1; display:flex; min-height:0; }

  /* Left rail: page navigator */
  #leftRail{ width:232px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; }
  .rail-label{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; padding:4px 6px 8px; }
  .navItem{ padding:6px; border-radius:8px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .navItem:hover{ background:#20201e; }
  .navItem.active{ background:var(--panel2); border-color:#4a4a44; }
  .navItem.dragOver{ border-color:var(--accent); }
  .navItem.dragging{ opacity:.4; }
  .navThumb{ width:100%; aspect-ratio:297/210; overflow:hidden; border-radius:3px; position:relative; background:#000; pointer-events:none; }
  .navThumb .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  .navMeta{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11.5px; }
  .navMeta .num{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .navMeta .name{ flex:1; min-width:0; font-weight:600; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .navMeta .name input{ width:100%; font:inherit; text-transform:none; letter-spacing:0; background:var(--panel3); color:#f2f0ec; border:1px solid #5a5a54; border-radius:4px; padding:1px 4px; }
  .navMeta .acts{ display:none; gap:2px; }
  .navItem:hover .acts{ display:flex; }
  .miniBtn{ width:20px; height:20px; border-radius:5px; border:none; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0; }
  .miniBtn:hover{ background:#33332e; color:#f2f0ec; }
  .miniBtn.del:hover{ background:#3a2020; color:#ff8f8f; }
  #addPageBtn{ margin-top:4px; width:100%; padding:9px 10px; border-radius:8px; border:1px dashed #4a4a44; background:none; color:#c8c6c0; font-size:12.5px; text-align:left; display:flex; align-items:center; gap:8px; }
  #addPageBtn:hover{ border-color:var(--accent); color:#fff; background:#1f1c1c; }

  /* Center stage */
  #stageWrap{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden; background:#101010; }
  #stage{ position:relative; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #stage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }

  /* Right rail */
  #rightRail{ width:272px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:18px; }
  .section-title{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; margin-bottom:10px; }
  #rightRail label{ display:block; font-size:11.5px; color:var(--muted); margin:10px 0 5px; }
  #rightRail input[type=text], #rightRail select{ width:100%; height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:#f2f0ec; font-size:12.5px; }
  #rightRail input:focus, #rightRail select:focus{ outline:none; border-color:#6a6a62; }
  .swatches{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,.18); padding:0; }
  .swatch.selected{ box-shadow:0 0 0 2px var(--panel), 0 0 0 3px #fff; }
  .hint{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .divider{ border-top:1px solid var(--border); padding-top:16px; }

  /* ---------- Treatment page (fixed A4 landscape, real units) ---------- */
  .tpage{ width:297mm; height:210mm; position:relative; overflow:hidden; background:var(--pageDark); color:var(--inkDark); font-family:Archivo,Helvetica,sans-serif; }
  .tpage.light{ color:var(--inkLight); }
  .tpage .el{ position:absolute; overflow:hidden; }
  .el-text{ white-space:pre-wrap; word-wrap:break-word; outline:none; }
  .el-text:empty::before{ content:attr(data-ph); opacity:.38; }
  /* Deck type system: Archivo, condensed uppercase titles, tracked small caps for labels */
  .ts-eyebrow{ font:600 6.7pt/1.3 Archivo,sans-serif; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
  .ts-display{ font:800 52pt/.9 Archivo,sans-serif; font-stretch:68%; letter-spacing:-.005em; text-transform:uppercase; white-space:nowrap; }
  .ts-poster{ font:800 122pt/.85 Archivo,sans-serif; font-stretch:68%; letter-spacing:-.01em; text-transform:uppercase; white-space:nowrap; }
  .ts-outline{ font:800 122pt/.85 Archivo,sans-serif; font-stretch:68%; letter-spacing:-.01em; text-transform:uppercase; white-space:nowrap; -webkit-text-fill-color:transparent; -webkit-text-stroke:.3mm currentColor; }
  .ts-heading{ font:800 28pt/1 Archivo,sans-serif; font-stretch:68%; text-transform:uppercase; }
  .ts-subhead{ font:700 8.5pt/1.3 Archivo,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .ts-body{ font:400 9.4pt/1.65 Archivo,sans-serif; }
  .ts-caption{ font:600 6.3pt/1.4 Archivo,sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:.8; }
  .ts-quote{ font:500 22pt/1.25 Archivo,sans-serif; font-stretch:75%; letter-spacing:.02em; text-transform:uppercase; }
  .ts-para{ font:500 10.5pt/1.5 Archivo,sans-serif; font-stretch:75%; letter-spacing:.03em; text-transform:uppercase; }
  .ts-mono{ font:600 8pt/2.1 Archivo,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .ts-credit{ font:400 6.7pt/1.45 Archivo,sans-serif; }
  .ts-label{ font:700 6pt/1.3 Archivo,sans-serif; letter-spacing:.05em; text-transform:uppercase; }
  .ts-foot{ font:600 6.3pt/1.4 Archivo,sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:.8; }
  .el-text.bt{ border-top:.3mm solid rgba(230,244,196,.27); padding-top:2.4mm; }
  .tpage.light .el-text.bt{ border-top-color:rgba(7,13,8,.27); }
  .el-wave{ display:flex; align-items:center; gap:1mm; }
  .el-wave b{ flex:1; background:currentColor; opacity:.9; border-radius:.3mm; }
  .el-image{ background:#2f4036; }
  .el-image.empty[data-tone="0"]{ background:#3f524e; } .el-image.empty[data-tone="1"]{ background:#2f4036; } .el-image.empty[data-tone="2"]{ background:#46606a; }
  .el-image.empty[data-tone="3"]{ background:#54482c; } .el-image.empty[data-tone="4"]{ background:#6b5530; } .el-image.empty[data-tone="5"]{ background:#4a3a22; }
  .tpage.light .el-image{ background:#dedad0; }
  .el-image img{ position:absolute; left:0; top:0; width:100%; height:100%; max-width:none; object-fit:cover; display:block; }
  .el-image .dim{ position:absolute; inset:0; }
  .el-image.empty::after{ content:"INSERT STILL"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 6pt Archivo,sans-serif; letter-spacing:.14em; opacity:.5; }
  .el-divider{ opacity:.4; }
  .el-divider::before{ content:""; position:absolute; left:0; right:0; top:50%; border-top:0.3mm solid currentColor; }

  /* Freeform editing on the stage only (never in thumbnails, preview or PDF) */
  #stage .tpage .el{ cursor:move; }
  #stage .tpage .el:hover{ outline:calc(1px / var(--s, 1)) dashed rgba(90,150,255,.7); }
  #stage .tpage .el.editing{ cursor:text; outline:calc(1.5px / var(--s, 1)) solid #5a96ff; }
  #selBox{ position:absolute; outline:1.5px solid #5a96ff; pointer-events:none; z-index:10; }
  #selBox .h{ position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; background:#fff; border:1.5px solid #5a96ff; border-radius:1px; pointer-events:auto; }
  .h-nw{ left:0; top:0; cursor:nwse-resize; } .h-n{ left:50%; top:0; cursor:ns-resize; } .h-ne{ left:100%; top:0; cursor:nesw-resize; } .h-e{ left:100%; top:50%; cursor:ew-resize; }
  .h-se{ left:100%; top:100%; cursor:nwse-resize; } .h-s{ left:50%; top:100%; cursor:ns-resize; } .h-sw{ left:0; top:100%; cursor:nesw-resize; } .h-w{ left:0; top:50%; cursor:ew-resize; }
  #selBox.line .h-n, #selBox.line .h-s, #selBox.line .h-ne, #selBox.line .h-nw, #selBox.line .h-se, #selBox.line .h-sw{ display:none; }
  #stage .guide{ position:absolute; background:#e0457b; pointer-events:none; z-index:11; }
  #stage .guide.gv{ top:0; bottom:0; width:1px; }
  #stage .guide.gh{ left:0; right:0; height:1px; }

  #stage .tpage .el.dropTarget{ outline:calc(2.5px / var(--s, 1)) solid var(--accent) !important; }
  #stage .tpage .el.cropping{ cursor:grab; }
  #selBox.crop .h{ display:none; }
  .libGrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .libItem{ position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; border:1px solid var(--border); background:#111; padding:0; cursor:pointer; }
  .libItem:hover{ border-color:#6a6a62; }
  .libItem img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .libItem .x{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:4px; background:rgba(0,0,0,.7); color:#ddd; display:none; align-items:center; justify-content:center; font-size:13px; line-height:1; }
  .libItem .x:hover{ background:#7a1f22; color:#fff; }
  .libItem:hover .x{ display:flex; }
  .libItem .used{ position:absolute; left:4px; bottom:4px; width:6px; height:6px; border-radius:50%; background:var(--good); }
  .libEmpty{ border:1px dashed #4a4a44; border-radius:8px; padding:14px 10px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.5; }
  #rightRail input[type=range]{ width:100%; accent-color:#c1272d; }
  .btn.sm.primary{ padding:6px 10px; }

  /* Live collaboration */
  .liveFaces{ display:flex; }
  .liveFace{ width:24px; height:24px; border-radius:50%; border:2px solid var(--bg); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0; margin-left:-6px; }
  .liveFaces .liveFace:first-child{ margin-left:0; }
  .liveFace.more{ background:#444; }
  .livePill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:12px; color:#d8d6d0; background:var(--panel2); }
  .livePill .liveDot{ width:7px; height:7px; border-radius:50%; background:var(--good); }
  .livePill.off{ color:#ff9c96; border-color:rgba(255,123,114,.45); cursor:pointer; }
  .livePill.off .liveDot{ background:#ff7b72; }
  .navDots{ display:flex; gap:3px; }
  .navDots i{ width:8px; height:8px; border-radius:50%; display:block; }
  #stage .rsel{ position:absolute; border:1.5px solid; pointer-events:none; z-index:9; }
  #stage .rsel span{ position:absolute; left:-1.5px; top:-17px; font:600 10px Inter,sans-serif; color:#fff; padding:1px 6px; border-radius:3px 3px 3px 0; white-space:nowrap; }
  .ro .acts, .ro #addPageBtn{ display:none !important; }
  #statusMsg{ min-width:96px; text-align:right; }

  /* Right-rail controls */
  .row2{ display:flex; gap:8px; }
  .row2 > *{ flex:1; min-width:0; }
  #rightRail input[type=number]{ width:100%; height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:#f2f0ec; font-size:12.5px; }
  .seg{ display:flex; gap:2px; background:var(--panel2); border-radius:8px; padding:3px; }
  .seg button{ flex:1; border:none; background:none; color:var(--muted); border-radius:6px; height:28px; font-size:11.5px; display:flex; align-items:center; justify-content:center; }
  .seg button:hover{ color:#f2f0ec; }
  .seg button.on{ background:#2c2c28; color:#fff; box-shadow:inset 0 0 0 1px #4a4a44; }
  .swatch.auto{ background:linear-gradient(135deg, #f2efe8 50%, #1a1a18 50%); }
  .addGrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .addGrid button{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 0 8px; color:#d8d6d0; font-size:11.5px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .addGrid button:hover{ border-color:#5a5a54; color:#fff; background:#2a2a26; }

  /* Modal (same as Storyboard) */
  .modalShade{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalBox{ width:min(760px,100%); max-height:90vh; overflow:auto; background:#1a1b1f; border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modalBox h3{ margin:0 0 4px; font-size:16px; font-weight:600; }
  .modalBox .hint{ margin-bottom:14px; }
  .modalBtns{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .layoutGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
  .layoutOpt{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px; color:#d8d6d0; text-align:left; }
  .layoutOpt:hover{ border-color:var(--accent); color:#fff; }
  .layoutOpt .navThumb{ margin-bottom:6px; }
  .layoutOpt span{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }

  /* Preview */
  #preview{ position:fixed; inset:0; z-index:400; background:#050505; display:none; align-items:center; justify-content:center; }
  #preview.show{ display:flex; }
  #preview .pvStage{ position:relative; }
  #preview .pvStage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  #preview .pvBar{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:rgba(30,30,30,.85); border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--muted); opacity:.25; transition:opacity .15s; }
  #preview .pvBar:hover{ opacity:1; }
  #preview .pvBar .btn{ padding:4px 10px; }

  /* Loading / toast (same as Storyboard) */
  #loading{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; z-index:50; }
  #loading .loadBox{ display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; max-width:420px; padding:0 20px; line-height:1.5; }
  #loading .loadBox .row{ display:flex; gap:8px; }
  .spin{ width:22px; height:22px; border:2.5px solid rgba(255,255,255,.14); border-top-color:#f2f0ec; border-radius:50%; animation:tspin .7s linear infinite; }
  @keyframes tspin{ to{ transform:rotate(360deg); } }
  #tToast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(16px); opacity:0; pointer-events:none; z-index:500;
    display:flex; align-items:center; gap:10px; max-width:calc(100% - 32px); padding:10px 14px; border-radius:12px; background:#23252a; border:1px solid rgba(255,255,255,.17);
    box-shadow:0 14px 40px rgba(0,0,0,.5); font-size:13px; transition:all .18s ease; }
  #tToast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #tToast.err{ border-color:rgba(255,123,114,.55); }

  /* ---------- Print / PDF: one treatment page = one A4 landscape sheet ---------- */
  #printRoot{ display:none; }
  @page{ size:A4 landscape; margin:0; }
  @media print{
    html,body{ height:auto; overflow:visible; background:#fff; }
    #app, #loading, #preview, #tToast, .modalShade{ display:none !important; }
    #printRoot{ display:block; }
    #printRoot .tpage{ page-break-after:always; break-after:page; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printRoot .tpage:last-child{ page-break-after:auto; break-after:auto; }
    .el-text:empty::before, .el-image.empty::after{ content:none; }
    .el-image.empty{ background:transparent !important; }
  }
  #preview .el-text:empty::before, #preview .el-image.empty::after{ content:none; }
  #preview .el-image.empty{ background:transparent; }
  #preview .pvStage{ box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #preview .pvHit{ position:fixed; top:0; bottom:70px; width:30%; z-index:1; cursor:pointer; }
  #preview .pvBar{ z-index:2; }
  #preview:fullscreen{ background:#050505; }
</style>
</head>
<body>
<div id="loading"><div class="loadBox"><div class="spin"></div><div>Loading treatment…</div></div></div>
<div id="app" style="display:none;">
  <div id="topbar">
    <a class="back" id="backLink" href="index.html">&larr; Library</a>
    <div class="sep"></div>
    <div class="title" id="pageTitle">Treatment</div>
    <a class="scriptLink" id="scriptLink" href="editor.html" title="Open the script">Script ↗</a>
    <a class="scriptLink" id="sbLink" href="storyboard.html" title="Open the storyboard">Storyboard ↗</a>
    <div class="grow"></div>
    <span id="liveWrap" style="display:flex;align-items:center;gap:8px"></span>
    <div id="statusMsg"></div>
    <button class="btn sm" id="undoBtn" type="button" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button class="btn sm" id="redoBtn" type="button" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button class="btn" id="previewBtn" type="button">Preview</button>
    <button class="btn primary" id="exportBtn" type="button" title="Opens the print dialog: choose “Save as PDF”">Export PDF</button>
  </div>
  <div id="body">
    <div id="leftRail"></div>
    <div id="stageWrap"><div id="stage"></div></div>
    <div id="rightRail"></div>
  </div>
</div>
<div id="preview"><div class="pvStage" id="pvStage"></div>
  <div class="pvBar"><button class="btn" id="pvPrev" type="button">&lsaquo;</button><span id="pvPos"></span><button class="btn" id="pvNext" type="button">&rsaquo;</button><button class="btn" id="pvFull" type="button" title="Full screen (F)">Full screen</button><button class="btn" id="pvPdf" type="button">Export PDF</button><button class="btn" id="pvClose" type="button">Close (Esc)</button></div>
  <div class="pvHit" id="pvHitL" style="left:0"></div><div class="pvHit" id="pvHitR" style="right:0"></div>
</div>
<div id="printRoot"></div>
<div id="tToast" role="status" aria-live="polite"><span id="tToastMsg"></span></div>

<script src="Camp-core.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Route / config / API: shared in Camp-core.js ---------------- */
  const { route, loadConfig_, apiGet, loadScript, escapeHtml, cloudParam } = window.Camp;
  const apiPost = (action, body) => window.Camp.apiPost(action, body, 90000);   // treatment saves can be large

  /* ---------------- Feedback ---------------- */
  let __toastT = 0;
  function notify(msg, isErr, ms){
    const t = document.getElementById("tToast");
    document.getElementById("tToastMsg").textContent = String(msg || "");
    t.classList.toggle("err", !!isErr); t.classList.add("show");

    const k = pxPerMm(), sx = e.clientX, sy = e.clientY, r0 = { x:el.x, y:el.y, w:el.w, h:el.h }, tg = snapTargets(el.id), tol = 6 / k;

      if(dir.includes("n")){ h = r0.h - dy; y = r0.y + dy; }

        if(dir.includes("e")){ const b = snap1([x + w], tg.xs, tol); if(b){ w += b.d; gx = b.t; } }
        if(dir.includes("w")){ const b = snap1([x], tg.xs, tol); if(b){ x += b.d; w -= b.d; gx = b.t; } }
        if(dir.includes("s")){ const b = snap1([y + h], tg.ys, tol); if(b){ h += b.d; gy = b.t; } }
        if(dir.includes("n")){ const b = snap1([y], tg.ys, tol); if(b){ y += b.d; h -= b.d; gy = b.t; } }
      }
      if(ev.shiftKey && dir.length === 2){ h = w / ratio; if(dir.includes("n")) y = r0.y + r0.h - h; gy = null; } // corner + Shift keeps proportions

  // Click straight into text: double-click (or Enter on a selected text box). One undo step per edit.

    if(!el || !n || el.t !== "text" || el.auto) return;
    SEL = id; EDITING = id; __preEdit = snap(); __preText = el.text || "";
    drawSel();
    n.classList.add("editing");
    try{ n.contentEditable = "plaintext-only"; }catch(_e){ n.contentEditable = "true"; }
    n.oninput = () => { el.text = n.innerText.replace(/\n$/, ""); };
    n.onpaste = (ev) => {
      if(n.contentEditable !== "true") return;
      ev.preventDefault(); document.execCommand("insertText", false, (ev.clipboardData || window.clipboardData).getData("text/plain"));
    };
    n.onkeydown = (ev) => { ev.stopPropagation(); if(ev.key === "Escape"){ ev.preventDefault(); finishEdit(); } };
    n.onblur = () => { if(EDITING === id) finishEdit(); };

  /* ---------------- Images: upload, library, placing ---------------- */
  async function prepImage(file){
    if(file.size > 40 * 1024 * 1024) throw new Error("That file is over 40 MB.");
    let bmp;
    try{ bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); }
    catch(_e){ bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error("Couldn't read that image.")); im.src = URL.createObjectURL(file); }); }
    const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    // 2600px on the long edge is ~220 dpi on A4: sharp in the PDF, small enough to upload fast
    return { dataUrl: drawJpeg(bmp, w, h, 2600, 0.9), thumb: drawJpeg(bmp, w, h, 240, 0.72) };
  }
  async function uploadFiles(files){
    const ids = []; let i = 0;
    for(const f of files){
      i++; setStatus("Uploading " + i + "/" + files.length + "…");
      try{
        const { dataUrl, thumb } = await prepImage(f);
        const res = await apiPost("uploadimage", { fileId:T.fileId, name:f.name, dataUrl });
        if(!res || res.ok === false) throw new Error((res && res.error) || "Upload failed.");
        T.images.push({ id:res.imageId, name:res.name || f.name });
        IMG[res.imageId] = { src:dataUrl, thumb };
        ids.push(res.imageId);
      }catch(err){ notify(f.name + ": " + String((err && err.message) || err), true); }
    }
    if(ids.length){ markDirty(); renderRight(); } else updateSaveState();
    return ids;
  }

    pg.els.filter((e) => e.t === "image" && !e.img && e !== sel).sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach((e) => frames.push(e));

  /* ---------------- Palette, themes, script refresh ---------------- */
  function syncPalLabel(sw, pg){
    const lb = pg.els.find((e) => e.t === "text" && e.pall === sw.pal);
    if(lb && /^#/.test(sw.fill || "")) lb.text = sw.fill.toUpperCase();
  }
  const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  async function paletteFrom(srcs, n){
    const bins = {};
    for(const src of srcs){
      const im = await loadImg(src); if(!im) continue;
      const k0 = 64 / Math.max(im.naturalWidth, im.naturalHeight), w = Math.max(1, Math.round(im.naturalWidth * k0)), h = Math.max(1, Math.round(im.naturalHeight * k0));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.drawImage(im, 0, 0, w, h);
      const px = x.getImageData(0, 0, w, h).data;
      for(let i = 0; i < px.length; i += 4){
        if(px[i + 3] < 128) continue;
        const k = ((px[i] >> 4) << 8) | ((px[i + 1] >> 4) << 4) | (px[i + 2] >> 4), b = bins[k] || (bins[k] = { n:0, r:0, g:0, b:0 });
        b.n++; b.r += px[i]; b.g += px[i + 1]; b.b += px[i + 2];
      }
    }
    const list = Object.keys(bins).map((k) => {
      const b = bins[k], c = { r:b.r / b.n, g:b.g / b.n, b:b.b / b.n }, mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b);
      c.w = b.n * (0.6 + (mx - mn) / (mx || 1)); return c;
    }).sort((a, b) => b.w - a.w);
    const dist = (a, b) => Math.hypot(a.r - b.r, a.g - b.g, a.b - b.b), out = [];
    [64, 44, 28, 0].forEach((th) => { for(const c of list){ if(out.length >= n) break; if(!out.includes(c) && out.every((o) => dist(o, c) > th)) out.push(c); } });
    const lum = (c) => 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
    return out.sort((a, b) => lum(a) - lum(b)).map((c) => "#" + [c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""));
  }
  function repalette(n){

  function snap(){ return JSON.stringify({ pages:T.pages, cur:T.cur }); }
  function commit(fn){
    if(RO) return;
    T.undo.push(snap()); if(T.undo.length > 100) T.undo.shift();
    T.redo = [];
    fn();
    markDirty();
  }
  function restore(s){ const o = JSON.parse(s); T.pages = o.pages; T.cur = Math.min(o.cur, T.pages.length - 1); }
  function undo(){ if(RO || !T.undo.length) return; T.redo.push(snap()); restore(T.undo.pop()); markDirty(); renderAll(); }
  function redo(){ if(RO || !T.redo.length) return; T.undo.push(snap()); restore(T.redo.pop()); markDirty(); renderAll(); }
  function updateUndoState(){
    document.getElementById("undoBtn").disabled = RO || !T.undo.length;
    document.getElementById("redoBtn").disabled = RO || !T.redo.length;

    T.title = (T.script.title && T.script.title.title) || String(loadRes.name || "").replace(/\.json$/i, "") || "Untitled Script";
    RO = !!loadRes.readOnly; if(RO) document.body.classList.add("ro");
    LV.name = (loadRes.me && loadRes.me.name) || "Someone";
    document.getElementById("pageTitle").textContent = T.title + " — Treatment";
    document.title = T.title + " · Treatment — Camp";
    const hub = new URLSearchParams(location.search).get("hub");
    const q = "?fileId=" + encodeURIComponent(T.fileId) + cloudParam() + (hub ? "&hub=" + encodeURIComponent(hub) : "");
    if(hub){ const b = document.getElementById("backLink"); b.href = "hub.html?pid=" + encodeURIComponent(hub) + "&tab=treatment"; b.innerHTML = "&larr; Project"; }
    document.getElementById("scriptLink").href = "editor.html" + q;
    document.getElementById("sbLink").href = "storyboard.html" + q;

    // 1) What Drive has
    let driveDoc = null;
    const tr = await apiGet("treatmentload", { fileId:T.fileId });
    if(tr && tr.ok !== false){ if(tr.exists && tr.doc){ driveDoc = tr.doc; T.rev = Number(tr.rev || tr.doc.rev || 0); } }
    else if(tr && /Unknown action/i.test(String(tr.error || ""))){ DR.unsupported = true; }
    else if(tr && tr.network){ DR.offline = true; }
    else{ showFatal((tr && tr.error) || "Couldn't open the treatment."); return; }

    // 2) What this device has (offline edits, or a pre-Drive copy from earlier versions)
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(localKey()) || "null"); }catch(_e){}
    const localOk = !!(local && Array.isArray(local.pages) && local.pages.length);
    let pages = null, images = [];
    if(driveDoc){
      pages = driveDoc.pages; images = Array.isArray(driveDoc.images) ? driveDoc.images : [];
      if(localOk && local.unsynced === true){
        const mine = () => { pages = local.pages; images = Array.isArray(local.images) ? local.images : []; driveDirty = true; };
        if(Number(local.baseRev || 0) === T.rev){ mine(); notify("Restored your changes from this device."); }
        else if(confirm("Changes you made on this device never reached Drive, and this treatment was changed somewhere else since.\n\nOK = use my version from this device\nCancel = use the shared version (my version downloads as a backup)")) mine();
        else{ const keep = { p:T.pages, i:T.images }; T.pages = local.pages; T.images = local.images || []; backupDownload("offline copy"); T.pages = keep.p; T.images = keep.i; }
      }
    }else if(localOk){ pages = local.pages; images = Array.isArray(local.images) ? local.images : []; driveDirty = true; }   // earlier local-only copy: move it to Drive
    if(!pages){ pages = defaultTreatment(scriptData(T.script)); images = []; driveDirty = true; }
    T.pages = pages; T.images = images;
    __z = Math.max(0, ...T.pages.flatMap((p) => p.els.map((e) => e.z || 0)));
    // Batch A dividers were 0.6mm tall (unclickable): give them the 4mm hit area, same line position
    T.pages.forEach((p) => p.els.forEach((e) => { if(e.t === "divider" && e.h < 2){ e.y = rd(e.y - 1.7); e.h = 4; } }));

    // 3) Join the live room (it may hold newer, not-yet-saved work from teammates)
    const room = loadRes.live && loadRes.live.room;
    if(room && !DR.unsupported){
      await startLive(room);
      if(LV.on && driveDoc){ const same = sj({ p:T.pages, i:T.images }) === sj({ p:driveDoc.pages, i:Array.isArray(driveDoc.images) ? driveDoc.images : [] }); if(same && !local?.unsynced) driveDirty = false; }
    }else if(!room){ LV.offReason = ""; }

    wireStage();
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("undoBtn").onclick = undo;
    document.getElementById("redoBtn").onclick = redo;
    document.getElementById("previewBtn").onclick = openPreview;
    document.getElementById("exportBtn").onclick = exportPdf;
    document.getElementById("pvPrev").onclick = () => stepPreview(-1);
    document.getElementById("pvNext").onclick = () => stepPreview(1);
    document.getElementById("pvClose").onclick = closePreview;
    document.getElementById("pvFull").onclick = togglePvFull;
    document.getElementById("pvPdf").onclick = exportPdf;
    document.getElementById("pvHitL").onclick = () => stepPreview(-1);
    document.getElementById("pvHitR").onclick = () => stepPreview(1);
    document.addEventListener("fullscreenchange", () => { if(document.getElementById("preview").classList.contains("show")) renderPreview(); });
    UI_READY = true;
    renderAll(); renderLivePill(); updateSaveState();
    if(driveDirty){ saveLocal(); scheduleDrive(1200); }
  }

  let __rsT = 0;
  window.addEventListener("resize", () => { clearTimeout(__rsT); __rsT = setTimeout(() => { renderStage(); if(document.getElementById("preview").classList.contains("show")) renderPreview(); }, 120); });

  document.addEventListener("keydown", (e) => {
    if(document.querySelector(".modalShade")) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "select" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if(document.getElementById("preview").classList.contains("show")){
      if(e.key === "Escape") closePreview();
      else if(["arrowright","pagedown"," "].includes(k)){ e.preventDefault(); stepPreview(1); }
      else if(["arrowleft","pageup"].includes(k)){ e.preventDefault(); stepPreview(-1); }
      else if(k === "home"){ e.preventDefault(); gotoPreview(0); }
      else if(k === "end"){ e.preventDefault(); gotoPreview(T.pages.length - 1); }
      else if(k === "f"){ e.preventDefault(); togglePvFull(); }
      else if(mod && k === "p"){ e.preventDefault(); exportPdf(); }
      return;
    }
    if(mod && k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(mod && ((k === "z" && e.shiftKey) || k === "y")){ e.preventDefault(); redo(); return; }
    if(mod && k === "p"){ e.preventDefault(); exportPdf(); return; }
    const sel = SEL && findEl(SEL);
    if(sel){
      if(e.key === "Escape"){ if(CROPPING){ CROPPING = null; renderStage(); renderRight(); return; } deselect(); return; }
      if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); delEl(sel); return; }
      if(mod && k === "d"){ e.preventDefault(); dupEl(sel); return; }
      if(mod && (e.key === "]" || e.key === "[" || e.key === "}" || e.key === "{")){
        e.preventDefault(); const fwd = e.key === "]" || e.key === "}";
        arrange(sel, fwd ? (e.shiftKey ? "front" : "up") : (e.shiftKey ? "back" : "down")); return;
      }
      if(e.key === "Enter" && sel.t === "text"){ e.preventDefault(); startEdit(sel.id); return; }
      const st = e.shiftKey ? 5 : 1, A = { arrowleft:[-st, 0], arrowright:[st, 0], arrowup:[0, -st], arrowdown:[0, st] }[k];
      if(A){ e.preventDefault(); nudge(sel, A[0], A[1]); return; }
    }
    if(k === "pagedown" || k === "arrowdown"){ e.preventDefault(); if(T.cur < T.pages.length - 1){ T.cur++; renderAll(); } }
    if(k === "pageup" || k === "arrowup"){ e.preventDefault(); if(T.cur > 0){ T.cur--; renderAll(); } }
  });

  const ICON = {
    al_left:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>`,
    al_center:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg>`,
    al_right:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg>`,
    t_text:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 6h14M5 11h14M5 16h9"/></svg>`,
    t_head:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 5v14M18 5v14M6 12h12"/></svg>`,
    t_quote:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 7c-2 1-3 3-3 6v4h5v-5H6M17 7c-2 1-3 3-3 6v4h5v-5h-3"/></svg>`,
    t_img:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>`,
    t_shape:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>`,
    t_grid:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>`,
    t_char:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>`,
    t_div:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 12h18"/></svg>`,
    plus:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
    dup:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>`,
    trash:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };

  boot();
})();
</script>
