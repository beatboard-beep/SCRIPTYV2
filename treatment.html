<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treatment — Ripple</title>
<meta name="theme-color" content="#17181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
  :root{
    --bg:#141414; --panel:#1a1a1a; --panel2:#212121; --panel3:#262624; --border:#333330;
    --muted:#9a9a96; --accent:#c1272d; --accent-hover:#a8181e; --good:#6fbf8b;
    --pageDark:#0e0e0d; --pageLight:#f4f1ea; --inkDark:#f2efe8; --inkLight:#1a1a18;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#f2f0ec; font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* Top bar (same as Storyboard) */
  #topbar{ height:56px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--border); }
  #topbar .back{ font-size:13px; color:var(--muted); white-space:nowrap; }
  #topbar .back:hover{ color:#f2f0ec; }
  #topbar .sep{ width:1px; height:18px; background:var(--border); }
  #topbar .title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30vw; }
  #topbar .grow{ flex:1; }
  #topbar .scriptLink{ font-size:12.5px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:6px 10px; white-space:nowrap; }
  #topbar .scriptLink:hover{ color:#f2f0ec; border-color:#5a5a54; }
  #statusMsg{ font-size:12px; color:var(--muted); white-space:nowrap; }
  #statusMsg.err{ color:#ff8f8f; }
  .btn{ background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; color:#f2f0ec; font-size:13px; }
  .btn:hover{ background:#2a2a26; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn:disabled{ opacity:.45; cursor:default; pointer-events:none; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; }

  #body{ flex:1; display:flex; min-height:0; }

  /* Left rail: page navigator */
  #leftRail{ width:232px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; }
  .rail-label{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; padding:4px 6px 8px; }
  .navItem{ padding:6px; border-radius:8px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .navItem:hover{ background:#20201e; }
  .navItem.active{ background:var(--panel2); border-color:#4a4a44; }
  .navItem.dragOver{ border-color:var(--accent); }
  .navItem.dragging{ opacity:.4; }
  .navThumb{ width:100%; aspect-ratio:297/210; overflow:hidden; border-radius:3px; position:relative; background:#000; pointer-events:none; }
  .navThumb .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  .navMeta{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11.5px; }
  .navMeta .num{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .navMeta .name{ flex:1; min-width:0; font-weight:600; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .navMeta .name input{ width:100%; font:inherit; text-transform:none; letter-spacing:0; background:var(--panel3); color:#f2f0ec; border:1px solid #5a5a54; border-radius:4px; padding:1px 4px; }
  .navMeta .acts{ display:none; gap:2px; }
  .navItem:hover .acts{ display:flex; }
  .miniBtn{ width:20px; height:20px; border-radius:5px; border:none; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0; }
  .miniBtn:hover{ background:#33332e; color:#f2f0ec; }
  .miniBtn.del:hover{ background:#3a2020; color:#ff8f8f; }
  #addPageBtn{ margin-top:4px; width:100%; padding:9px 10px; border-radius:8px; border:1px dashed #4a4a44; background:none; color:#c8c6c0; font-size:12.5px; text-align:left; display:flex; align-items:center; gap:8px; }
  #addPageBtn:hover{ border-color:var(--accent); color:#fff; background:#1f1c1c; }

  /* Center stage */
  #stageWrap{ flex:1; min-width:0; display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden; background:#101010; }
  #stage{ position:relative; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #stage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }

  /* Right rail */
  #rightRail{ width:272px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:18px; }
  .section-title{ font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; margin-bottom:10px; }
  #rightRail label{ display:block; font-size:11.5px; color:var(--muted); margin:10px 0 5px; }
  #rightRail input[type=text], #rightRail select{ width:100%; height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:#f2f0ec; font-size:12.5px; }
  #rightRail input:focus, #rightRail select:focus{ outline:none; border-color:#6a6a62; }
  .swatches{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,.18); padding:0; }
  .swatch.selected{ box-shadow:0 0 0 2px var(--panel), 0 0 0 3px #fff; }
  .hint{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .divider{ border-top:1px solid var(--border); padding-top:16px; }

  /* ---------- Treatment page (fixed A4 landscape, real units) ---------- */
  .tpage{ width:297mm; height:210mm; position:relative; overflow:hidden; background:var(--pageDark); color:var(--inkDark); font-family:Inter,sans-serif; }
  .tpage.light{ color:var(--inkLight); }
  .tpage .el{ position:absolute; overflow:hidden; }
  .el-text{ white-space:pre-wrap; word-wrap:break-word; outline:none; }
  .el-text:empty::before{ content:attr(data-ph); opacity:.38; }
  .ts-eyebrow{ font:600 7.5pt/1.3 Inter,sans-serif; letter-spacing:.28em; text-transform:uppercase; opacity:.75; }
  .ts-display{ font:500 54pt/0.95 'Cormorant Garamond',serif; letter-spacing:-.01em; }
  .ts-heading{ font:500 30pt/1.05 'Cormorant Garamond',serif; }
  .ts-subhead{ font:500 15pt/1.15 'Cormorant Garamond',serif; }
  .ts-body{ font:400 9pt/1.65 Inter,sans-serif; }
  .ts-caption{ font:500 6.5pt/1.4 Inter,sans-serif; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
  .ts-quote{ font:italic 400 26pt/1.2 'Cormorant Garamond',serif; }
  .el-image{ background:#1c1c1a; }
  .tpage.light .el-image{ background:#dedad0; }
  .el-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  .el-image .dim{ position:absolute; inset:0; }
  .el-image.empty::after{ content:"IMAGE"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 6pt Inter,sans-serif; letter-spacing:.3em; opacity:.28; }
  .el-divider{ border-top:0.25mm solid currentColor; opacity:.45; }

  /* Modal (same as Storyboard) */
  .modalShade{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalBox{ width:min(760px,100%); max-height:90vh; overflow:auto; background:#1a1b1f; border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .modalBox h3{ margin:0 0 4px; font-size:16px; font-weight:600; }
  .modalBox .hint{ margin-bottom:14px; }
  .modalBtns{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .layoutGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
  .layoutOpt{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px; color:#d8d6d0; text-align:left; }
  .layoutOpt:hover{ border-color:var(--accent); color:#fff; }
  .layoutOpt .navThumb{ margin-bottom:6px; }
  .layoutOpt span{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }

  /* Preview */
  #preview{ position:fixed; inset:0; z-index:400; background:#050505; display:none; align-items:center; justify-content:center; }
  #preview.show{ display:flex; }
  #preview .pvStage{ position:relative; }
  #preview .pvStage > .tpage{ position:absolute; top:0; left:0; transform-origin:0 0; }
  #preview .pvBar{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:rgba(30,30,30,.85); border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:12px; color:var(--muted); opacity:.25; transition:opacity .15s; }
  #preview .pvBar:hover{ opacity:1; }
  #preview .pvBar .btn{ padding:4px 10px; }

  /* Loading / toast (same as Storyboard) */
  #loading{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; z-index:50; }
  #loading .loadBox{ display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; max-width:420px; padding:0 20px; line-height:1.5; }
  #loading .loadBox .row{ display:flex; gap:8px; }
  .spin{ width:22px; height:22px; border:2.5px solid rgba(255,255,255,.14); border-top-color:#f2f0ec; border-radius:50%; animation:tspin .7s linear infinite; }
  @keyframes tspin{ to{ transform:rotate(360deg); } }
  #tToast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(16px); opacity:0; pointer-events:none; z-index:500;
    display:flex; align-items:center; gap:10px; max-width:calc(100% - 32px); padding:10px 14px; border-radius:12px; background:#23252a; border:1px solid rgba(255,255,255,.17);
    box-shadow:0 14px 40px rgba(0,0,0,.5); font-size:13px; transition:all .18s ease; }
  #tToast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #tToast.err{ border-color:rgba(255,123,114,.55); }

  /* ---------- Print / PDF: one treatment page = one A4 landscape sheet ---------- */
  #printRoot{ display:none; }
  @page{ size:A4 landscape; margin:0; }
  @media print{
    html,body{ height:auto; overflow:visible; background:#fff; }
    #app, #loading, #preview, #tToast, .modalShade{ display:none !important; }
    #printRoot{ display:block; }
    #printRoot .tpage{ page-break-after:always; break-after:page; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printRoot .tpage:last-child{ page-break-after:auto; break-after:auto; }
    .el-text:empty::before, .el-image.empty::after{ content:none; }
  }
</style>
</head>
<body>
<div id="loading"><div class="loadBox"><div class="spin"></div><div>Loading treatment…</div></div></div>
<div id="app" style="display:none;">
  <div id="topbar">
    <a class="back" id="backLink" href="index.html">&larr; Library</a>
    <div class="sep"></div>
    <div class="title" id="pageTitle">Treatment</div>
    <a class="scriptLink" id="scriptLink" href="editor.html" title="Open the script">Script ↗</a>
    <a class="scriptLink" id="sbLink" href="storyboard.html" title="Open the storyboard">Storyboard ↗</a>
    <div class="grow"></div>
    <div id="statusMsg"></div>
    <button class="btn sm" id="undoBtn" type="button" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button class="btn sm" id="redoBtn" type="button" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button class="btn" id="previewBtn" type="button">Preview</button>
    <button class="btn primary" id="exportBtn" type="button" title="Opens the print dialog: choose “Save as PDF”">Export PDF</button>
  </div>
  <div id="body">
    <div id="leftRail"></div>
    <div id="stageWrap"><div id="stage"></div></div>
    <div id="rightRail"></div>
  </div>
</div>
<div id="preview"><div class="pvStage" id="pvStage"></div>
  <div class="pvBar"><button class="btn" id="pvPrev" type="button">&lsaquo;</button><span id="pvPos"></span><button class="btn" id="pvNext" type="button">&rsaquo;</button><button class="btn" id="pvClose" type="button">Close (Esc)</button></div>
</div>
<div id="printRoot"></div>
<div id="tToast" role="status" aria-live="polite"><span id="tToastMsg"></span></div>

<script>
(function(){
  "use strict";

  /* ---------------- Route / config / API (same pattern as storyboard.html) ---------------- */
  function route(){
    const qs = new URLSearchParams(location.search);
    return { fileId: String(qs.get("fileId") || qs.get("id") || ""), pid: String(qs.get("pid") || ""), cloud: String(qs.get("cloud") || "") };
  }
  function normalizeEndpoint(u){ return String(u||"").trim().replace(/\s+/g,"").replace(/\/+$/,""); }
  const CLOUD_ENDPOINT_KEYS = ["SCRIPTY_CLOUD_ENDPOINT_V1","SCRIPTY_CLOUD_ENDPOINT","SCRIPTY_CLOUD_URL","CLOUD_ENDPOINT","SCRIPTY_GAS_ENDPOINT","SCRIPTY_CLOUD_ENDPOINT_V0"];
  const CLOUD_KEY_KEY = "SCRIPTY_CLOUD_KEY_V1";
  let __CONFIG = null;
  async function loadConfig_(){
    if(__CONFIG) return __CONFIG;
    try{ const r = await fetch("config.json?_=" + Date.now(), { cache:"no-store" }); if(r.ok) __CONFIG = await r.json(); }catch(_e){}
    return (__CONFIG = __CONFIG || {});
  }
  async function getCloudEndpoint(){
    const r = route();
    if(r.cloud) return normalizeEndpoint(r.cloud);
    for(const k of CLOUD_ENDPOINT_KEYS){ const v = localStorage.getItem(k); if(v) return normalizeEndpoint(v); }
    const cfg = await loadConfig_();
    return normalizeEndpoint(cfg.cloudUrl || cfg.cloudURL || cfg.cloud || cfg.endpoint || "");
  }
  function getCloudKey(){ return String(localStorage.getItem(CLOUD_KEY_KEY) || ""); }
  function setCloudKey(v){ try{ localStorage.setItem(CLOUD_KEY_KEY, v); }catch(_e){} }
  let __pwPromise = null;
  function askPassword(wasWrong){
    if(__pwPromise) return __pwPromise;
    __pwPromise = new Promise((resolve) => {
      const shade = document.createElement("div");
      shade.style.cssText = "position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;";
      shade.innerHTML = `
        <div role="dialog" style="width:min(420px,100%);background:#1a1b1f;color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);font:14px/1.45 Inter,system-ui,sans-serif;">
          <div style="font-size:17px;font-weight:600;margin-bottom:4px">Enter the password</div>
          <div style="color:rgba(255,255,255,.6);font-size:13px;margin-bottom:14px">Same one you use in the script editor.</div>
          <input type="password" autocomplete="current-password" style="width:100%;height:40px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:inherit;font:inherit;outline:none">
          <div style="min-height:18px;margin-top:10px;font-size:12.5px;color:#ff7b72">${wasWrong ? "That password didn't work. Try again." : ""}</div>
          <div style="display:flex;justify-content:flex-end;margin-top:14px"><button data-ok type="button" style="height:38px;padding:0 16px;border-radius:10px;border:1px solid #ececf0;background:#ececf0;color:#111;font:inherit;font-weight:600;cursor:pointer">Unlock</button></div>
        </div>`;
      document.body.appendChild(shade);
      const inp = shade.querySelector("input");
      shade.querySelector("[data-ok]").onclick = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } setCloudKey(v); shade.remove(); __pwPromise = null; resolve(true); };
      inp.addEventListener("keydown", (e) => { if(e.key === "Enter") shade.querySelector("[data-ok]").click(); });
      setTimeout(() => inp.focus(), 30);
    });
    return __pwPromise;
  }
  async function fetchJson_(url, opts, ms){
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 30000);
    try{
      const r = await fetch(url, Object.assign({ cache:"no-store", signal: ctl.signal }, opts || {}));
      try{ return await r.json(); }catch(_e){ return { ok:false, error:"Drive's reply couldn't be read. Check the Apps Script is deployed." }; }
    }catch(err){
      return { ok:false, network:true, error: err && err.name === "AbortError" ? "Drive took too long to answer." : "Couldn't reach Drive. Check your connection." };
    }finally{ clearTimeout(t); }
  }
  async function apiGet(action, params){
    const ep = await getCloudEndpoint();
    if(!ep) return { ok:false, error:"Cloud isn't set up. Open the Library and connect your Apps Script link first." };
    let key = getCloudKey();
    for(let tries = 0; tries < 2; tries++){
      const qs = new URLSearchParams(Object.assign({ action, key }, params || {}));
      const j = await fetchJson_(ep + "?" + qs.toString());
      if(j && j.auth === false){ await askPassword(tries > 0); key = getCloudKey(); continue; }
      return j;
    }
    return { ok:false, error:"That password didn't work." };
  }
  function cloudParam(){ const r = route(); return r.cloud ? "&cloud=" + encodeURIComponent(r.cloud) : ""; }

  /* ---------------- Feedback ---------------- */
  let __toastT = 0;
  function notify(msg, isErr, ms){
    const t = document.getElementById("tToast");
    document.getElementById("tToastMsg").textContent = String(msg || "");
    t.classList.toggle("err", !!isErr); t.classList.add("show");
    clearTimeout(__toastT); __toastT = setTimeout(() => t.classList.remove("show"), ms || (isErr ? 6000 : 2600));
  }
  function showFatal(msg){
    const box = document.getElementById("loading");
    box.style.display = "flex";
    box.innerHTML = `<div class="loadBox"><div style="color:#f2f0ec;font-size:14px">${esc(msg)}</div>
      <div class="row"><a class="btn" href="index.html">&larr; Library</a><button class="btn primary" type="button" id="retryBoot">Try again</button></div></div>`;
    document.getElementById("retryBoot").onclick = () => location.reload();
  }
  function setStatus(t, isErr){ const el = document.getElementById("statusMsg"); if(el){ el.textContent = t || ""; el.classList.toggle("err", !!isErr); } }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------------- State ---------------- */
  // T.pages[] = { id, name, layout, bg:{ color, tone:"dark"|"light" }, els:[] }
  // Element (all positions in mm on the fixed 297×210 page):
  //   text    { id,t:"text",x,y,w,h,z, s:<style preset>, text, ph, align?, color? }
  //   image   { id,t:"image",x,y,w,h,z, img:<Drive imageId>, fx, fy, dim? }
  //   shape   { id,t:"shape",x,y,w,h,z, fill }
  //   divider { id,t:"divider",x,y,w,h,z }
  const T = { fileId:"", title:"Untitled", script:null, pages:[], cur:0, undo:[], redo:[] };
  const PX_MM = 96 / 25.4, PAGE_W = 297, PAGE_H = 210, PAGE_WPX = PAGE_W * PX_MM, PAGE_HPX = PAGE_H * PX_MM;
  const M = 16; // page margin, mm

  const BG_PRESETS = [
    { color:"#0e0e0d", tone:"dark", name:"Black" },
    { color:"#1b1d1f", tone:"dark", name:"Graphite" },
    { color:"#24201c", tone:"dark", name:"Umber" },
    { color:"#1a2124", tone:"dark", name:"Slate" },
    { color:"#f4f1ea", tone:"light", name:"Paper" },
    { color:"#e9e4d8", tone:"light", name:"Bone" },
    { color:"#ffffff", tone:"light", name:"White" }
  ];
  const DARK = { color:"#0e0e0d", tone:"dark" }, LIGHT = { color:"#f4f1ea", tone:"light" };

  /* ---------------- Layouts ---------------- */
  // Each layout lays itself out on the fixed page grid, so users never place things by hand.
  // d = screenplay data ({ title, logline, synopsis, writer, contact, chars:[{name}] }); missing
  // values stay empty with an on-screen placeholder (never printed), so nothing is invented.
  let __z = 0;
  const TX = (x, y, w, h, s, text, ph, extra) => Object.assign({ id:uid(), t:"text", x, y, w, h, z:++__z, s, text: text || "", ph: ph || "" }, extra || {});
  const IM = (x, y, w, h, extra) => Object.assign({ id:uid(), t:"image", x, y, w, h, z:++__z, img:"", fx:50, fy:50 }, extra || {});
  const DV = (x, y, w) => ({ id:uid(), t:"divider", x, y, w, h:0.6, z:++__z });
  const RECT = (x, y, w, h, fill) => ({ id:uid(), t:"shape", x, y, w, h, z:++__z, fill });

  const LAYOUTS = {
    cover: { name:"Cover", build:(d) => ({ bg:DARK, els:[
      IM(0, 0, PAGE_W, PAGE_H, { dim:0.45 }),
      TX(M, 112, 160, 8, "eyebrow", "Director's Treatment"),
      TX(M, 122, 230, 44, "display", d.title, "Title"),
      TX(M, 166, 130, 22, "body", d.logline, "Logline"),
      TX(M, 192, 180, 6, "caption", d.writer ? "Written & Directed by " + d.writer : "", "Written & Directed by")
    ]})},
    imageText: { name:"Image + Text", build:(d, o) => ({ bg:DARK, els:[
      IM(0, 0, 148.5, PAGE_H),
      TX(164.5, 30, 116.5, 8, "eyebrow", (o && o.label) || "", "Section"),
      TX(164.5, 42, 116.5, 34, "heading", (o && o.heading) || "", "Heading"),
      TX(164.5, 82, 116.5, 86, "body", (o && o.body) || "", "Write here…"),
      DV(164.5, 176, 116.5),
      TX(164.5, 181, 55, 5, "caption", (o && o.k1) || "", "Genre"),
      TX(226, 181, 55, 5, "caption", (o && o.k2) || "", "Tone")
    ]})},
    textImage: { name:"Text + Image", build:(d, o) => ({ bg:DARK, els:[
      TX(M, 30, 116.5, 8, "eyebrow", (o && o.label) || "", "Section"),
      TX(M, 42, 116.5, 34, "heading", (o && o.heading) || "", "Heading"),
      TX(M, 82, 116.5, 100, "body", (o && o.body) || "", "Write here…"),
      IM(148.5, 0, 148.5, PAGE_H)
    ]})},
    editorial: { name:"Editorial", build:(d, o) => ({ bg:LIGHT, els:[
      TX(M, 20, 120, 8, "eyebrow", (o && o.label) || "", "Section"),
      TX(M, 32, 140, 52, "display", (o && o.heading) || "", "Heading"),
      TX(M, 98, 62, 96, "body", (o && o.body) || "", "Write here…"),
      TX(84, 98, 62, 96, "body", (o && o.body2) || "", "Key beats…"),
      IM(162, M, 119, PAGE_H - 2 * M)
    ]})},
    grid: { name:"Image Grid", build:(d, o) => {
      const n = (o && o.n) || 6, cols = n <= 4 ? 2 : n <= 6 ? 3 : 4, rows = Math.ceil(n / cols), g = 3;
      const top = 30, w = (PAGE_W - 2 * M - g * (cols - 1)) / cols, h = (PAGE_H - top - M - g * (rows - 1)) / rows;
      const els = [TX(M, 16, 200, 8, "eyebrow", (o && o.label) || "", "Section")];
      for(let i = 0; i < n; i++) els.push(IM(M + (i % cols) * (w + g), top + Math.floor(i / cols) * (h + g), w, h));
      return { bg:DARK, els };
    }},
    characters: { name:"Character Grid", build:(d, o) => {
      const list = (d.chars && d.chars.length ? d.chars : [{}, {}, {}]).slice(0, 4), n = list.length, g = 8;
      const w = (PAGE_W - 2 * M - g * (n - 1)) / n;
      const els = [TX(M, 16, 200, 8, "eyebrow", "Characters"), DV(M, 26, PAGE_W - 2 * M)];
      list.forEach((c, i) => {
        const x = M + i * (w + g);
        els.push(IM(x, 34, w, 104));
        els.push(TX(x, 144, w, 10, "subhead", c.name || "", "Name"));
        els.push(TX(x, 156, w, 38, "body", c.desc || "", "Who they are, what they want…"));
      });
      return { bg:DARK, els };
    }},
    quote: { name:"Quote", build:(d, o) => ({ bg:DARK, els:[
      TX(M, 20, 120, 8, "eyebrow", (o && o.label) || "", "Section"),
      TX(M, 52, 150, 90, "quote", (o && o.quote) || "", "A statement in your own words."),
      DV(M, 152, 40),
      TX(M, 158, 150, 36, "body", (o && o.body) || "", "Supporting text…"),
      IM(182, 0, 115, PAGE_H)
    ]})},
    split: { name:"Split", build:(d, o) => ({ bg:DARK, els:[
      IM(M, M, 130, 128), IM(151, M, 130, 128),
      TX(M, 154, 130, 30, "heading", (o && o.heading) || "", "Heading"),
      TX(151, 154, 130, 40, "body", (o && o.body) || "", "Write here…")
    ]})},
    collage: { name:"Collage", build:(d, o) => ({ bg:DARK, els:[
      TX(M, 16, 120, 8, "eyebrow", (o && o.label) || "", "Section"),
      IM(M, 30, 128, 92), IM(118, 64, 92, 118), IM(196, 26, 85, 64), IM(204, 104, 77, 90),
      TX(M, 132, 92, 62, "body", (o && o.body) || "", "References, mood, texture…")
    ]})},
    minimal: { name:"Minimal", build:(d, o) => ({ bg:LIGHT, els:[
      TX(M, 20, 120, 8, "eyebrow", (o && o.label) || "", "Section"),
      TX(40, 64, 150, 60, "heading", (o && o.heading) || "", "Heading"),
      TX(40, 130, 120, 56, "body", (o && o.body) || "", "Write here…"),
      IM(206, 64, 64, 86)
    ]})},
    full: { name:"Full Image", build:() => ({ bg:DARK, els:[ IM(0, 0, PAGE_W, PAGE_H) ]})},
    closing: { name:"Closing", build:(d) => ({ bg:DARK, els:[
      IM(0, 0, PAGE_W, PAGE_H, { dim:0.55 }),
      TX(48.5, 80, 200, 40, "display", d.title, "Title", { align:"center" }),
      TX(48.5, 128, 200, 6, "caption", d.writer ? "A film by " + d.writer : "", "A film by", { align:"center" }),
      TX(48.5, 180, 200, 14, "body", d.contact || "", "Contact details", { align:"center" })
    ]})}
  };
  const PICKER_ORDER = ["full","imageText","textImage","editorial","grid","characters","quote","split","collage","minimal","cover","closing"];

  function makePage(name, layout, d, o){
    const b = LAYOUTS[layout].build(d || {}, o || {});
    return { id:uid(), name, layout, bg:Object.assign({}, b.bg), els:b.els };
  }
  function defaultTreatment(d){
    return [
      makePage("Cover", "cover", d),
      makePage("The Film", "imageText", d, { label:"The Film", body:d.synopsis }),
      makePage("Story", "editorial", d, { label:"Story", heading:"", body:d.synopsis }),
      makePage("Characters", "characters", d),
      makePage("Visual World", "grid", d, { label:"Visual World", n:6 }),
      makePage("Tone", "collage", d, { label:"Tone & References" }),
      makePage("Director's Vision", "quote", d, { label:"Director's Vision" }),
      makePage("Closing", "closing", d)
    ];
  }

  /* ---------------- Screenplay → data (read-only, one way) ---------------- */
  function runText(l){
    const r = l && l.runs; if(!Array.isArray(r)) return String((l && l.text) || "");
    return r.map((x) => typeof x === "string" ? x : (x && (x.text != null ? x.text : x.t)) || "").join("");
  }
  function scriptData(doc){
    doc = doc || {};
    const tp = doc.title || {}, meta = doc.meta || {};
    const counts = {};
    (doc.lines || []).forEach((l) => {
      if(!l || l.type !== "character") return;
      const n = runText(l).replace(/\(.*?\)/g, "").replace(/\s+/g, " ").trim().toUpperCase();
      if(n) counts[n] = (counts[n] || 0) + 1;
    });
    const chars = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 4)
      .map((n) => ({ name: n.charAt(0) + n.slice(1).toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase()) }));
    return {
      title: tp.title || T.title || "",
      logline: meta.logline || doc.logline || "",
      synopsis: meta.synopsis || doc.synopsis || "",
      writer: tp.name || "",
      contact: tp.contact || "",
      chars
    };
  }

  /* ---------------- Rendering ---------------- */
  const IMG = {}; // imageId -> { src } | { pending:true }
  function loadImg(id){
    if(!id || IMG[id]) return;
    IMG[id] = { pending:true };
    apiGet("image", { imageId:id }).then((res) => {
      if(!res || res.ok === false){ delete IMG[id]; return; }
      IMG[id] = { src:"data:" + res.mime + ";base64," + res.dataB64 };
      document.querySelectorAll(`img[data-img="${id}"]`).forEach((im) => { im.src = IMG[id].src; });
    });
  }
  function elDom(el){
    const d = document.createElement("div");
    d.className = "el el-" + el.t; d.dataset.id = el.id;
    d.style.cssText = `left:${el.x}mm;top:${el.y}mm;width:${el.w}mm;height:${el.h}mm;z-index:${el.z || 1};`;
    if(el.t === "text"){
      d.classList.add("ts-" + (el.s || "body"));
      d.textContent = el.text || "";
      if(el.ph) d.dataset.ph = el.ph;
      if(el.align) d.style.textAlign = el.align;
      if(el.color) d.style.color = el.color;
    }else if(el.t === "image"){
      if(el.img){
        const im = document.createElement("img"); im.dataset.img = el.img; im.alt = "";
        im.style.objectPosition = `${el.fx != null ? el.fx : 50}% ${el.fy != null ? el.fy : 50}%`;
        if(IMG[el.img] && IMG[el.img].src) im.src = IMG[el.img].src; else loadImg(el.img);
        d.appendChild(im);
      }else d.classList.add("empty");
      if(el.dim){ const o = document.createElement("div"); o.className = "dim"; o.style.background = `rgba(0,0,0,${el.dim})`; d.appendChild(o); }
    }else if(el.t === "shape"){
      d.style.background = el.fill || "#000";
    }
    return d;
  }
  function pageDom(page){
    const p = document.createElement("div");
    p.className = "tpage" + (page.bg && page.bg.tone === "light" ? " light" : "");
    p.style.background = (page.bg && page.bg.color) || "#0e0e0d";
    page.els.slice().sort((a, b) => (a.z || 0) - (b.z || 0)).forEach((el) => p.appendChild(elDom(el)));
    return p;
  }
  function mountScaled(host, page, widthPx){
    const s = widthPx / PAGE_WPX;
    host.innerHTML = "";
    const p = pageDom(page); p.style.transform = `scale(${s})`;
    host.appendChild(p);
    return s;
  }

  function curPage(){ return T.pages[T.cur]; }
  function renderStage(){
    const wrap = document.getElementById("stageWrap"), stage = document.getElementById("stage");
    const s = Math.min((wrap.clientWidth - 56) / PAGE_WPX, (wrap.clientHeight - 56) / PAGE_HPX);
    stage.style.width = PAGE_WPX * s + "px"; stage.style.height = PAGE_HPX * s + "px";
    if(curPage()) mountScaled(stage, curPage(), PAGE_WPX * s);
  }
  function renderAll(){ renderNav(); renderStage(); renderRight(); updateUndoState(); }

  /* ---------------- Left rail: pages ---------------- */
  let __dragPage = -1;
  function renderNav(){
    const rail = document.getElementById("leftRail");
    rail.innerHTML = `<div class="rail-label">PAGES</div>`;
    T.pages.forEach((pg, i) => {
      const item = document.createElement("div");
      item.className = "navItem" + (i === T.cur ? " active" : "");
      item.draggable = true;
      item.innerHTML = `<div class="navThumb"></div>
        <div class="navMeta"><span class="num">${String(i + 1).padStart(2, "0")}</span><span class="name">${esc(pg.name)}</span>
          <span class="acts">
            <button class="miniBtn dup" type="button" title="Duplicate page">${ICON.dup}</button>
            <button class="miniBtn del" type="button" title="Delete page">${ICON.trash}</button>
          </span></div>`;
      const thumb = item.querySelector(".navThumb");
      rail.appendChild(item);
      mountScaled(thumb, pg, 208);
      item.onclick = (e) => { if(e.target.closest("button, input")) return; T.cur = i; renderAll(); };
      item.querySelector(".name").ondblclick = (e) => { e.stopPropagation(); startRename(item.querySelector(".name"), i); };
      item.querySelector(".dup").onclick = (e) => { e.stopPropagation(); duplicatePage(i); };
      item.querySelector(".del").onclick = (e) => { e.stopPropagation(); deletePage(i); };
      item.addEventListener("dragstart", (e) => { __dragPage = i; item.classList.add("dragging"); try{ e.dataTransfer.setData("text/plain", String(i)); }catch(_e){} });
      item.addEventListener("dragend", () => { item.classList.remove("dragging"); __dragPage = -1; });
      item.addEventListener("dragover", (e) => { if(__dragPage < 0 || __dragPage === i) return; e.preventDefault(); item.classList.add("dragOver"); });
      item.addEventListener("dragleave", () => item.classList.remove("dragOver"));
      item.addEventListener("drop", (e) => { e.preventDefault(); item.classList.remove("dragOver"); if(__dragPage >= 0 && __dragPage !== i) movePage(__dragPage, i); });
    });
    const add = document.createElement("button");
    add.type = "button"; add.id = "addPageBtn";
    add.innerHTML = `${ICON.plus} Add page`;
    add.onclick = () => openLayoutPicker((key) => addPage(key));
    rail.appendChild(add);
  }
  function refreshCurThumb(){
    const items = document.querySelectorAll("#leftRail .navItem");
    const it = items[T.cur]; if(it) mountScaled(it.querySelector(".navThumb"), curPage(), 208);
  }
  function startRename(span, i){
    const pg = T.pages[i];
    span.innerHTML = `<input type="text" value="${esc(pg.name)}" maxlength="40">`;
    const inp = span.querySelector("input"); inp.focus(); inp.select();
    const done = (save) => { const v = inp.value.trim(); if(save && v && v !== pg.name){ commit(() => { pg.name = v; }); } renderAll(); };
    inp.onkeydown = (e) => { e.stopPropagation(); if(e.key === "Enter") done(true); if(e.key === "Escape") done(false); };
    inp.onblur = () => done(true);
  }

  /* ---------------- Page management ---------------- */
  function addPage(layout){
    commit(() => {
      const pg = makePage(LAYOUTS[layout].name, layout, scriptData(T.script));
      T.pages.splice(T.cur + 1, 0, pg); T.cur++;
    });
    renderAll();
  }
  function duplicatePage(i){
    commit(() => {
      const c = clone(T.pages[i]); c.id = uid(); c.name = T.pages[i].name + " copy";
      c.els.forEach((el) => { el.id = uid(); });
      T.pages.splice(i + 1, 0, c); T.cur = i + 1;
    });
    renderAll();
  }
  function deletePage(i){
    if(T.pages.length <= 1){ notify("A treatment needs at least one page.", true); return; }
    commit(() => { T.pages.splice(i, 1); if(T.cur >= T.pages.length) T.cur = T.pages.length - 1; else if(T.cur > i) T.cur--; });
    renderAll();
    notify("Page deleted · Undo to bring it back");
  }
  function movePage(from, to){
    commit(() => {
      const curId = curPage().id;
      const [pg] = T.pages.splice(from, 1); T.pages.splice(to, 0, pg);
      T.cur = T.pages.findIndex((p) => p.id === curId);
    });
    renderAll();
  }
  function relayoutPage(layout){
    const pg = curPage();
    commit(() => {
      const fresh = makePage(pg.name, layout, scriptData(T.script));
      pg.layout = layout; pg.els = fresh.els; pg.bg = fresh.bg;
    });
    renderAll();
  }

  function openLayoutPicker(onPick, title){
    const shade = document.createElement("div");
    shade.className = "modalShade";
    shade.innerHTML = `<div class="modalBox"><h3>${esc(title || "Add a page")}</h3><div class="hint">Pick a layout. Spacing, margins and image crops are handled for you.</div>
      <div class="layoutGrid"></div><div class="modalBtns"><button class="btn" type="button" data-x>Cancel</button></div></div>`;
    const grid = shade.querySelector(".layoutGrid");
    PICKER_ORDER.forEach((key) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "layoutOpt";
      b.innerHTML = `<div class="navThumb"></div><span>${esc(LAYOUTS[key].name)}</span>`;
      grid.appendChild(b);
      b.onclick = () => { shade.remove(); onPick(key); };
      requestAnimationFrame(() => mountScaled(b.querySelector(".navThumb"), makePage("", key, {}), b.querySelector(".navThumb").clientWidth || 160));
    });
    const close = () => shade.remove();
    shade.querySelector("[data-x]").onclick = close;
    shade.addEventListener("mousedown", (e) => { if(e.target === shade) close(); });
    shade.addEventListener("keydown", (e) => { if(e.key === "Escape") close(); });
    document.body.appendChild(shade);
    shade.querySelector("[data-x]").focus();
  }

  /* ---------------- Right rail ---------------- */
  function renderRight(){
    const pg = curPage(), rail = document.getElementById("rightRail");
    if(!pg){ rail.innerHTML = ""; return; }
    rail.innerHTML = `
      <div>
        <div class="section-title">PAGE</div>
        <label>Name</label><input type="text" id="rpName" value="${esc(pg.name)}" maxlength="40">
        <label>Layout</label>
        <select id="rpLayout">${PICKER_ORDER.map((k) => `<option value="${k}"${k === pg.layout ? " selected" : ""}>${esc(LAYOUTS[k].name)}</option>`).join("")}</select>
        <label>Background</label>
        <div class="swatches">${BG_PRESETS.map((b, i) => `<button type="button" class="swatch${pg.bg.color === b.color ? " selected" : ""}" data-i="${i}" title="${b.name}" style="background:${b.color}"></button>`).join("")}</div>
      </div>
      <div class="divider">
        <div class="section-title">TREATMENT</div>
        <button class="btn" type="button" id="rpRebuild" style="width:100%">Rebuild from screenplay…</button>
        <div class="hint" style="margin-top:8px">Pulls title, logline, synopsis and characters from the script. Anything the script doesn't have stays blank.</div>
      </div>`;
    const nm = document.getElementById("rpName");
    nm.onchange = () => { const v = nm.value.trim(); if(v && v !== pg.name){ commit(() => { pg.name = v; }); renderNav(); } };
    nm.onkeydown = (e) => { e.stopPropagation(); if(e.key === "Enter") nm.blur(); };
    document.getElementById("rpLayout").onchange = (e) => {
      const k = e.target.value;
      if(confirm("Switch this page to “" + LAYOUTS[k].name + "”? Its current content is replaced (Undo brings it back).")) relayoutPage(k);
      else e.target.value = pg.layout;
    };
    rail.querySelectorAll(".swatch").forEach((b) => {
      b.onclick = () => { const p = BG_PRESETS[Number(b.dataset.i)]; commit(() => { pg.bg = Object.assign({}, pg.bg, { color:p.color, tone:p.tone }); }); renderStage(); refreshCurThumb(); renderRight(); };
    });
    document.getElementById("rpRebuild").onclick = () => {
      if(!confirm("Replace the whole treatment with a fresh one built from the screenplay? (Undo brings the current one back.)")) return;
      commit(() => { T.pages = defaultTreatment(scriptData(T.script)); T.cur = 0; });
      renderAll(); notify("Treatment rebuilt from the screenplay");
    };
  }

  /* ---------------- Undo / redo + save ---------------- */
  function snap(){ return JSON.stringify({ pages:T.pages, cur:T.cur }); }
  function commit(fn){
    T.undo.push(snap()); if(T.undo.length > 100) T.undo.shift();
    T.redo = [];
    fn();
    markDirty();
  }
  function restore(s){ const o = JSON.parse(s); T.pages = o.pages; T.cur = Math.min(o.cur, T.pages.length - 1); }
  function undo(){ if(!T.undo.length) return; T.redo.push(snap()); restore(T.undo.pop()); markDirty(); renderAll(); }
  function redo(){ if(!T.redo.length) return; T.undo.push(snap()); restore(T.redo.pop()); markDirty(); renderAll(); }
  function updateUndoState(){
    document.getElementById("undoBtn").disabled = !T.undo.length;
    document.getElementById("redoBtn").disabled = !T.redo.length;
  }

  // Batch A: saved in this browser per script. Batch D adds Drive + live collaboration.
  const LOCAL_PREFIX = "RIPPLE_TREATMENT_LOCAL_V1:";
  const localKey = () => LOCAL_PREFIX + (T.fileId || "none");
  let __saveT = 0, __dirty = false;
  function markDirty(){ __dirty = true; setStatus("Saving…"); clearTimeout(__saveT); __saveT = setTimeout(flushSave, 600); }
  function flushSave(){
    if(!__dirty) return;
    try{ localStorage.setItem(localKey(), JSON.stringify({ v:1, pages:T.pages, savedAt:Date.now() })); __dirty = false; setStatus("Saved ✓"); }
    catch(_e){ setStatus("Couldn't save on this device (browser storage is full or blocked).", true); }
  }
  window.addEventListener("pagehide", flushSave);

  /* ---------------- Preview & PDF ---------------- */
  let __pv = 0;
  function openPreview(){ __pv = T.cur; document.getElementById("preview").classList.add("show"); renderPreview(); }
  function closePreview(){ document.getElementById("preview").classList.remove("show"); }
  function renderPreview(){
    const st = document.getElementById("pvStage");
    const s = Math.min(innerWidth / PAGE_WPX, innerHeight / PAGE_HPX);
    st.style.width = PAGE_WPX * s + "px"; st.style.height = PAGE_HPX * s + "px";
    mountScaled(st, T.pages[__pv], PAGE_WPX * s);
    document.getElementById("pvPos").textContent = (__pv + 1) + " / " + T.pages.length;
  }
  function stepPreview(d){ __pv = Math.max(0, Math.min(T.pages.length - 1, __pv + d)); renderPreview(); }
  function exportPdf(){
    const root = document.getElementById("printRoot");
    root.innerHTML = "";
    T.pages.forEach((pg) => root.appendChild(pageDom(pg)));
    const pending = Object.values(IMG).some((x) => x.pending);
    if(pending) notify("Waiting for images to load…");
    const go = () => { document.title = T.title + " — Treatment"; window.print(); };
    // Fonts + images must be ready, or the PDF gets fallback type / blank frames
    Promise.all([document.fonts ? document.fonts.ready : null, ...Array.from(root.querySelectorAll("img")).map((im) => im.complete ? null : new Promise((r) => { im.onload = im.onerror = r; }))])
      .then(() => setTimeout(go, 50));
  }

  /* ---------------- Boot ---------------- */
  async function boot(){
    const r = route();
    T.fileId = r.fileId;
    if(!T.fileId && !r.pid){ showFatal("Open the Treatment from a script (File › Treatment in the editor)."); return; }
    const loadRes = await apiGet("load", T.fileId ? { fileId:T.fileId } : { pid:r.pid });
    if(!loadRes || loadRes.ok === false){ showFatal((loadRes && loadRes.error) || "Couldn't open that script."); return; }
    T.fileId = loadRes.fileId || T.fileId;
    T.script = loadRes.doc || {};
    T.title = (T.script.title && T.script.title.title) || String(loadRes.name || "").replace(/\.json$/i, "") || "Untitled Script";
    document.getElementById("pageTitle").textContent = T.title + " — Treatment";
    document.title = T.title + " · Treatment — Ripple";
    const q = "?fileId=" + encodeURIComponent(T.fileId) + cloudParam();
    document.getElementById("scriptLink").href = "editor.html" + q;
    document.getElementById("sbLink").href = "storyboard.html" + q;

    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(localKey()) || "null"); }catch(_e){}
    if(saved && Array.isArray(saved.pages) && saved.pages.length){ T.pages = saved.pages; setStatus("Saved ✓"); }
    else{ T.pages = defaultTreatment(scriptData(T.script)); markDirty(); }
    __z = Math.max(0, ...T.pages.flatMap((p) => p.els.map((e) => e.z || 0)));

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("undoBtn").onclick = undo;
    document.getElementById("redoBtn").onclick = redo;
    document.getElementById("previewBtn").onclick = openPreview;
    document.getElementById("exportBtn").onclick = exportPdf;
    document.getElementById("pvPrev").onclick = () => stepPreview(-1);
    document.getElementById("pvNext").onclick = () => stepPreview(1);
    document.getElementById("pvClose").onclick = closePreview;
    renderAll();
  }

  let __rsT = 0;
  window.addEventListener("resize", () => { clearTimeout(__rsT); __rsT = setTimeout(() => { renderStage(); if(document.getElementById("preview").classList.contains("show")) renderPreview(); }, 120); });

  document.addEventListener("keydown", (e) => {
    if(document.querySelector(".modalShade")) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "select" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if(document.getElementById("preview").classList.contains("show")){
      if(e.key === "Escape") closePreview();
      else if(["arrowright","pagedown"," "].includes(k)){ e.preventDefault(); stepPreview(1); }
      else if(["arrowleft","pageup"].includes(k)){ e.preventDefault(); stepPreview(-1); }
      return;
    }
    if(mod && k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(mod && ((k === "z" && e.shiftKey) || k === "y")){ e.preventDefault(); redo(); return; }
    if(mod && k === "p"){ e.preventDefault(); exportPdf(); return; }
    if(k === "pagedown" || k === "arrowdown"){ e.preventDefault(); if(T.cur < T.pages.length - 1){ T.cur++; renderAll(); } }
    if(k === "pageup" || k === "arrowup"){ e.preventDefault(); if(T.cur > 0){ T.cur--; renderAll(); } }
